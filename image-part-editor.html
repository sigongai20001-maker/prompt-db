<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 부분수정 프롬프트 생성기</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.35.0/tabler-icons.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-soft: #f1f4f7;
      --surface-raised: #ffffff;
      --text: #17202a;
      --text-strong: #0f1720;
      --muted: #5d6877;
      --border: #d8dee7;
      --border-strong: #bdc6d2;
      --button: #1d2733;
      --button-hover: #111923;
      --button-text: #ffffff;
      --button-soft: #eef2f6;
      --button-soft-hover: #e4e9ef;
      --button-soft-text: #18212c;
      --disabled: #aeb8c4;
      --danger: #c43636;
      --danger-soft: #fff0f0;
      --danger-button: #c43636;
      --danger-button-hover: #aa2c2c;
      --danger-button-text: #ffffff;
      --accent: #1D9E75;
      --accent-soft: #E1F5EE;
      --accent-text: #085041;
      --focus: #2474d7;
      --code-bg: #101820;
      --code-text: #e9f0f7;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --overlay: rgba(8, 13, 18, 0.5);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #101418;
      --surface: #171d23;
      --surface-soft: #1f2730;
      --surface-raised: #1a2128;
      --text: #dce3ea;
      --text-strong: #f5f7fa;
      --muted: #a7b2bf;
      --border: #303a45;
      --border-strong: #43505d;
      --button: #e8eef4;
      --button-hover: #ffffff;
      --button-text: #101418;
      --button-soft: #232c35;
      --button-soft-hover: #2d3742;
      --button-soft-text: #eef3f8;
      --disabled: #687482;
      --danger: #ff8a8a;
      --danger-soft: #3a1e22;
      --danger-button: #ff8a8a;
      --danger-button-hover: #ffa0a0;
      --danger-button-text: #1c0b0b;
      --accent: #28bd8e;
      --accent-soft: #123b31;
      --accent-text: #b9f2de;
      --focus: #74a9ff;
      --code-bg: #070a0d;
      --code-text: #eef6ff;
      --overlay: rgba(0, 0, 0, 0.68);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app {
      width: min(1380px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 104px;
    }

    .topbar,
    .panel-header,
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar {
      align-items: flex-start;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      color: var(--text-strong);
      font-size: 28px;
      font-weight: 760;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .theme-toggle {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .theme-toggle:hover {
      background: var(--surface-soft);
      border-color: var(--border-strong);
    }

    .panel {
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-raised);
    }

    .panel-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--text-strong);
      font-size: 16px;
      font-weight: 720;
    }

    .panel-body {
      padding: 16px;
    }

    .input-area {
      width: 100%;
      min-height: 132px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    .input-area:focus,
    .field:focus,
    .table-description:focus,
    .move-input:focus {
      border-color: var(--focus);
      outline: 2px solid color-mix(in srgb, var(--focus) 24%, transparent);
      outline-offset: 1px;
    }

    .error-message {
      display: none;
      margin: 12px 0 0;
      padding: 10px 12px;
      border: 1px solid var(--danger);
      border-radius: var(--radius-sm);
      background: var(--danger-soft);
      color: var(--danger);
      font-weight: 650;
    }

    .error-message.is-visible {
      display: block;
    }

    .hint {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .actions {
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-sm);
      padding: 0 14px;
      background: var(--button-soft);
      color: var(--button-soft-text);
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn.icon-only {
      width: 40px;
      padding: 0;
    }

    .btn:hover:not(:disabled) {
      background: var(--button-soft-hover);
    }

    .btn.primary {
      background: var(--button);
      color: var(--button-text);
    }

    .btn.primary:hover:not(:disabled) {
      background: var(--button-hover);
    }

    .btn.generate-action {
      background: var(--danger-button);
      color: var(--danger-button-text);
    }

    .btn.generate-action:hover:not(:disabled) {
      background: var(--danger-button-hover);
    }

    .btn:disabled {
      background: var(--button-soft);
      color: var(--disabled);
      cursor: not-allowed;
    }

    .status-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-weight: 700;
    }

    .status-line.is-error {
      color: var(--danger);
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
    }

    .part-controls {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 520px;
    }

    .filter-label {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .filter-pill {
      min-height: 34px;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--button-soft-text);
      cursor: pointer;
      font-weight: 800;
      white-space: nowrap;
    }

    .filter-pill.is-active {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .summary-table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
    }

    .summary-table th,
    .summary-table td {
      border-bottom: 1px solid var(--border);
      padding: 10px;
      vertical-align: top;
      text-align: left;
    }

    .summary-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface-soft);
      color: var(--text-strong);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .summary-table tr:last-child td {
      border-bottom: 0;
    }

    .summary-table tr.is-changed td {
      background: var(--accent-soft);
    }

    .summary-table tr.is-child td {
      background: color-mix(in srgb, var(--surface-soft) 58%, var(--surface));
    }

    .summary-table tr.is-locked td {
      background: color-mix(in srgb, var(--surface-soft) 82%, var(--surface));
    }

    .col-state {
      width: 86px;
    }

    .col-location {
      width: 110px;
    }

    .col-id {
      width: 210px;
    }

    .col-name {
      width: 170px;
    }

    .col-content {
      min-width: 420px;
    }

    .col-tools {
      width: 300px;
    }

    .location-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 3px 9px;
      background: var(--surface-soft);
      color: var(--text-strong);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .part-id {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .part-name {
      color: var(--text-strong);
      font-weight: 760;
      overflow-wrap: anywhere;
    }

    .part-child-wrap {
      position: relative;
      display: grid;
      gap: 4px;
      padding-left: 16px;
      border-left: 2px solid var(--accent);
    }

    .child-badge {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--accent-soft);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 800;
    }

    .pattern-badge {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      background: color-mix(in srgb, #7c3aed 18%, var(--surface));
      color: #6d28d9;
      font-size: 12px;
      font-weight: 800;
    }

    [data-theme="dark"] .pattern-badge {
      background: color-mix(in srgb, #a78bfa 22%, var(--surface));
      color: #ddd6fe;
    }

    .part-parent {
      margin-top: 4px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .lock-note {
      display: none;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .lock-note.is-visible {
      display: block;
    }

    .changed-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 9px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .changed-badge.is-on {
      background: var(--accent);
      color: #ffffff;
    }

    .table-description,
    .field,
    .pattern-select,
    .pattern-direct,
    .move-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .table-description {
      min-height: 74px;
      resize: vertical;
      padding: 9px 10px;
      line-height: 1.45;
      overflow: hidden;
    }

    .field,
    .pattern-select,
    .pattern-direct,
    .move-input {
      height: 40px;
      padding: 0 10px;
    }

    .pattern-editor {
      display: grid;
      grid-template-columns: minmax(92px, 0.7fr) minmax(130px, 1fr) minmax(130px, 1fr);
      gap: 10px;
      align-items: start;
    }

    .pattern-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .pattern-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .pattern-direct {
      display: none;
      margin-top: 6px;
    }

    .pattern-direct.is-visible {
      display: block;
    }

    .changed-control {
      border-color: var(--accent) !important;
      background: var(--accent-soft) !important;
      color: var(--accent-text) !important;
    }

    .table-description:disabled,
    .field:disabled,
    .pattern-select:disabled,
    .pattern-direct:disabled,
    .move-input:disabled {
      background: var(--surface-soft);
      color: var(--muted);
      cursor: not-allowed;
    }

    .tool-stack {
      display: grid;
      gap: 8px;
    }

    .tool-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    .summary-text {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cancel-row {
      justify-self: end;
    }

    .empty-state {
      margin: 0;
      padding: 28px 18px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      color: var(--muted);
      text-align: center;
      background: var(--surface);
    }

    .result-shell {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--code-bg);
    }

    pre {
      margin: 0;
      min-height: 180px;
      max-height: 560px;
      padding: 14px;
      overflow: auto;
      color: var(--code-text);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre;
    }

    .copy-feedback {
      min-width: 64px;
      color: var(--accent-text);
      font-size: 13px;
      font-weight: 800;
      text-align: right;
    }

    .copy-feedback:empty {
      display: none;
    }

    .floating-actionbar {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 15;
      width: min(720px, calc(100% - 32px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      transform: translateX(-50%);
    }

    .floating-actionbar .btn {
      min-width: 250px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--overlay);
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal {
      width: min(760px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      background: var(--surface);
      overflow: hidden;
    }

    .modal-header,
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface-raised);
    }

    .modal-header {
      border-bottom: 1px solid var(--border);
    }

    .modal-footer {
      border-top: 1px solid var(--border);
    }

    .modal-title {
      margin: 0;
      color: var(--text-strong);
      font-size: 17px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .modal-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
    }

    .modal-body {
      padding: 16px;
      overflow: auto;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .detail-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .label-key {
      min-width: 0;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }

    .unit {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .move-field {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-raised);
    }

    .move-icon {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      background: var(--surface-soft);
      color: var(--text-strong);
      flex: 0 0 auto;
    }

    .move-name {
      color: var(--text-strong);
      font-size: 13px;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .move-input {
      text-align: right;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 780px) {
      .app {
        width: min(100% - 20px, 1380px);
        padding-top: 16px;
      }

      .topbar,
      .panel-header,
      .actions,
      .modal-header,
      .modal-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .theme-toggle {
        align-self: flex-end;
      }

      .button-row,
      .btn {
        width: 100%;
      }

      .floating-actionbar {
        width: calc(100% - 20px);
        bottom: 10px;
        align-items: stretch;
        flex-direction: column;
      }

      .floating-actionbar .btn {
        min-width: 0;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .pattern-editor {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>이미지 부분수정 프롬프트 생성기</h1>
        <p class="subtitle">붙여넣으면 자동으로 표를 불러오고, 변경된 파트만 이미지 수정용 JSON으로 정리합니다.</p>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
        <i class="ti ti-moon" aria-hidden="true"></i>
      </button>
    </header>

    <section class="panel" aria-labelledby="inputTitle">
      <div class="panel-header">
        <h2 class="panel-title" id="inputTitle"><i class="ti ti-code" aria-hidden="true"></i> JSON 입력</h2>
      </div>
      <div class="panel-body">
        <label class="sr-only" for="jsonInput">분석 JSON</label>
        <textarea id="jsonInput" class="input-area" spellcheck="false" placeholder="{&#10;  &quot;parts&quot;: []&#10;}"></textarea>
        <p class="hint">JSON을 붙여넣으면 자동으로 종합표를 불러옵니다. 코드펜스(```json)도 자동으로 제거합니다.</p>
        <div class="error-message" id="errorMessage" role="alert"></div>
        <div class="actions">
          <div class="button-row">
            <button class="btn primary" id="loadBtn" type="button">
              <i class="ti ti-table-import" aria-hidden="true"></i>
              표 불러오기
            </button>
            <button class="btn" id="resetBtn" type="button" disabled>
              <i class="ti ti-rotate" aria-hidden="true"></i>
              변경 초기화
            </button>
          </div>
          <div class="status-line" id="changeCounter">0개 파트 수정됨</div>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="partsTitle">
      <div class="panel-header">
        <h2 class="panel-title" id="partsTitle"><i class="ti ti-table" aria-hidden="true"></i> 파트 종합표</h2>
        <button class="btn primary generate-action" id="generateBtn" type="button" disabled>
          <i class="ti ti-arrows-move" aria-hidden="true"></i>
          프롬프트 생성
        </button>
      </div>
      <div class="panel-body">
        <div class="part-controls" id="partControls" hidden>
          <div class="filter-row">
            <div class="filter-group">
              <span class="filter-label">카테고리</span>
              <div class="filter-pills" id="categoryFilters" aria-label="카테고리 필터"></div>
            </div>
          </div>
          <div class="filter-row">
            <div class="filter-group">
              <span class="filter-label">위치</span>
              <div class="filter-pills" id="locationFilters" aria-label="위치 필터"></div>
            </div>
            <div class="status-line" id="visibleCounter">0개 표시</div>
          </div>
        </div>
        <div id="partsContainer">
          <p class="empty-state">JSON을 붙여넣으면 파트 종합표가 표시됩니다.</p>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="resultTitle">
      <div class="panel-header">
        <h2 class="panel-title" id="resultTitle"><i class="ti ti-code" aria-hidden="true"></i> 생성 결과</h2>
        <div class="button-row">
          <span class="copy-feedback" id="copyFeedback" aria-live="polite"></span>
          <button class="btn" id="copyBtn" type="button" disabled>
            <i class="ti ti-copy" aria-hidden="true"></i>
            복사
          </button>
        </div>
      </div>
      <div class="panel-body">
        <div class="result-shell">
          <pre><code id="resultCode"></code></pre>
        </div>
      </div>
    </section>

    <div class="floating-actionbar" aria-label="프롬프트 생성 고정 버튼">
      <div class="status-line" id="floatingChangeCounter">0개 파트 수정됨</div>
      <button class="btn primary generate-action" id="floatingGenerateBtn" type="button" disabled>
        <i class="ti ti-arrows-move" aria-hidden="true"></i>
        프롬프트 생성
      </button>
    </div>
  </main>

  <div class="modal-backdrop" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="modalTitle">상세 수정</h2>
          <p class="modal-subtitle" id="modalSubtitle"></p>
        </div>
        <button class="btn icon-only" id="modalCloseBtn" type="button" aria-label="팝업 닫기" title="닫기">
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <div class="status-line" id="modalStatus"></div>
        <div class="button-row">
          <button class="btn" id="modalResetBtn" type="button">
            <i class="ti ti-rotate" aria-hidden="true"></i>
            이 항목 초기화
          </button>
          <button class="btn primary" id="modalDoneBtn" type="button">
            <i class="ti ti-check" aria-hidden="true"></i>
            완료
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "image-part-editor:last-json";
      var THEME_KEY = "image-part-editor:theme";

      var jsonInput = document.getElementById("jsonInput");
      var loadBtn = document.getElementById("loadBtn");
      var resetBtn = document.getElementById("resetBtn");
      var generateBtn = document.getElementById("generateBtn");
      var floatingGenerateBtn = document.getElementById("floatingGenerateBtn");
      var copyBtn = document.getElementById("copyBtn");
      var errorMessage = document.getElementById("errorMessage");
      var partControls = document.getElementById("partControls");
      var categoryFilters = document.getElementById("categoryFilters");
      var locationFilters = document.getElementById("locationFilters");
      var visibleCounter = document.getElementById("visibleCounter");
      var partsContainer = document.getElementById("partsContainer");
      var changeCounter = document.getElementById("changeCounter");
      var floatingChangeCounter = document.getElementById("floatingChangeCounter");
      var resultCode = document.getElementById("resultCode");
      var copyFeedback = document.getElementById("copyFeedback");
      var themeToggle = document.getElementById("themeToggle");
      var detailModal = document.getElementById("detailModal");
      var modalTitle = document.getElementById("modalTitle");
      var modalSubtitle = document.getElementById("modalSubtitle");
      var modalBody = document.getElementById("modalBody");
      var modalStatus = document.getElementById("modalStatus");
      var modalCloseBtn = document.getElementById("modalCloseBtn");
      var modalDoneBtn = document.getElementById("modalDoneBtn");
      var modalResetBtn = document.getElementById("modalResetBtn");

      var state = {
        source: null,
        parts: [],
        edits: [],
        changedCount: 0,
        activeCategory: "all",
        activeLocation: "all",
        expandedParents: {},
        autoLoadTimer: null,
        modal: null
      };

      var directionMeta = [
        { key: "right", label: "오른쪽", icon: "ti-arrow-right", instruction: function (value) { return "move " + value + "mm to the right"; } },
        { key: "left", label: "왼쪽", icon: "ti-arrow-left", instruction: function (value) { return "move " + value + "mm to the left"; } },
        { key: "up", label: "위로", icon: "ti-arrow-up", instruction: function (value) { return "move " + value + "mm upward"; } },
        { key: "down", label: "아래로", icon: "ti-arrow-down", instruction: function (value) { return "move " + value + "mm downward"; } },
        { key: "forward", label: "앞으로", icon: "ti-zoom-in", instruction: function (value) { return "move " + value + "mm forward toward the camera"; } },
        { key: "backward", label: "뒤로", icon: "ti-zoom-out", instruction: function (value) { return "move " + value + "mm backward away from the camera"; } }
      ];

      var patternOptionState = {
        type: ["투각", "음각", "양각", "평면프린트", "라인에칭"],
        style: ["기하학", "아라베스크", "식물문", "격자", "줄무늬"]
      };

      initialize();

      function initialize() {
        applyTheme(localStorage.getItem(THEME_KEY) || "light");

        var savedJson = localStorage.getItem(STORAGE_KEY);
        if (savedJson) {
          jsonInput.value = savedJson;
        }

        loadBtn.addEventListener("click", function () {
          loadPartsFromInput(true);
        });
        resetBtn.addEventListener("click", resetAllChanges);
        generateBtn.addEventListener("click", generatePrompt);
        floatingGenerateBtn.addEventListener("click", generatePrompt);
        copyBtn.addEventListener("click", copyResult);
        themeToggle.addEventListener("click", toggleTheme);
        jsonInput.addEventListener("paste", function () {
          window.setTimeout(function () {
            autoLoadFromInput();
          }, 0);
        });
        jsonInput.addEventListener("input", function () {
          localStorage.setItem(STORAGE_KEY, jsonInput.value);
          scheduleAutoLoad();
        });
        modalCloseBtn.addEventListener("click", closeModal);
        modalDoneBtn.addEventListener("click", closeModal);
        modalResetBtn.addEventListener("click", resetCurrentModalValues);
        detailModal.addEventListener("click", function (event) {
          if (event.target === detailModal) {
            closeModal();
          }
        });
        document.addEventListener("keydown", function (event) {
          if (event.key === "Escape" && detailModal.classList.contains("is-open")) {
            closeModal();
          }
        });
      }

      function scheduleAutoLoad() {
        window.clearTimeout(state.autoLoadTimer);
        state.autoLoadTimer = window.setTimeout(autoLoadFromInput, 450);
      }

      function autoLoadFromInput() {
        if (!jsonInput.value.trim()) {
          return;
        }
        loadPartsFromInput(false);
      }

      function applyTheme(theme) {
        var nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem(THEME_KEY, nextTheme);
        themeToggle.innerHTML = nextTheme === "dark"
          ? '<i class="ti ti-sun" aria-hidden="true"></i>'
          : '<i class="ti ti-moon" aria-hidden="true"></i>';
      }

      function toggleTheme() {
        applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      }

      function loadPartsFromInput(showParseError) {
        clearError();
        resultCode.textContent = "";
        copyFeedback.textContent = "";
        copyBtn.disabled = true;

        var parsed;
        try {
          parsed = JSON.parse(stripCodeFence(jsonInput.value));
        } catch (error) {
          if (showParseError) {
            showError("JSON 파싱 실패: " + error.message);
          }
          return;
        }

        if (!Array.isArray(parsed.parts)) {
          showError("parts 배열을 찾을 수 없습니다");
          return;
        }

        normalizeChildCategories(parsed.parts);
        state.source = parsed;
        state.parts = parsed.parts;
        state.edits = parsed.parts.map(createEditState);
        state.activeCategory = "all";
        state.activeLocation = "all";
        state.expandedParents = {};
        localStorage.setItem(STORAGE_KEY, jsonInput.value);
        renderSummaryTable();
        updateChangeState();
      }

      function stripCodeFence(text) {
        var value = String(text || "").trim();
        if (value.indexOf("```") !== 0) {
          return value;
        }
        value = value.replace(/^```[a-zA-Z0-9_-]*\s*/, "");
        value = value.replace(/\s*```$/, "");
        return value.trim();
      }

      function normalizeChildCategories(parts) {
        var partById = {};
        parts.forEach(function (part, index) {
          partById[getPartId(part, index)] = part;
        });

        parts.forEach(function (part) {
          var parentId = getParentId(part);
          var parent = parentId ? partById[parentId] : null;
          var parentCategory = getDirectCategory(parent);
          if (parent && parentCategory) {
            part.category = parentCategory;
          }
        });
      }

      function createEditState(part) {
        var sizes = {};
        var contentText = getContentText(part);
        var pattern = isPatternPart(part) ? createPatternEditState(part) : null;
        if (isPlainObject(part.real_size_mm)) {
          Object.keys(part.real_size_mm).forEach(function (key) {
            sizes[key] = {
              original: part.real_size_mm[key] == null ? "" : String(part.real_size_mm[key]),
              value: part.real_size_mm[key] == null ? "" : String(part.real_size_mm[key]),
              numeric: isNumericLike(part.real_size_mm[key])
            };
          });
        }

        var moves = {};
        directionMeta.forEach(function (direction) {
          moves[direction.key] = "";
        });

        return {
          contentOriginal: contentText,
          content: contentText,
          pattern: pattern,
          sizes: sizes,
          moves: moves
        };
      }

      function createPatternEditState(part) {
        var pattern = part.pattern || {};
        var density = pattern.density == null ? "" : String(pattern.density);
        var type = pattern.type_ko == null ? "" : compactText(pattern.type_ko);
        var style = pattern.style_ko == null ? "" : compactText(pattern.style_ko);

        ensurePatternOption("type", type);
        ensurePatternOption("style", style);

        return {
          isNew: false,
          densityOriginal: density,
          density: density,
          typeOriginal: type,
          type: type,
          styleOriginal: style,
          style: style
        };
      }

      function createNewPatternEditState() {
        return {
          isNew: true,
          densityOriginal: "",
          density: "",
          typeOriginal: "",
          type: "",
          styleOriginal: "",
          style: ""
        };
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.classList.add("is-visible");
      }

      function clearError() {
        errorMessage.textContent = "";
        errorMessage.classList.remove("is-visible");
      }

      function renderSummaryTable() {
        partsContainer.innerHTML = "";
        renderPartControls();

        if (!state.parts.length) {
          partControls.hidden = true;
          partsContainer.appendChild(createEmptyState("parts 배열이 비어 있습니다."));
          return;
        }

        var visibleIndexes = getSortedPartIndexes();

        if (!visibleIndexes.length) {
          partsContainer.appendChild(createEmptyState("선택한 조건에 맞는 파트가 없습니다."));
          updateVisibleCounter(0);
          return;
        }

        var wrap = createElement("div", "table-wrap");
        var table = createElement("table", "summary-table");
        var thead = document.createElement("thead");
        var tbody = document.createElement("tbody");

        thead.innerHTML = [
          "<tr>",
          '<th class="col-state">상태</th>',
          '<th class="col-location">위치</th>',
          '<th class="col-id">id</th>',
          '<th class="col-name">파트명</th>',
          '<th class="col-content">내용 수정</th>',
          '<th class="col-tools">수치/위치 상세</th>',
          "</tr>"
        ].join("");

        visibleIndexes.forEach(function (index) {
          tbody.appendChild(createTableRow(state.parts[index], index));
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        wrap.appendChild(table);
        partsContainer.appendChild(wrap);
        updateVisibleCounter(visibleIndexes.length);
      }

      function renderPartControls() {
        partControls.hidden = !state.parts.length;
        if (!state.parts.length) {
          return;
        }

        var allIndexes = state.parts.map(function (_part, index) { return index; });
        var categoryCounts = allIndexes.reduce(function (counts, index) {
          var label = getPartCategory(state.parts[index], index);
          counts[label] = (counts[label] || 0) + 1;
          return counts;
        }, {});
        var categoryLabels = Object.keys(categoryCounts).sort(function (a, b) {
          return a.localeCompare(b, "ko");
        });

        if (state.activeCategory !== "all" && !categoryCounts[state.activeCategory]) {
          state.activeCategory = "all";
        }

        var locationBaseIndexes = allIndexes.filter(matchesActiveCategory);
        var locationCounts = locationBaseIndexes.reduce(function (counts, index) {
          var label = getPartLocation(state.parts[index], index).label;
          counts[label] = (counts[label] || 0) + 1;
          return counts;
        }, {});
        var currentLabels = getLocationOrderLabels().filter(function (label) {
          return locationCounts[label];
        });
        Object.keys(locationCounts).forEach(function (label) {
          if (currentLabels.indexOf(label) === -1) {
            currentLabels.push(label);
          }
        });

        if (state.activeLocation !== "all" && !locationCounts[state.activeLocation]) {
          state.activeLocation = "all";
        }

        categoryFilters.innerHTML = "";
        categoryFilters.appendChild(createFilterButton("category", "all", "전체 " + allIndexes.length));
        categoryLabels.forEach(function (label) {
          categoryFilters.appendChild(createFilterButton("category", label, label + " " + categoryCounts[label]));
        });

        locationFilters.innerHTML = "";
        locationFilters.appendChild(createFilterButton("location", "all", "전체 " + locationBaseIndexes.length));
        currentLabels.forEach(function (label) {
          locationFilters.appendChild(createFilterButton("location", label, label + " " + locationCounts[label]));
        });
      }

      function createFilterButton(kind, value, label) {
        var button = createElement("button", "filter-pill", label);
        button.type = "button";
        button.dataset.filterKind = kind;
        button.dataset.filterValue = value;
        button.classList.toggle("is-active", kind === "category" ? state.activeCategory === value : state.activeLocation === value);
        button.addEventListener("click", function () {
          if (kind === "category") {
            state.activeCategory = value;
          } else {
            state.activeLocation = value;
          }
          renderSummaryTable();
          updateChangeState();
        });
        return button;
      }

      function updateVisibleCounter(count) {
        visibleCounter.textContent = count + "개 표시";
      }

      function getCurrentScopeIndexes() {
        return state.parts.map(function (_part, index) { return index; });
      }

      function autoResizeTextarea(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = Math.max(74, textarea.scrollHeight) + "px";
      }

      function createTableRow(part, index) {
        var row = document.createElement("tr");
        row.dataset.index = String(index);

        var stateCell = document.createElement("td");
        var locationCell = document.createElement("td");
        var idCell = document.createElement("td");
        var nameCell = document.createElement("td");
        var contentCell = document.createElement("td");
        var toolsCell = document.createElement("td");
        var badge = createElement("span", "changed-badge", "원본");
        var location = getPartLocation(part, index);
        var locationChip = createElement("span", "location-chip", location.label);
        var idNode = createElement("div", "part-id", getPartId(part, index));
        var nameNode = createElement("div", "part-name", getPartName(part, index));
        var parentId = getParentId(part);
        var edit = state.edits[index];
        var originalPatternPart = isPatternPart(part);
        var patternPart = originalPatternPart || Boolean(edit.pattern && edit.pattern.isNew);
        var tools = createElement("div", "tool-stack");
        var lockState = getPartLockState(index);
        var lockNote = createElement("div", "lock-note");

        row.classList.toggle("is-child", Boolean(parentId));
        row.classList.toggle("is-locked", lockState.locked);
        badge.dataset.role = "badge";
        lockNote.dataset.role = "lock-note";
        lockNote.textContent = lockState.message;
        lockNote.classList.toggle("is-visible", lockState.locked);

        stateCell.appendChild(badge);
        locationCell.appendChild(locationChip);
        idCell.appendChild(idNode);
        if (parentId) {
          var childWrap = createElement("div", "part-child-wrap");
          childWrap.appendChild(createElement("span", "child-badge", "하위"));
          if (patternPart) {
            childWrap.appendChild(createElement("span", "pattern-badge", "패턴"));
          }
          childWrap.appendChild(createElement("div", "part-parent", getParentPathLabel(part) + " >"));
          childWrap.appendChild(nameNode);
          childWrap.appendChild(lockNote);
          nameCell.appendChild(childWrap);
        } else {
          nameCell.appendChild(nameNode);
          nameCell.appendChild(lockNote);
        }
        if (patternPart) {
          contentCell.appendChild(createPatternEditor(index, lockState.locked));
        } else {
          contentCell.appendChild(createContentEditor(index, lockState.locked));
        }
        if (!parentId) {
          var childToggle = createChildToggleRow(index);
          if (childToggle) {
            tools.appendChild(childToggle);
          }
        }
        if (shouldShowPatternAddButton(part, edit)) {
          tools.appendChild(createPatternAddRow(index));
        }
        if (!patternPart) {
          tools.appendChild(createToolRow(index, "size"));
          tools.appendChild(createToolRow(index, "move"));
        }
        tools.appendChild(createCancelRow(index));
        toolsCell.appendChild(tools);

        row.appendChild(stateCell);
        row.appendChild(locationCell);
        row.appendChild(idCell);
        row.appendChild(nameCell);
        row.appendChild(contentCell);
        row.appendChild(toolsCell);
        return row;
      }

      function shouldShowPatternAddButton(part, edit) {
        return Boolean(getParentId(part)) && !isPatternPart(part) && !edit.pattern;
      }

      function createContentEditor(index, locked) {
        var content = createElement("textarea", "table-description");
        content.value = state.edits[index].content;
        content.placeholder = "예: 유리문, 손잡이는 검정";
        content.dataset.role = "content";
        content.dataset.index = String(index);
        content.spellcheck = false;
        content.disabled = locked;
        autoResizeTextarea(content);
        content.addEventListener("input", function () {
          state.edits[index].content = content.value;
          autoResizeTextarea(content);
          updateChangeState();
        });
        return content;
      }

      function createPatternEditor(index, locked) {
        var editor = createElement("div", "pattern-editor");
        editor.appendChild(createPatternDensityField(index, locked));
        editor.appendChild(createPatternSelectField(index, "type", "표현방식"));
        editor.appendChild(createPatternSelectField(index, "style", "스타일"));
        setPatternEditorLocked(editor, locked);
        return editor;
      }

      function createPatternDensityField(index, locked) {
        var edit = state.edits[index].pattern;
        var field = createElement("label", "pattern-field");
        var label = createElement("span", "pattern-label", "밀도");
        var input = createElement("input", "field");

        input.type = "number";
        input.inputMode = "decimal";
        input.step = "any";
        input.min = "0";
        input.value = edit.density;
        input.placeholder = edit.isNew ? "예: 20" : "";
        input.dataset.role = "pattern-density";
        input.disabled = locked;
        input.addEventListener("input", function () {
          edit.density = input.value;
          updateChangeState();
        });

        field.appendChild(label);
        field.appendChild(input);
        return field;
      }

      function createPatternSelectField(index, kind, labelText) {
        var edit = state.edits[index].pattern;
        var field = createElement("div", "pattern-field");
        var label = createElement("span", "pattern-label", labelText);
        var select = createElement("select", "pattern-select");
        var direct = createElement("input", "pattern-direct");

        select.dataset.role = "pattern-" + kind;
        select.dataset.patternKind = kind;
        populatePatternSelect(select, kind, edit[kind]);
        select.addEventListener("change", function () {
          if (select.value === "__custom__") {
            direct.value = "";
            direct.classList.add("is-visible");
            direct.focus();
            return;
          }
          edit[kind] = select.value;
          direct.value = "";
          direct.classList.remove("is-visible");
          updateChangeState();
        });

        direct.type = "text";
        direct.placeholder = labelText + " 직접 입력";
        direct.dataset.role = "pattern-" + kind + "-custom";
        direct.addEventListener("change", function () {
          applyCustomPatternOption(index, kind, select, direct);
        });
        direct.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            applyCustomPatternOption(index, kind, select, direct);
          }
        });

        field.appendChild(label);
        field.appendChild(select);
        field.appendChild(direct);
        return field;
      }

      function populatePatternSelect(select, kind, selectedValue) {
        var value = String(selectedValue || "");
        select.innerHTML = "";
        select.appendChild(createOption("", "선택 안 함"));
        ensurePatternOption(kind, value);
        patternOptionState[kind].forEach(function (optionValue) {
          select.appendChild(createOption(optionValue, optionValue));
        });
        select.appendChild(createOption("__custom__", "직접 입력"));
        select.value = value;
      }

      function createOption(value, label) {
        var option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        return option;
      }

      function applyCustomPatternOption(index, kind, select, direct) {
        var value = compactText(direct.value);
        if (!value) {
          populatePatternSelect(select, kind, state.edits[index].pattern[kind]);
          direct.classList.remove("is-visible");
          return;
        }
        ensurePatternOption(kind, value);
        state.edits[index].pattern[kind] = value;
        populatePatternSelect(select, kind, value);
        direct.value = "";
        direct.classList.remove("is-visible");
        updateChangeState();
      }

      function setPatternEditorLocked(editor, locked) {
        Array.prototype.forEach.call(editor.querySelectorAll("input, select"), function (control) {
          control.disabled = locked;
        });
      }

      function createChildToggleRow(index) {
        var parentId = getPartId(state.parts[index], index);
        var childCount = getVisibleChildIndexes(parentId).length;
        if (!childCount) {
          return null;
        }

        var expanded = Boolean(state.expandedParents[parentId]);
        var row = createElement("div", "tool-row");
        var summary = createElement("div", "summary-text", expanded ? childCount + "개 하위 파트 펼쳐짐" : "하위 파트 접힘");
        var button = createElement("button", "btn", expanded ? "하위 " + childCount + "개 접기" : "하위 " + childCount + "개 보기");
        button.type = "button";
        button.dataset.action = "children";
        button.dataset.index = String(index);
        button.prepend(createIcon(expanded ? "ti-chevron-up" : "ti-chevron-down"));
        button.addEventListener("click", function () {
          state.expandedParents[parentId] = !state.expandedParents[parentId];
          renderSummaryTable();
          updateChangeState();
        });

        row.appendChild(summary);
        row.appendChild(button);
        return row;
      }

      function createPatternAddRow(index) {
        var row = createElement("div", "tool-row");
        var summary = createElement("div", "summary-text", "패턴 없음");

        button.addEventListener("click", function () {
          if (getPartLockState(index).locked) {

      function createToolRow(index, type) {

      function createCancelRow(index) {
