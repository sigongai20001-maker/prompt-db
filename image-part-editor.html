      }

      function getSortedPartIndexes() {
        var result = [];
        var rootIndexes = state.parts
          .map(function (_part, index) { return index; })
          .filter(function (index) { return getParentId(state.parts[index]) === ""; });
        var sortedRoots = sortPartIndexes(rootIndexes);
        var knownRootIds = sortedRoots.map(function (index) { return getPartId(state.parts[index], index); });
        var filterActive = hasActiveFilters();

        sortedRoots.forEach(function (rootIndex) {
          var rootId = getPartId(state.parts[rootIndex], rootIndex);
          var childIndexes = getVisibleChildIndexes(rootId);
          var rootMatches = matchesFilters(rootIndex);
          var shouldShowChildren = Boolean(state.expandedParents[rootId]);

          if (!filterActive || rootMatches || childIndexes.length) {
            result.push(rootIndex);
          }
          if (shouldShowChildren) {
            childIndexes.forEach(function (childIndex) {
              result.push(childIndex);
            });
          }
        });

        sortPartIndexes(state.parts
          .map(function (_part, index) { return index; })
          .filter(function (index) {
            var parentId = getParentId(state.parts[index]);
            return parentId && knownRootIds.indexOf(parentId) === -1 && matchesFilters(index);
          }))
          .forEach(function (index) {
            result.push(index);
          });

        return result;
      }

      function getVisibleChildIndexes(parentId) {
        var childIndexes = getChildIndexes(parentId);
        if (hasActiveFilters()) {
          childIndexes = childIndexes.filter(matchesFilters);
        }
        return sortPartIndexes(childIndexes);
      }

      function sortPartIndexes(indexes) {
        return indexes.slice().sort(function (a, b) {
          var locationA = getPartLocation(state.parts[a], a);
          var locationB = getPartLocation(state.parts[b], b);
          if (locationA.order !== locationB.order) {
            return locationA.order - locationB.order;
          }
          return getBboxSortValue(state.parts[a]) - getBboxSortValue(state.parts[b]) || a - b;
        });
      }

      function hasActiveFilters() {
        return state.activeCategory !== "all" || state.activeLocation !== "all";
      }

      function matchesFilters(index) {
        return matchesActiveCategory(index) && matchesActiveLocation(index);
      }

      function matchesActiveCategory(index) {
        return state.activeCategory === "all" ||
          getPartCategory(state.parts[index], index) === state.activeCategory;
      }

      function matchesActiveLocation(index) {
        return state.activeLocation === "all" ||
          getPartLocation(state.parts[index], index).label === state.activeLocation;
      }

      function getPartCategory(part, index) {
        var direct = getDirectCategory(part);
        var parentId = getParentId(part);
        var guard = 0;

        if (direct) {
          return direct;
        }

        while (parentId && guard < state.parts.length) {
          var parentIndex = getPartIndexById(parentId);
          if (parentIndex < 0 || parentIndex === index) {
            break;
          }

          direct = getDirectCategory(state.parts[parentIndex]);
          if (direct) {
            return direct;
          }

          parentId = getParentId(state.parts[parentIndex]);
          guard += 1;
        }

        return "기타";
      }

      function getDirectCategory(part) {
        var keys = ["category", "category_ko", "category_name", "group", "type"];
        for (var i = 0; i < keys.length; i += 1) {
          var value = part && part[keys[i]];
          if (Array.isArray(value)) {
            value = value.join(" ");
          }
          if (value != null && compactText(value) !== "") {
            return compactText(value);
          }
        }
        return "";
      }

      function getLocationOrderLabels() {
        return ["천장", "우측", "좌측", "전면", "후면", "벽면", "중앙", "바닥", "가구/집기", "기타"];
      }

      function getPartLocation(part, index) {
        var categoryLocation = getLocationFromCategory(getPartCategory(part, index));
        if (categoryLocation) {
          return categoryLocation;
        }

        var text = [
          getPartId(part, index),
          getPartName(part, index),
          part && part.description,
          getShapeText(part)
        ].join(" ").toLowerCase();

        var rules = [
          { label: "천장", order: 10, keywords: ["천장", "천정", "ceiling", "top", "상부"] },
          { label: "우측", order: 20, keywords: ["우측", "오른쪽", "오른", "right"] },
          { label: "좌측", order: 30, keywords: ["좌측", "왼쪽", "왼", "left"] },
          { label: "전면", order: 35, keywords: ["전면", "앞면", "앞쪽", "front"] },
          { label: "후면", order: 40, keywords: ["후면", "뒷면", "뒤쪽", "back", "rear"] },
          { label: "벽면", order: 45, keywords: ["벽면", "벽", "wall"] },
          { label: "중앙", order: 50, keywords: ["중앙", "센터", "center", "middle"] },
          { label: "바닥", order: 60, keywords: ["바닥", "floor", "ground"] },
          { label: "가구/집기", order: 70, keywords: ["가구", "집기", "테이블", "의자", "소파", "책상", "선반", "furniture", "table", "chair", "sofa", "shelf"] }
        ];

        for (var i = 0; i < rules.length; i += 1) {
          if (rules[i].keywords.some(function (keyword) { return text.indexOf(keyword) !== -1; })) {
            return { label: rules[i].label, order: rules[i].order };
          }
        }

        return inferLocationFromBbox(part) || { label: "기타", order: 90 };
      }

      function getLocationFromCategory(category) {
        var label = compactText(category);
        var orders = {
          "천장": 10,
          "천정": 10,
          "우측": 20,
          "오른쪽": 20,
          "좌측": 30,
          "왼쪽": 30,
          "전면": 35,
          "후면": 40,
          "벽면": 45,
          "중앙": 50,
          "바닥": 60,
          "가구/집기": 70,
          "기타": 90
        };

        if (!Object.prototype.hasOwnProperty.call(orders, label)) {
          return null;
        }

        return {
          label: label === "천정" ? "천장" : label === "오른쪽" ? "우측" : label === "왼쪽" ? "좌측" : label,
          order: orders[label]
        };
      }

      function inferLocationFromBbox(part) {
        if (!Array.isArray(part && part.bbox_px) || part.bbox_px.length < 4) {
          return null;
        }

        var x1 = Number(part.bbox_px[0]);
        var y1 = Number(part.bbox_px[1]);
        var x2 = Number(part.bbox_px[2]);
        var y2 = Number(part.bbox_px[3]);
        if (![x1, y1, x2, y2].every(Number.isFinite)) {
          return null;
        }

        var centerX = (x1 + x2) / 2;
        var centerY = (y1 + y2) / 2;
        var extent = getBboxCanvasExtent();
        var width = extent.width;
        var height = extent.height;

        if (centerY <= height * 0.22) {
          return { label: "천장", order: 10 };
        }
        if (centerY >= height * 0.78) {
          return { label: "바닥", order: 60 };
        }
        if (centerX >= width * 0.68) {
          return { label: "우측", order: 20 };
        }
        if (centerX <= width * 0.32) {
          return { label: "좌측", order: 30 };
        }

        return { label: "중앙", order: 50 };
      }

      function getBboxCanvasExtent() {
        var width = 1;
        var height = 1;

        state.parts.forEach(function (part) {
          if (!Array.isArray(part && part.bbox_px) || part.bbox_px.length < 4) {
            return;
          }

          var x2 = Number(part.bbox_px[2]);
          var y2 = Number(part.bbox_px[3]);
          if (Number.isFinite(x2)) {
            width = Math.max(width, x2);
          }
          if (Number.isFinite(y2)) {
            height = Math.max(height, y2);
          }
        });

        return { width: width, height: height };
      }

      function getBboxSortValue(part) {
        if (!Array.isArray(part && part.bbox_px) || part.bbox_px.length < 4) {
          return 0;
        }

        var x1 = Number(part.bbox_px[0]);
        var y1 = Number(part.bbox_px[1]);
        return (Number.isFinite(y1) ? y1 : 0) * 100000 + (Number.isFinite(x1) ? x1 : 0);
      }

      function openModal(index, type) {
        if (getPartLockState(index).locked) {
          return;
        }

        var part = state.parts[index];
        state.modal = { index: index, type: type };
        modalTitle.textContent = type === "size" ? "수치 상세 입력" : "위치 이동 상세 입력";
        modalSubtitle.textContent = getPartId(part, index) + " / " + getPartName(part, index);
        modalResetBtn.innerHTML = '<i class="ti ti-rotate" aria-hidden="true"></i>이 항목 초기화';
        modalDoneBtn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>완료';
        modalBody.innerHTML = "";

        if (type === "size") {
          renderSizeModal(index);
        } else {
          renderMoveModal(index);
        }

        updateModalStatus();
        detailModal.classList.add("is-open");
      }

      function renderSizeModal(index) {
        var edit = state.edits[index];
        var keys = Object.keys(edit.sizes);
        if (!keys.length) {
          modalBody.appendChild(createEmptyState("이 파트에는 real_size_mm 값이 없습니다."));
          return;
        }

        var grid = createElement("div", "detail-grid");
        keys.forEach(function (key) {
          var item = edit.sizes[key];
          var wrap = createElement("label", "detail-field");
          var label = createElement("span", "field-label");
          var keyNode = createElement("span", "label-key", key);
          var unitNode = createElement("span", "unit", "mm");
          var input = createElement("input", "field");

          input.type = item.numeric ? "number" : "text";
          input.inputMode = item.numeric ? "decimal" : "text";
          input.step = "any";
          input.value = item.value;
          input.dataset.key = key;
          input.addEventListener("input", function () {
            edit.sizes[key].value = input.value;
            updateChangeState();
            updateModalStatus();
            input.classList.toggle("changed-control", isSizeChanged(edit.sizes[key]));
          });

          label.appendChild(keyNode);
          label.appendChild(unitNode);
          wrap.appendChild(label);
          wrap.appendChild(input);
          grid.appendChild(wrap);
          input.classList.toggle("changed-control", isSizeChanged(item));
        });
        modalBody.appendChild(grid);
      }

      function renderMoveModal(index) {
        var edit = state.edits[index];
        if (!hasPositionInfo(state.parts[index])) {
          modalBody.appendChild(createEmptyState("이 파트에는 위치 이동 기준 정보가 없습니다."));
          return;
        }

        var grid = createElement("div", "detail-grid");
        directionMeta.forEach(function (direction) {
          var label = createElement("label", "move-field");
          var iconBox = createElement("span", "move-icon");
          var name = createElement("span", "move-name", direction.label);
          var input = createElement("input", "move-input");
          var unit = createElement("span", "unit", "mm");

          input.type = "number";
          input.inputMode = "decimal";
          input.step = "any";
          input.min = "0";
          input.placeholder = "0";
          input.value = edit.moves[direction.key] || "";
          input.dataset.direction = direction.key;
          input.addEventListener("input", function () {
            edit.moves[direction.key] = input.value;
            updateChangeState();
            updateModalStatus();
            input.classList.toggle("changed-control", isMoveValueChanged(input.value));
          });

          iconBox.appendChild(createIcon(direction.icon));
          label.appendChild(iconBox);
          label.appendChild(name);
          label.appendChild(input);
          label.appendChild(unit);
          grid.appendChild(label);
          input.classList.toggle("changed-control", isMoveValueChanged(input.value));
        });
        modalBody.appendChild(grid);
      }

      function closeModal() {
        detailModal.classList.remove("is-open");
        state.modal = null;
      }

      function resetCurrentModalValues() {
        if (!state.modal) {
          return;
        }

        var edit = state.edits[state.modal.index];
        if (state.modal.type === "size") {
          Object.keys(edit.sizes).forEach(function (key) {
            edit.sizes[key].value = edit.sizes[key].original;
          });
        } else {
          Object.keys(edit.moves).forEach(function (key) {
            edit.moves[key] = "";
          });
        }

        openModal(state.modal.index, state.modal.type);
        updateChangeState();
      }

      function updateChangeState() {
        var changedCount = 0;
        var groupStates = getGroupStates();

        state.edits.forEach(function (edit, index) {
          var row = partsContainer.querySelector('tr[data-index="' + index + '"]');
          var changed = isPartChanged(index);
          var lockState = getPartLockState(index, groupStates);
          if (changed) {
            changedCount += 1;
          }

          if (row) {
            row.classList.toggle("is-changed", changed);
            row.classList.toggle("is-locked", lockState.locked);
            var content = row.querySelector('[data-role="content"]');
            var badge = row.querySelector('[data-role="badge"]');
            var sizeSummary = row.querySelector('[data-role="size-summary"]');
            var moveSummary = row.querySelector('[data-role="move-summary"]');
            var cancelButton = row.querySelector('[data-role="cancel"]');
            var lockNote = row.querySelector('[data-role="lock-note"]');
            var sizeButton = row.querySelector('button[data-action="size"]');
            var moveButton = row.querySelector('button[data-action="move"]');
            var patternAddButton = row.querySelector('button[data-action="pattern-add"]');
            if (content) {
              content.disabled = lockState.locked;
              content.classList.toggle("changed-control", isContentChanged(edit));
              autoResizeTextarea(content);
            }
            updatePatternControls(row, edit, lockState.locked);
            badge.classList.toggle("is-on", changed);
            badge.textContent = changed ? "수정됨" : "원본";
            if (sizeSummary) {
              sizeSummary.textContent = getSizeSummary(index);
            }
            if (moveSummary) {
              moveSummary.textContent = getMoveSummary(index);
            }
            if (cancelButton) {
              cancelButton.disabled = !changed && !isNewPatternActive(edit);
            }
            if (sizeButton) {
              sizeButton.disabled = lockState.locked;
            }
            if (moveButton) {
              moveButton.disabled = lockState.locked;
            }
            if (patternAddButton) {
              patternAddButton.disabled = lockState.locked;
            }
            if (lockNote) {
              lockNote.textContent = lockState.message;
              lockNote.classList.toggle("is-visible", lockState.locked);
            }
          }
        });

        state.changedCount = changedCount;
        changeCounter.textContent = changedCount + "개 파트 수정됨";
        floatingChangeCounter.textContent = changedCount + "개 파트 수정됨";
        generateBtn.disabled = changedCount === 0;
        floatingGenerateBtn.disabled = changedCount === 0;
        resetBtn.disabled = !state.source;
      }

      function updatePatternControls(row, edit, locked) {
        if (!edit.pattern) {
          return;
        }

        var density = row.querySelector('[data-role="pattern-density"]');
        var typeSelect = row.querySelector('[data-role="pattern-type"]');
        var styleSelect = row.querySelector('[data-role="pattern-style"]');
        var typeCustom = row.querySelector('[data-role="pattern-type-custom"]');
        var styleCustom = row.querySelector('[data-role="pattern-style-custom"]');

        if (density) {
          density.disabled = locked;
          density.classList.toggle("changed-control", isPatternDensityChanged(edit.pattern));
        }
        if (typeSelect) {
          populatePatternSelect(typeSelect, "type", edit.pattern.type);
          typeSelect.disabled = locked;
          typeSelect.classList.toggle("changed-control", isPatternTypeChanged(edit.pattern));
        }
        if (styleSelect) {
          populatePatternSelect(styleSelect, "style", edit.pattern.style);
          styleSelect.disabled = locked;
          styleSelect.classList.toggle("changed-control", isPatternStyleChanged(edit.pattern));
        }
        if (typeCustom) {
          typeCustom.disabled = locked;
        }
        if (styleCustom) {
          styleCustom.disabled = locked;
        }
      }

      function updateModalStatus() {
        if (!state.modal) {
          return;
        }

        var index = state.modal.index;
        modalStatus.textContent = state.modal.type === "size" ? getSizeSummary(index) : getMoveSummary(index);
      }

      function getSizeSummary(index) {
        var edit = state.edits[index];
        var keys = Object.keys(edit.sizes);
        if (!keys.length) {
          return "수치 없음";
        }

        var changed = keys.filter(function (key) {
          return isSizeChanged(edit.sizes[key]);
        });

        return changed.length ? changed.length + "개 수치 변경" : keys.length + "개 수치";
      }

      function getMoveSummary(index) {
        if (!hasPositionInfo(state.parts[index])) {
          return "위치 정보 없음";
        }

        var edit = state.edits[index];
        var changed = directionMeta.filter(function (direction) {
          return isMoveValueChanged(edit.moves[direction.key]);
        });

        return changed.length ? changed.map(function (direction) {
          return direction.label + " " + edit.moves[direction.key] + "mm";
        }).join(", ") : "이동 없음";
      }

      function getGroupStates() {
        var groups = {};

        state.parts.forEach(function (part, index) {
          if (getParentId(part)) {
            return;
          }

          var partId = getPartId(part, index);
          groups[partId] = {
            parentIndex: index,
            childIndexes: [],
            parentChanged: false,
            childChanged: false
          };
        });

        state.parts.forEach(function (part, index) {
          var parentId = getParentId(part);
          if (!parentId) {
            return;
          }

          var parentIndex = getPartIndexById(parentId);
          if (parentIndex < 0) {
            return;
          }

          if (!groups[parentId]) {
            groups[parentId] = {
              parentIndex: parentIndex,
              childIndexes: [],
              parentChanged: false,
              childChanged: false
            };
          }
          groups[parentId].childIndexes.push(index);
        });

        Object.keys(groups).forEach(function (groupId) {
          var group = groups[groupId];
          group.parentChanged = group.parentIndex >= 0 && isPartChanged(group.parentIndex);
          group.childChanged = group.childIndexes.some(isPartChanged);
        });

        return groups;
      }

      function getPartLockState(index, groups) {
        var part = state.parts[index];
        var parentId = getParentId(part);
        var groupMap = groups || getGroupStates();

        if (parentId) {
          var childGroup = groupMap[parentId];
          if (childGroup && childGroup.parentChanged) {
            return {
              locked: true,
              message: "상위가 수정됨 — 하위는 상위 기준으로 무시됨"
            };
          }
          return { locked: false, message: "" };
        }

        var partId = getPartId(part, index);
        var parentGroup = groupMap[partId];
        if (parentGroup && parentGroup.childChanged) {
          return {
            locked: true,
            message: "하위 요소 수정 중 — 상위는 잠김"
          };
        }

        return { locked: false, message: "" };
      }

      function isPartChanged(index) {
        var edit = state.edits[index];
        return isContentChanged(edit) ||
          isPatternChanged(edit.pattern) ||
          Object.keys(edit.sizes).some(function (key) { return isSizeChanged(edit.sizes[key]); }) ||
          Object.keys(edit.moves).some(function (key) { return isMoveValueChanged(edit.moves[key]); });
      }

      function isContentChanged(edit) {
        return String(edit.content) !== String(edit.contentOriginal);
      }

      function isPatternChanged(pattern) {
        if (pattern && pattern.isNew) {
          return hasNewPatternValues(pattern);
        }
        return isPatternDensityChanged(pattern) ||
          isPatternTypeChanged(pattern) ||
          isPatternStyleChanged(pattern);
      }

      function isPatternDensityChanged(pattern) {
        if (pattern && pattern.isNew) {
          return compactText(pattern.density) !== "";
        }
        return Boolean(pattern) && String(pattern.density) !== String(pattern.densityOriginal);
      }

      function isPatternTypeChanged(pattern) {
        if (pattern && pattern.isNew) {
          return compactText(pattern.type) !== "";
        }
        return Boolean(pattern) && String(pattern.type) !== String(pattern.typeOriginal);
      }

      function isPatternStyleChanged(pattern) {
        if (pattern && pattern.isNew) {
          return compactText(pattern.style) !== "";
        }
        return Boolean(pattern) && String(pattern.style) !== String(pattern.styleOriginal);
      }

      function isNewPatternActive(edit) {
        return Boolean(edit && edit.pattern && edit.pattern.isNew);
      }

      function hasNewPatternValues(pattern) {
        return Boolean(pattern) && (
          compactText(pattern.density) !== "" ||
          compactText(pattern.type) !== "" ||
          compactText(pattern.style) !== ""
        );
      }

      function isSizeChanged(item) {
        return String(item.value) !== String(item.original);
      }

      function isMoveValueChanged(value) {
        var trimmed = String(value || "").trim();
        if (trimmed === "") {
          return false;
        }

        var number = Number(trimmed);
        if (!Number.isFinite(number)) {
          return true;
        }

        return number !== 0;
      }

      function resetAllChanges() {
        state.edits = state.parts.map(createEditState);
        renderSummaryTable();
        resultCode.textContent = "";
        copyFeedback.textContent = "";
        copyBtn.disabled = true;
        updateChangeState();
      }

      function resetPartChanges(index) {
        state.edits[index] = createEditState(state.parts[index]);
        resultCode.textContent = "";
        copyFeedback.textContent = "";
        copyBtn.disabled = true;

        if (state.modal && state.modal.index === index) {
          openModal(index, state.modal.type);
        } else {
          renderSummaryTable();
        }

        updateChangeState();
      }

      function generatePrompt() {
        if (!state.source) {
          return;
        }

        var promptPlan = buildPromptPlan();
        var modify = promptPlan.modifyIndexes.map(function (index) {
          return buildModifyEntry(index, {
            regenerateChildren: Boolean(promptPlan.regenerateChildren[index])
          });
        }).filter(Boolean);

        var output = {
          "/imagine": true,
          image_edit_instruction: {
            version: "3.0",
            edit_summary: buildEditSummary(modify),
            base_image: "업로드한 원본 이미지",
            modify: modify,
            preserve_ids: promptPlan.preserveIds,
            preserve_note: "preserve_ids의 모든 파트는 원본 이미지와 동일하게 위치·크기·형태·외형을 유지한다.",
            lock_rule: cloneValue(getLockRule())
          },
          quality_checks: [
            "modify에 명시된 부분만 수정",
            "preserve_ids의 모든 파트는 원본과 동일 유지",
            "원본 카메라 앵글·구도·조명 방향 유지"
          ],
          global_style_lock: cloneValue(state.source.global_style_lock),
          generation_instruction: "위 modify의 한글 지시대로 해당 부분만 수정하고, preserve_ids와 global_style_lock은 원본과 동일하게 유지한다. 풀 해상도 이미지 1장만 출력. 그리드·콜라주·복수 이미지·텍스트 금지."
        };

        removeUndefined(output);
        resultCode.textContent = JSON.stringify(output, null, 2);
        copyFeedback.textContent = "";
        copyBtn.disabled = false;
      }

      function buildPromptPlan() {
        var groupStates = getGroupStates();
        var modifyIndexes = [];
        var excludePreserve = {};
        var handled = {};
        var regenerateChildren = {};

        Object.keys(groupStates).forEach(function (groupId) {
          var group = groupStates[groupId];
          var memberIndexes = [group.parentIndex].concat(group.childIndexes).filter(function (index) {
            return index >= 0;
          });

          memberIndexes.forEach(function (index) {
            handled[index] = true;
          });

          if (group.parentChanged) {
            modifyIndexes.push(group.parentIndex);
            memberIndexes.forEach(function (index) {
              excludePreserve[index] = true;
            });
            if (group.childIndexes.length) {
              regenerateChildren[group.parentIndex] = true;
            }
            return;
          }

          group.childIndexes.forEach(function (childIndex) {
            if (isPartChanged(childIndex)) {
              modifyIndexes.push(childIndex);
              excludePreserve[childIndex] = true;
            }
          });
        });

        state.parts.forEach(function (_part, index) {
          if (handled[index] || !isPartChanged(index)) {
            return;
          }
          modifyIndexes.push(index);
          excludePreserve[index] = true;
        });

        return {
          modifyIndexes: modifyIndexes,
          regenerateChildren: regenerateChildren,
          preserveIds: state.parts
            .map(function (part, index) {
              return excludePreserve[index] ? null : getPartId(part, index);
            })
            .filter(function (id) {
              return id !== null && id !== "";
            })
        };
      }

      function buildModifyEntry(index) {
        var options = arguments.length > 1 && arguments[1] ? arguments[1] : {};
        var part = state.parts[index];
        var edit = state.edits[index];
        var changes = [];
        var summary = [];

        if (isContentChanged(edit)) {
          changes.push({
            field: "내용",
            before: getOutputBeforeText(edit.contentOriginal),
            after: edit.content
          });
          summary.push("내용을 \"" + compactText(edit.content) + "\"로 변경");
        }

        var patternChange = buildPatternChange(edit.pattern);
        if (patternChange) {
          changes.push(patternChange.change);
          summary.push(patternChange.summary);
        }

        Object.keys(edit.sizes).forEach(function (key) {
          var item = edit.sizes[key];
          if (!isSizeChanged(item)) {
            return;
          }

          var before = item.numeric ? toNumberOrString(item.original) : item.original;
          var after = item.numeric ? toNumberOrString(item.value) : item.value.trim();
          changes.push({
            field: "치수",
            key: key,
            before: before,
            after: after,
            unit: "mm"
          });
          summary.push(key + " 치수를 " + String(before) + "mm에서 " + String(after) + "mm로 변경");
        });

        directionMeta.forEach(function (direction) {
          var value = edit.moves[direction.key];
          if (!isMoveValueChanged(value)) {
            return;
          }

          var distance = toNumberOrString(value);
          changes.push({
            field: "위치",
            direction: direction.label,
            distance_mm: distance
          });
          summary.push(direction.label + "으로 " + String(distance) + "mm 이동");
        });

        var entry = {
          target_id: getPartId(part, index),
          name_ko: getPartName(part, index),
          changes: changes,
          detail: buildModifyDetail(getPartId(part, index) + " " + getPartName(part, index), summary)
        };

        if (options.regenerateChildren) {
          entry.detail += " 하위 요소는 상위 변경에 맞게 재생성.";
          entry.child_handling = "하위 요소는 상위 변경에 맞게 재생성";
        }

        if (getParentId(part)) {
          entry.parent_id = getParentId(part);
          entry.target_path = getParentPathLabel(part) + " > " + getPartName(part, index);
          entry.target_path_ids = [
            getParentId(part),
            getPartId(part, index)
          ];
          entry.detail = buildModifyDetail(entry.target_path, summary);
        }

        return entry;
      }

      function buildModifyDetail(targetLabel, summary) {
        var summaryText = summary.join(", ");
        var spacer = /[.!?]$/.test(summaryText) ? " " : ". ";
        return targetLabel + " 항목을 다음과 같이 수정: " + summaryText + spacer + "나머지 파트는 원본 이미지와 동일하게 유지.";
      }

      function buildPatternChange(pattern) {
        if (!pattern || !isPatternChanged(pattern)) {
          return null;
        }

        if (pattern.isNew) {
          return buildNewPatternChange(pattern);
        }

        return buildExistingPatternChange(pattern);
      }

      function buildExistingPatternChange(pattern) {
        var change = { field: "패턴" };
        var instructions = [];
        if (isPatternDensityChanged(pattern)) {
          var densityBefore = toNumberOrString(pattern.densityOriginal);
          var densityAfter = toNumberOrString(pattern.density);
          change["밀도_기준"] = densityBefore;
          change["밀도_목표"] = densityAfter;
          instructions.push(buildDensityChangeInstruction(densityBefore, densityAfter));
        }
        if (isPatternTypeChanged(pattern)) {
          var typeBefore = getPatternValueText(pattern.typeOriginal);
          var typeAfter = getPatternValueText(pattern.type);
          change["표현방식_기준"] = typeBefore;
          change["표현방식_목표"] = typeAfter;
          instructions.push("표현방식은 " + typeBefore + "에서 " + appendKoreanRo(typeAfter) + " 변경.");
        }
        if (isPatternStyleChanged(pattern)) {
          var styleBefore = getPatternValueText(pattern.styleOriginal);
          var styleAfter = getPatternValueText(pattern.style);
          change["스타일_기준"] = styleBefore;
          change["스타일_목표"] = styleAfter;
          instructions.push("스타일은 " + styleBefore + "에서 " + appendKoreanRo(styleAfter) + " 변경.");
        }
        change["지시"] = instructions.join(" ");

        return {
          change: change,
          summary: change["지시"]
        };
      }

      function buildNewPatternChange(pattern) {
        var change = { field: "패턴추가" };
        var density = compactText(pattern.density);
        var type = compactText(pattern.type);
        var style = compactText(pattern.style);

        if (density) {
          change["밀도_목표"] = toNumberOrString(density);
        }
        if (type) {
          change["표현방식"] = type;
        }
        if (style) {
          change["스타일"] = style;
        }

        change["지시"] = buildNewPatternInstruction(change["밀도_목표"], type, style);

        return {
          change: change,
          summary: change["지시"]
        };
      }

      function buildDensityChangeInstruction(before, after) {
        var beforeNumber = Number(before);
        var afterNumber = Number(after);
        if (Number.isFinite(beforeNumber) && Number.isFinite(afterNumber) && beforeNumber !== 0) {
          var percent = Math.round(Math.abs(afterNumber - beforeNumber) / Math.abs(beforeNumber) * 100);
          if (afterNumber > beforeNumber) {
            return "기준 밀도 " + String(before) + " → 목표 " + String(after) + ", 약 " + percent + "% 증가 수준으로 무늬 개수를 늘리고 간격을 촘촘하게 한다.";
          }
          if (afterNumber < beforeNumber) {
            return "기준 밀도 " + String(before) + " → 목표 " + String(after) + ", 약 " + percent + "% 감소 수준으로 무늬 개수를 줄이고 간격을 넓힌다.";
          }
          return "기준 밀도 " + String(before) + " → 목표 " + String(after) + " 수준으로 무늬 밀도를 유지한다.";
        }

        if (Number.isFinite(beforeNumber) && Number.isFinite(afterNumber)) {
          return "기준 밀도 " + String(before) + " → 목표 " + String(after) + " 수준으로 무늬 밀도를 설정한다.";
        }

        return "밀도는 기준 " + getPatternValueText(before) + "에서 목표 " + getPatternValueText(after) + "로 변경.";
      }

      function buildNewPatternInstruction(density, type, style) {
        var objectPhrase = style || type
          ? compactText((style ? style + " 스타일의 " : "") + (type ? type + " " : "") + "무늬")
          : "새 패턴";
        var densityPhrase = density !== undefined && density !== ""
          ? "밀도 " + String(density) + " 수준으로 "
          : "";

        return compactText("이 파트 표면에 " + appendKoreanEul(objectPhrase) + " " + densityPhrase + "새로 추가한다.") + " 기존에 없던 패턴을 신규로 부여.";
      }

      function getPatternValueText(value) {
        var text = compactText(value);
        return text || "없음";
      }

      function appendKoreanEul(value) {
        var text = compactText(value);
        var last = text.charAt(text.length - 1);
        var code = last.charCodeAt(0);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          return text + ((code - 0xAC00) % 28 ? "을" : "를");
        }
        return text + "을";
      }

      function buildEditSummary(modify) {
        var names = modify.map(function (item) {
          return item.name_ko || item.target_id;
        });
        return modify.length + "개 파트 부분수정: " + names.join(", ");
      }

      function getLockRule() {
        if (state.source && Object.prototype.hasOwnProperty.call(state.source, "lock_rule")) {
          return state.source.lock_rule;
        }
        if (state.source && state.source.image_reference && Object.prototype.hasOwnProperty.call(state.source.image_reference, "lock_rule")) {
          return state.source.image_reference.lock_rule;
        }
        return undefined;
      }

      function copyResult() {
        var text = resultCode.textContent;
        if (!text) {
          return;
        }

        copyFeedback.textContent = "";
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied, fallbackCopy);
        } else {
          fallbackCopy();
        }
      }

      function fallbackCopy() {
        var helper = document.createElement("textarea");
        helper.value = resultCode.textContent;
        helper.setAttribute("readonly", "");
        helper.style.position = "fixed";
        helper.style.left = "-9999px";
        document.body.appendChild(helper);
        helper.select();
        try {
          document.execCommand("copy");
          showCopied();
        } catch (error) {
          copyFeedback.textContent = "실패";
        }
        document.body.removeChild(helper);
      }

      function showCopied() {
        copyFeedback.textContent = "복사됨";
        copyBtn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>복사됨';
        window.setTimeout(function () {
          copyBtn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i>복사';
          copyFeedback.textContent = "";
        }, 1400);
      }

      function hasPositionInfo(part) {
        return hasOwn(part, "bbox_px") ||
          hasOwn(part, "position") ||
          hasOwn(part, "position_px") ||
          hasOwn(part, "position_mm") ||
          hasOwn(part, "location") ||
          hasOwn(part, "center_px") ||
          hasOwn(part, "anchor_px");
      }

      function hasOwn(object, key) {
        return Object.prototype.hasOwnProperty.call(object || {}, key);
      }

      function getParentId(part) {
        if (part && part.parent_id != null && String(part.parent_id).trim() !== "") {
          return String(part.parent_id);
        }
        return "";
      }

      function isPatternPart(part) {
        return isPlainObject(part && part.pattern);
      }

      function ensurePatternOption(kind, value) {
        var list = patternOptionState[kind];
        var text = compactText(value);
        if (!list || !text || list.indexOf(text) !== -1) {
          return;
        }
        list.push(text);
      }

      function getContentText(part) {
        if (!part) {
          return "";
        }

        var value = part.shape_ko;
        if (value == null) {
          value = part.description;
        }
        if (value == null) {
          return "";
        }
        return typeof value === "string" ? value : JSON.stringify(value);
      }

      function getShapeText(part) {
        if (!part) {
          return "";
        }

        var value = part.shape_ko;
        if (value == null) {
          value = part.shape;
        }
        if (value == null) {
          return "";
        }
        return typeof value === "string" ? value : JSON.stringify(value);
      }

      function getOutputBeforeText(value) {
        var text = String(value == null ? "" : value);
        return /[A-Za-z]{3,}/.test(text) ? "원본 내용" : text;
      }

      function getParentPathLabel(part) {
        var parentIndex = getPartIndexById(getParentId(part));
        if (parentIndex < 0) {
          return getParentId(part);
        }
        return getPartName(state.parts[parentIndex], parentIndex);
      }

      function getChildIndexes(parentId) {
        return state.parts
          .map(function (_part, index) { return index; })
          .filter(function (index) {
            return getParentId(state.parts[index]) === parentId;
          });
      }

      function getPartIndexById(id) {
        var target = String(id || "");
        for (var i = 0; i < state.parts.length; i += 1) {
          if (getPartId(state.parts[i], i) === target) {
            return i;
          }
        }
        return -1;
      }

      function getPartId(part, index) {
        if (part && part.id != null && String(part.id).trim() !== "") {
          return String(part.id);
        }
        return "part_" + (index + 1);
      }

      function getPartName(part, index) {
        if (part && part.name_ko != null && String(part.name_ko).trim() !== "") {
          return String(part.name_ko);
        }
        if (part && part.name != null && String(part.name).trim() !== "") {
          return String(part.name);
        }
        return getPartId(part, index);
      }

      function isPlainObject(value) {
        return value !== null && typeof value === "object" && !Array.isArray(value);
      }

      function isNumericLike(value) {
        if (typeof value === "number") {
          return Number.isFinite(value);
        }
        if (typeof value !== "string") {
          return false;
        }
        return /^-?\d+(\.\d+)?$/.test(value.trim());
      }

      function toNumberOrString(value) {
        var text = String(value == null ? "" : value).trim();
        var number = Number(text);
        return text !== "" && Number.isFinite(number) ? number : text;
      }

      function compactText(value) {
        return String(value || "").replace(/\s+/g, " ").trim();
      }

      function appendKoreanRo(value) {
        var text = compactText(value);
        var last = text.charAt(text.length - 1);
        var code = last.charCodeAt(0);
        if (code >= 0xAC00 && code <= 0xD7A3) {
          var finalConsonant = (code - 0xAC00) % 28;
          return text + (finalConsonant && finalConsonant !== 8 ? "으로" : "로");
        }
        return text + "로";
      }

      function cloneValue(value) {
        if (value === undefined) {
          return undefined;
        }
        return JSON.parse(JSON.stringify(value));
      }

      function removeUndefined(value) {
        if (!value || typeof value !== "object") {
          return value;
        }
        Object.keys(value).forEach(function (key) {
          if (value[key] === undefined) {
            delete value[key];
            return;
          }
          removeUndefined(value[key]);
        });
        return value;
      }

      function createElement(tagName, className, text) {
        var element = document.createElement(tagName);
        if (className) {
          element.className = className;
        }
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      }

      function createIcon(iconName) {
        var icon = createElement("i", "ti " + iconName);
        icon.setAttribute("aria-hidden", "true");
        return icon;
      }

      function createEmptyState(text) {
        return createElement("p", "empty-state", text);
      }
    }());
  </script>
</body>
</html>
