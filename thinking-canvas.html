          y: Math.round((Number(source.y) || 0) + 48)
        };
        pushUndoSnapshot(createUndoSnapshot());
        store.data.blocks.push(copy);
        setSelection([copy.id]);
        renderAll();
        saveLocalState();
        showToast("블록을 복사했습니다.");
      }

      function copySelectedBlocksToClipboard() {
        var selectedIds = getSelectedBlockIds();
        if (!selectedIds.length) {
          return;
        }
        var selectedIdSet = new Set(selectedIds);
        var blocks = selectedIds.map(function (id) {
          var block = getBlock(id);
          return block ? cloneBlockForClipboard(block) : null;
        }).filter(Boolean);
        var connections = store.data.connections.filter(function (connection) {
          return selectedIdSet.has(connection.from) && selectedIdSet.has(connection.to);
        }).map(function (connection) {
          return {
            from: connection.from,
            to: connection.to,
            label: getConnectionLabel(connection),
            ioType: getConnectionIoType(connection)
          };
        });
        store.clipboard = {
          blocks: blocks,
          connections: connections,
          pasteCount: 1
        };
        showToast(blocks.length > 1 ? blocks.length + "개 블록을 복사했습니다." : "블록을 복사했습니다.");
      }

      function pasteBlocksFromClipboard() {
        if (!store.clipboard || !store.clipboard.blocks || !store.clipboard.blocks.length) {
          showToast("복사된 블록이 없습니다.");
          return;
        }
        var offset = 48 * Math.max(1, store.clipboard.pasteCount || 1);
        var idMap = new Map();
        var pastedIds = [];
        pushUndoSnapshot(createUndoSnapshot());
        store.clipboard.blocks.forEach(function (source) {
          var block = {
            id: createUniqueBlockId(),
            title: source.title,
            subtitle: source.subtitle || "",
            detail: source.detail,
            link: String(source.link || ""),
            tool: normalizeTool(source.tool),
            images: cloneBlockImages(source.images),
            htmlFiles: cloneBlockHtmlFiles(source.htmlFiles),
            innerDiagram: cloneInnerDiagram(source.innerDiagram),
            startDate: normalizeDateString(source.startDate),
            dueDate: normalizeDateString(source.dueDate),
            status: normalizeScheduleStatus(source.status),
            done: Boolean(source.done),
            highlight: Boolean(source.highlight),
            category: source.category,
            type: normalizeBlockType(source.type),
            parentId: "",
            children: normalizeBlockType(source.type) === "group" ? [] : [],
            inheritColor: normalizeBlockColorInheritance(source),
            color: validColor(source.color) ? source.color : getCategoryColor(source.category),
            width: finiteNumber(source.width) ? Number(source.width) : undefined,
            height: finiteNumber(source.height) ? Number(source.height) : undefined,
            x: Math.round((Number(source.x) || 0) + offset),
            y: Math.round((Number(source.y) || 0) + offset)
          };
          idMap.set(source.id, block.id);
          pastedIds.push(block.id);
          store.data.blocks.push(block);
        });
        store.clipboard.blocks.forEach(function (source) {
          var pastedId = idMap.get(source.id);
          var pastedBlock = getBlock(pastedId);
          var pastedParentId = idMap.get(source.parentId);
          if (pastedBlock && pastedParentId && isGroupBlock(getBlock(pastedParentId))) {
            pastedBlock.parentId = pastedParentId;
          }
        });
        store.clipboard.connections.forEach(function (connection) {
          var from = idMap.get(connection.from);
          var to = idMap.get(connection.to);
          if (from && to) {
            store.data.connections.push({ from: from, to: to, label: getConnectionLabel(connection), ioType: getConnectionIoType(connection) });
          }
        });
        store.clipboard.pasteCount = (store.clipboard.pasteCount || 1) + 1;
        setSelection(pastedIds);
        store.focusTitleBlockId = pastedIds.length === 1 ? pastedIds[0] : null;
        renderAll();
        saveLocalState();
        showToast(pastedIds.length > 1 ? pastedIds.length + "개 블록을 붙여넣었습니다." : "블록을 붙여넣었습니다.");
      }

      function cloneBlockForClipboard(block) {
        return {
          id: block.id,
          title: String(block.title || ""),
          subtitle: String(block.subtitle || ""),
          detail: String(block.detail || ""),
          link: String(block.link || ""),
          tool: normalizeTool(block.tool),
          images: getBlockImages(block),
          htmlFiles: getBlockHtmlFiles(block),
          innerDiagram: cloneInnerDiagram(block.innerDiagram),
          startDate: normalizeDateString(block.startDate),
          dueDate: normalizeDateString(block.dueDate),
          status: normalizeScheduleStatus(block.status),
          done: Boolean(block.done),
          highlight: Boolean(block.highlight),
          category: String(block.category || ""),
          type: normalizeBlockType(block.type),
          parentId: String(block.parentId || ""),
          children: isGroupBlock(block) ? getGroupChildBlocks(block.id).map(function (child) {
            return child.id;
          }) : [],
          inheritColor: normalizeBlockColorInheritance(block),
          color: getBlockColor(block),
          width: finiteNumber(block.width) ? Number(block.width) : undefined,
          height: finiteNumber(block.height) ? Number(block.height) : undefined,
          x: Number(block.x) || 0,
          y: Number(block.y) || 0
        };
      }

      function createConnectedBlock(sourceId, type) {
        var source = getBlock(sourceId);
        if (!source) {
          return;
        }
        var blockType = normalizeBlockType(type);
        var block = {
          id: createUniqueBlockId(),
          title: blockType === "group" ? "그룹블록" : "새 블록",
          subtitle: "",
          detail: "",
          link: "",
          tool: "",
          images: [],
          htmlFiles: [],
          innerDiagram: createEmptyInnerDiagram(),
          startDate: null,
          dueDate: null,
          status: null,
          done: false,
          highlight: false,
          category: source.category,
          type: blockType,
          parentId: source.parentId || "",
          children: blockType === "group" ? [] : [],
          inheritColor: blockType !== "main" && blockType !== "group",
          color: getBlockColor(source),
          x: 0,
          y: 0
        };
        block.x = Math.round((Number(source.x) || 0) + getBlockWidth(source) + 96);
        block.y = Math.round((Number(source.y) || 0) + getBlockHeight(source) / 2 - getBlockHeight(block) / 2);
        pushUndoSnapshot(createUndoSnapshot());
        store.data.blocks.push(block);
        store.data.connections.push({ from: source.id, to: block.id, label: "", ioType: "" });
        store.createMenuBlockId = null;
        setSelection([block.id]);
        store.focusTitleBlockId = block.id;
        renderAll();
        saveLocalState();
        showToast("연결된 블록을 만들었습니다.");
      }

      function connectSelectedBlocks() {
        var blocks = getSelectedBlockIds().map(getBlock).filter(Boolean);
        if (blocks.length < 2) {
          showToast("연결할 블록을 2개 이상 선택해주세요.");
          return;
        }
        var ordered = sortBlocksForBatchConnection(blocks);
        var added = [];
        ordered.forEach(function (block, index) {
          var next = ordered[index + 1];
          if (!next || connectionExists(block.id, next.id)) {
            return;
          }
          added.push({ from: block.id, to: next.id, label: "", ioType: "" });
        });
        if (!added.length) {
          showToast("선택된 블록은 이미 연결되어 있습니다.");
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        added.forEach(function (connection) {
          store.data.connections.push(connection);
        });
        setConnectionSelection(added.map(getConnectionKey));
        renderAll();
        saveLocalState();
        showToast(added.length + "개 연결선을 만들었습니다.");
      }

      function sortBlocksForBatchConnection(blocks) {
        return blocks.slice().sort(function (a, b) {
          var aCenter = getBlockCenter(a);
          var bCenter = getBlockCenter(b);
          var xDiff = aCenter.x - bCenter.x;
          if (Math.abs(xDiff) > 24) {
            return xDiff;
          }
          var yDiff = aCenter.y - bCenter.y;
          if (Math.abs(yDiff) > 0) {
            return yDiff;
          }
          return String(a.title || "").localeCompare(String(b.title || ""), "ko");
        });
      }

      function selectBlock(blockId, additive) {
        blurActiveTitleEditor();
        if (additive) {
          toggleBlockSelection(blockId);
          renderBlocks();
          return;
        }
        store.createMenuBlockId = null;
        store.focusTitleBlockId = null;
        setSelection([blockId]);
        renderBlocks();
      }

      function activateBlockTitleEditing(blockId) {
        if (!getBlock(blockId)) {
          return;
        }
        store.createMenuBlockId = null;
        setSelection([blockId]);
        store.focusTitleBlockId = blockId;
        renderBlocks();
      }

      function blurActiveTitleEditor() {
        var active = document.activeElement;
        if (active && active.matches && active.matches("[data-title-editor]")) {
          active.blur();
        }
      }

      function toggleBlockSelection(blockId) {
        store.selectedConnectionKeys = [];
        if (isBlockSelected(blockId)) {
          store.selectedBlockIds = store.selectedBlockIds.filter(function (id) {
            return id !== blockId;
          });
          store.selectedBlockId = store.selectedBlockIds[store.selectedBlockIds.length - 1] || null;
          return;
        }
        store.selectedBlockIds.push(blockId);
        store.selectedBlockId = blockId;
      }

      function setSelection(blockIds) {
        store.selectedConnectionKeys = [];
        var knownIds = new Set(store.data.blocks.map(function (block) {
          return block.id;
        }));
        store.selectedBlockIds = blockIds.filter(function (id, index) {
          return knownIds.has(id) && blockIds.indexOf(id) === index;
        });
        store.selectedBlockId = store.selectedBlockIds[store.selectedBlockIds.length - 1] || null;
        if (!store.selectedBlockIds.length) {
          store.createMenuBlockId = null;
        }
      }

      function clearSelectedBlock() {
        if (!store.selectedBlockIds.length && !store.selectedBlockId && !store.selectedConnectionKeys.length) {
          return;
        }
        clearSelectionState();
        renderAll();
      }

      function clearSelectionState() {
        store.selectedBlockId = null;
        store.selectedBlockIds = [];
        store.selectedConnectionKeys = [];
        store.focusTitleBlockId = null;
        store.createMenuBlockId = null;
      }

      function isBlockSelected(blockId) {
        return store.selectedBlockIds.indexOf(blockId) !== -1;
      }

      function selectConnection(key, additive) {
        if (!connectionKeyExists(key)) {
          return;
        }
        if (!additive) {
          clearSelectionState();
          store.selectedConnectionKeys = [key];
          renderAll();
          return;
        }
        toggleConnectionSelection(key);
        renderConnections();
      }

      function toggleConnectionSelection(key) {
        var index = store.selectedConnectionKeys.indexOf(key);
        if (index !== -1) {
          store.selectedConnectionKeys.splice(index, 1);
          return;
        }
        store.selectedConnectionKeys.push(key);
      }

      function setConnectionSelection(keys) {
        var knownKeys = new Set(store.data.connections.map(getConnectionKey));
        store.selectedConnectionKeys = keys.filter(function (key, index) {
          return knownKeys.has(key) && keys.indexOf(key) === index;
        });
      }

      function isConnectionSelected(key) {
        return store.selectedConnectionKeys.indexOf(key) !== -1;
      }

      function startBlockResize(event, blockId) {
        var block;
        var card;
        var worldPoint;
        var minimum;
        if (event.button !== 0 || store.drag || store.connect || store.handlePress) {
          return;
        }
        block = getBlock(blockId);
        if (!block) {
          return;
        }
        blurActiveTitleEditor();
        if (!isBlockSelected(blockId)) {
          setSelection([blockId]);
          renderBlocks();
        }
        block = getBlock(blockId);
        card = getBlockElement(blockId);
        worldPoint = screenToWorld(event.clientX, event.clientY);
        minimum = getBlockResizeMinimum(block);
        store.resize = {
          blockId: blockId,
          pointerId: event.pointerId,
          startWorldX: worldPoint.x,
          startWorldY: worldPoint.y,
          startClientX: event.clientX,
          startClientY: event.clientY,
          startWidth: getBlockWidth(block),
          startHeight: getBlockHeight(block),
          minWidth: minimum.width,
          minHeight: minimum.height,
          undoSnapshot: createUndoSnapshot(),
          moved: false
        };
        if (card) {
          card.classList.add("is-resizing");
          card.setPointerCapture(event.pointerId);
        }
        event.preventDefault();
        event.stopPropagation();
      }

      function moveResizedBlock(event) {
        var resize = store.resize;
        var block = resize && getBlock(resize.blockId);
        var card = block && getBlockElement(block.id);
        var worldPoint;
        var nextWidth;
        var nextHeight;
        if (!resize || !block || !card) {
          return;
        }
        if (Math.abs(event.clientX - resize.startClientX) > 3 || Math.abs(event.clientY - resize.startClientY) > 3) {
          resize.moved = true;
        }
        worldPoint = screenToWorld(event.clientX, event.clientY);
        nextWidth = Math.round(clamp(resize.startWidth + worldPoint.x - resize.startWorldX, resize.minWidth, WORLD_WIDTH - (Number(block.x) || 0)));
        nextHeight = Math.round(clamp(resize.startHeight + worldPoint.y - resize.startWorldY, resize.minHeight, WORLD_HEIGHT - (Number(block.y) || 0)));
        block.width = nextWidth;
        block.height = nextHeight;
        applyBlockSize(card, block);
        renderConnections();
        event.preventDefault();
      }

      function finishBlockResize(event) {
        var resize = store.resize;
        var block = resize && getBlock(resize.blockId);
        var card = block && getBlockElement(block.id);
        if (card) {
          card.classList.remove("is-resizing");
          safelyReleasePointer(card, event.pointerId);
        }
        store.resize = null;
        if (resize && resize.moved) {
          pushUndoSnapshot(resize.undoSnapshot);
          renderAll();
          saveLocalState();
        }
        event.preventDefault();
        event.stopPropagation();
      }

      function startBlockDrag(event, blockId) {
        if (event.button !== 0 || store.connect || store.handlePress) {
          return;
        }
        var block = getBlock(blockId);
        if (!block) {
          return;
        }
        blurActiveTitleEditor();
        if (!isBlockSelected(blockId) && !(event.shiftKey || event.ctrlKey || event.metaKey)) {
          setSelection([blockId]);
        }
        var worldPoint = screenToWorld(event.clientX, event.clientY);
        var card = getBlockElement(blockId);
        var selectedIds = expandBlockIdsWithGroupChildren(isBlockSelected(blockId) ? store.selectedBlockIds.slice() : [blockId]);
        store.drag = {
          blockId: blockId,
          pointerId: event.pointerId,
          offsetX: worldPoint.x - block.x,
          offsetY: worldPoint.y - block.y,
          startWorldX: worldPoint.x,
          startWorldY: worldPoint.y,
          startClientX: event.clientX,
          startClientY: event.clientY,
          moved: false,
          undoSnapshot: createUndoSnapshot(),
          blocks: selectedIds.map(function (id) {
            var selectedBlock = getBlock(id);
            var parentBlock = selectedBlock && selectedBlock.parentId ? getBlock(selectedBlock.parentId) : null;
            return selectedBlock ? {
              id: id,
              x: Number(selectedBlock.x) || 0,
              y: Number(selectedBlock.y) || 0,
              parentId: selectedBlock.parentId || "",
              parentBounds: parentBlock ? getBlockBounds(parentBlock) : null
            } : null;
          }).filter(Boolean)
        };
        if (card) {
          card.classList.add("is-dragging");
          card.setPointerCapture(event.pointerId);
        }
        event.preventDefault();
        event.stopPropagation();
      }

      function startHandlePress(event, blockId) {
        if (event.button !== 0) {
          return;
        }
        var block = getBlock(blockId);
        if (!block) {
          return;
        }
        store.handlePress = {
          blockId: blockId,
          pointerId: event.pointerId,
          startClientX: event.clientX,
          startClientY: event.clientY,
          handle: event.currentTarget
        };
        event.currentTarget.setPointerCapture(event.pointerId);
        event.preventDefault();
        event.stopPropagation();
      }

      function beginConnectionFromHandlePress(event) {
        var press = store.handlePress;
        var block = press && getBlock(press.blockId);
        if (!press || !block) {
          store.handlePress = null;
          return;
        }
        var start = getBlockCenter(block);
        var current = screenToWorld(event.clientX, event.clientY);
        store.connect = {
          from: press.blockId,
          pointerId: press.pointerId,
          handle: press.handle,
          startX: start.x,
          startY: start.y,
          endX: current.x,
          endY: current.y
        };
        store.handlePress = null;
        updateDraftConnection();
      }

      function finishHandlePress(event) {
        var press = store.handlePress;
        if (!press) {
          return;
        }
        safelyReleasePointer(press.handle, event.pointerId);
        store.handlePress = null;
        if (event.type === "pointercancel") {
          return;
        }
        openCreateMenu(press.blockId);
      }

      function openCreateMenu(blockId) {
        if (!getBlock(blockId)) {
          return;
        }
        blurActiveTitleEditor();
        setSelection([blockId]);
        store.focusTitleBlockId = null;
        store.createMenuBlockId = blockId;
        renderBlocks();
      }

      function startConnection(event, blockId) {
        if (event.button !== 0) {
          return;
        }
        var block = getBlock(blockId);
        if (!block) {
          return;
        }
        var start = getBlockCenter(block);
        var current = screenToWorld(event.clientX, event.clientY);
        store.connect = {
          from: blockId,
          pointerId: event.pointerId,
          startX: start.x,
          startY: start.y,
          endX: current.x,
          endY: current.y
        };
        event.currentTarget.setPointerCapture(event.pointerId);
        updateDraftConnection();
        event.preventDefault();
        event.stopPropagation();
      }

      function startCanvasInteraction(event) {
        if (store.drag || store.connect || store.marquee || isCanvasControl(event.target)) {
          return;
        }
        if (event.button === 1 || (event.button === 0 && store.isSpaceDown)) {
          startPan(event);
          return;
        }
        if (event.button === 0) {
          startMarqueeSelection(event);
        }
      }

      function handleCanvasDoubleClick(event) {
        var worldPoint;
        if (event.button !== 0 || store.drag || store.connect || store.pan || store.marquee || isModalOpen() || isCanvasControl(event.target)) {
          return;
        }
        worldPoint = screenToWorld(event.clientX, event.clientY);
        addBlockAtWorldPoint(worldPoint.x, worldPoint.y, {
          select: true,
          focusTitle: true
        });
        event.preventDefault();
        event.stopPropagation();
      }

      function startMarqueeSelection(event) {
        var viewportPoint = screenToViewport(event.clientX, event.clientY);
        var worldPoint = screenToWorld(event.clientX, event.clientY);
        store.marquee = {
          pointerId: event.pointerId,
          additive: event.shiftKey || event.ctrlKey || event.metaKey,
          startClientX: event.clientX,
          startClientY: event.clientY,
          startViewportX: viewportPoint.x,
          startViewportY: viewportPoint.y,
          startWorldX: worldPoint.x,
          startWorldY: worldPoint.y
        };
        if (!store.marquee.additive) {
          clearSelectionState();
          renderBlocks();
        }
        els.viewport.classList.add("is-selecting");
        els.viewport.setPointerCapture(event.pointerId);
        updateSelectionBox(viewportPoint.x, viewportPoint.y);
        event.preventDefault();
      }

      function startPan(event) {
        if (store.drag || store.connect || store.marquee) {
          return;
        }
        clearSelectedBlock();
        store.pan = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          panX: store.view.panX,
          panY: store.view.panY
        };
        els.viewport.classList.add("is-panning");
        els.viewport.setPointerCapture(event.pointerId);
        event.preventDefault();
      }

      function handlePointerMove(event) {
        if (store.innerDiagram.handlePress && event.pointerId === store.innerDiagram.handlePress.pointerId) {
          var innerMovedX = Math.abs(event.clientX - store.innerDiagram.handlePress.startClientX);
          var innerMovedY = Math.abs(event.clientY - store.innerDiagram.handlePress.startClientY);
          if (innerMovedX > 4 || innerMovedY > 4) {
            beginInnerConnectionFromHandlePress(event);
            if (store.innerDiagram.connect) {
              moveInnerDraftConnection(event);
            }
          }
          return;
        }
        if (store.innerDiagram.connect && event.pointerId === store.innerDiagram.connect.pointerId) {
          moveInnerDraftConnection(event);
          return;
        }
        if (store.innerDiagram.marquee && event.pointerId === store.innerDiagram.marquee.pointerId) {
          moveInnerMarqueeSelection(event);
          return;
        }
        if (store.innerDiagram.resize && event.pointerId === store.innerDiagram.resize.pointerId) {
          moveInnerResizedBlock(event);
          return;
        }
        if (store.innerDiagram.drag && event.pointerId === store.innerDiagram.drag.pointerId) {
          moveInnerDraggedBlock(event);
          return;
        }
        if (store.resize && event.pointerId === store.resize.pointerId) {
          moveResizedBlock(event);
          return;
        }
        if (store.handlePress && event.pointerId === store.handlePress.pointerId) {
          var movedX = Math.abs(event.clientX - store.handlePress.startClientX);
          var movedY = Math.abs(event.clientY - store.handlePress.startClientY);
          if (movedX > 4 || movedY > 4) {
            beginConnectionFromHandlePress(event);
            if (store.connect) {
              moveDraftConnection(event);
            }
          }
          return;
        }
        if (store.drag && event.pointerId === store.drag.pointerId) {
          moveDraggedBlock(event);
          return;
        }
        if (store.connect && event.pointerId === store.connect.pointerId) {
          moveDraftConnection(event);
          return;
        }
        if (store.marquee && event.pointerId === store.marquee.pointerId) {
          moveMarqueeSelection(event);
          return;
        }
        if (store.pan && event.pointerId === store.pan.pointerId) {
          moveViewport(event);
        }
      }

      function handlePointerUp(event) {
        if (store.innerDiagram.handlePress && event.pointerId === store.innerDiagram.handlePress.pointerId) {
          finishInnerHandlePress(event);
          return;
        }
        if (store.innerDiagram.connect && event.pointerId === store.innerDiagram.connect.pointerId) {
          finishInnerConnection(event);
          return;
        }
        if (store.innerDiagram.marquee && event.pointerId === store.innerDiagram.marquee.pointerId) {
          finishInnerMarqueeSelection(event);
          return;
        }
        if (store.innerDiagram.resize && event.pointerId === store.innerDiagram.resize.pointerId) {
          finishInnerBlockResize(event);
          return;
        }
        if (store.innerDiagram.drag && event.pointerId === store.innerDiagram.drag.pointerId) {
          finishInnerBlockDrag(event);
          return;
        }
        if (store.resize && event.pointerId === store.resize.pointerId) {
          finishBlockResize(event);
          return;
        }
        if (store.handlePress && event.pointerId === store.handlePress.pointerId) {
          finishHandlePress(event);
          return;
        }
        if (store.drag && event.pointerId === store.drag.pointerId) {
          finishBlockDrag(event);
          return;
        }
        if (store.connect && event.pointerId === store.connect.pointerId) {
          finishConnection(event);
          return;
        }
        if (store.marquee && event.pointerId === store.marquee.pointerId) {
          finishMarqueeSelection(event);
          return;
        }
        if (store.pan && event.pointerId === store.pan.pointerId) {
          finishPan(event);
        }
      }

      function moveDraggedBlock(event) {
        var worldPoint = screenToWorld(event.clientX, event.clientY);
        if (Math.abs(event.clientX - store.drag.startClientX) > 4 || Math.abs(event.clientY - store.drag.startClientY) > 4) {
          store.drag.moved = true;
        }
        var deltaX = worldPoint.x - store.drag.startWorldX;
        var deltaY = worldPoint.y - store.drag.startWorldY;
        store.drag.blocks.forEach(function (draggedBlock) {
          var block = getBlock(draggedBlock.id);
          var card = getBlockElement(draggedBlock.id);
          if (!block || !card) {
            return;
          }
          block.x = Math.round(draggedBlock.x + deltaX);
          block.y = Math.round(draggedBlock.y + deltaY);
          setBlockPosition(card, block);
        });
        renderConnections();
        markInnerDiagramDropTarget(event.clientX, event.clientY, store.drag.blocks.map(function (block) {
          return block.id;
        }));
      }

      function finishBlockDrag(event) {
        var drag = store.drag;
        var blockId = drag.blockId;
        var didMove = drag.moved;
        var undoSnapshot = drag.undoSnapshot;
        var draggedIds = drag.blocks.map(function (block) {
          return block.id;
        });
        var targetGroupCard = didMove ? getGroupBlockFromPoint(event.clientX, event.clientY, draggedIds) : null;
        var targetCard = didMove ? getBlockFromPoint(event.clientX, event.clientY, draggedIds) : null;
        var card = getBlockElement(drag.blockId);
        if (card) {
          card.classList.remove("is-dragging");
          safelyReleasePointer(card, event.pointerId);
        }
        store.drag = null;
        clearDropTargets();
        if (!didMove) {
          selectBlock(blockId, event.shiftKey || event.ctrlKey || event.metaKey);
        } else if (targetGroupCard && moveBlocksToGroup(targetGroupCard.dataset.blockId, draggedIds, undoSnapshot, event.clientY)) {
          return;
        } else if (releaseDraggedBlocksFromGroups(drag, undoSnapshot)) {
          return;
        } else if (targetCard && moveBlocksIntoInnerDiagram(targetCard.dataset.blockId, draggedIds, undoSnapshot)) {
          return;
        } else {
          pushUndoSnapshot(undoSnapshot);
          saveLocalState();
        }
      }

      function moveDraftConnection(event) {
        var worldPoint = screenToWorld(event.clientX, event.clientY);
        store.connect.endX = worldPoint.x;
        store.connect.endY = worldPoint.y;
        markDropTarget(event.clientX, event.clientY, store.connect.from);
        updateDraftConnection();
      }

      function moveMarqueeSelection(event) {
        var viewportPoint = screenToViewport(event.clientX, event.clientY);
        updateSelectionBox(viewportPoint.x, viewportPoint.y);
      }

      function finishMarqueeSelection(event) {
        var endWorld = screenToWorld(event.clientX, event.clientY);
        var rect = normalizeRect(store.marquee.startWorldX, store.marquee.startWorldY, endWorld.x, endWorld.y);
        var selectedIds = store.data.blocks.filter(function (block) {
          return rectsIntersect(rect, {
            left: Number(block.x) || 0,
            top: Number(block.y) || 0,
            right: (Number(block.x) || 0) + getBlockWidth(block),
            bottom: (Number(block.y) || 0) + getBlockHeight(block)
          });
        }).map(function (block) {
          return block.id;
        });
        var selectedConnectionKeys = store.data.connections.filter(function (connection) {
          return connectionIntersectsRect(connection, rect);
        }).map(getConnectionKey);

        if (store.marquee.additive) {
          selectedIds.forEach(function (id) {
            if (!isBlockSelected(id)) {
              store.selectedBlockIds.push(id);
            }
          });
          selectedConnectionKeys.forEach(function (key) {
            if (!isConnectionSelected(key)) {
              store.selectedConnectionKeys.push(key);
            }
          });
          store.selectedBlockId = selectedIds[selectedIds.length - 1] || store.selectedBlockId;
        } else {
          setSelection(selectedIds);
          setConnectionSelection(selectedConnectionKeys);
        }

        hideSelectionBox();
        safelyReleasePointer(els.viewport, event.pointerId);
        els.viewport.classList.remove("is-selecting");
        store.marquee = null;
        renderAll();
      }

      function updateSelectionBox(currentViewportX, currentViewportY) {
        var rect = normalizeRect(store.marquee.startViewportX, store.marquee.startViewportY, currentViewportX, currentViewportY);
        els.selectionBox.classList.add("is-visible");
        els.selectionBox.style.left = rect.left + "px";
        els.selectionBox.style.top = rect.top + "px";
        els.selectionBox.style.width = rect.right - rect.left + "px";
        els.selectionBox.style.height = rect.bottom - rect.top + "px";
      }

      function hideSelectionBox() {
        els.selectionBox.classList.remove("is-visible");
        els.selectionBox.style.width = "0px";
        els.selectionBox.style.height = "0px";
      }

      function finishConnection(event) {
        var fromId = store.connect.from;
        var labelTarget = getConnectionLabelFromPoint(event.clientX, event.clientY, [fromId]);
        var target = labelTarget ? null : getBlockFromPoint(event.clientX, event.clientY, [fromId]);
        clearDropTargets();
        els.draftConnection.classList.remove("is-active");
        els.draftConnection.setAttribute("d", "");

        if (labelTarget && labelTarget.dataset.connectionEndpointId) {
          addConnectionsToTarget(getConnectionSourceIds(fromId, labelTarget.dataset.connectionEndpointId), labelTarget.dataset.connectionEndpointId);
        } else if (target && target.dataset.blockId && target.dataset.blockId !== fromId) {
          addConnectionsToTarget(getConnectionSourceIds(fromId, target.dataset.blockId), target.dataset.blockId);
        }
        safelyReleasePointer(store.connect.handle || event.target, event.pointerId);
        store.connect = null;
      }

      function moveViewport(event) {
        store.view.panX = store.pan.panX + event.clientX - store.pan.startX;
        store.view.panY = store.pan.panY + event.clientY - store.pan.startY;
        updateTransform();
      }

      function finishPan(event) {
        safelyReleasePointer(els.viewport, event.pointerId);
        store.pan = null;
        if (!store.isSpaceDown) {
          els.viewport.classList.remove("is-panning");
        }
      }

      function addConnection(fromId, toId) {
        addConnectionsToTarget([fromId], toId);
      }

      function getConnectionSourceIds(fromId, targetId) {
        var selectedIds = getSelectedBlockIds();
        var useSelectedBlocks = selectedIds.length > 1 && selectedIds.indexOf(fromId) !== -1;
        var sourceIds = useSelectedBlocks ? selectedIds : [fromId];
        var seen = new Set();
        return sourceIds.filter(function (sourceId) {
          if (!sourceId || sourceId === targetId || seen.has(sourceId) || !getBlock(sourceId)) {
            return false;
          }
          seen.add(sourceId);
          return true;
        });
      }

      function addConnectionsToTarget(sourceIds, targetId) {
        if (!targetId || !resolveConnectionEndpoint(targetId)) {
          return;
        }
        var added = [];
        sourceIds.forEach(function (sourceId) {
          if (!sourceId || sourceId === targetId || connectionExists(sourceId, targetId)) {
            return;
          }
          added.push({ from: sourceId, to: targetId, label: "", ioType: "" });
        });
        if (!added.length) {
          showToast("이미 연결되어 있습니다.");
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        added.forEach(function (connection) {
          store.data.connections.push(connection);
        });
        setConnectionSelection(added.map(getConnectionKey));
        renderAll();
        saveLocalState();
        showToast(added.length > 1 ? added.length + "개 블록을 한 곳에 연결했습니다." : "연결선을 만들었습니다.");
      }

      function connectionExists(fromId, toId) {
        return store.data.connections.some(function (connection) {
          return (connection.from === fromId && connection.to === toId) ||
            (connection.from === toId && connection.to === fromId);
        });
      }

      function connectionTouchesBlockIds(connection, blockIds) {
        return endpointTouchesBlockIds(connection.from, blockIds) || endpointTouchesBlockIds(connection.to, blockIds);
      }

      function endpointTouchesBlockIds(endpointId, blockIds) {
        if (blockIds.has(endpointId)) {
          return true;
        }
        var parsed = parseConnectionLabelEndpointId(endpointId);
        return Boolean(parsed && (blockIds.has(parsed.from) || blockIds.has(parsed.to)));
      }

      function connectionReferencesConnectionKeys(connection, connectionKeys) {
        return endpointReferencesConnectionKeys(connection.from, connectionKeys) || endpointReferencesConnectionKeys(connection.to, connectionKeys);
      }

      function endpointReferencesConnectionKeys(endpointId, connectionKeys) {
        var key = getConnectionLabelReferenceKey(endpointId);
        return Boolean(key && connectionKeys.has(key));
      }

      function getConnectionKey(connection) {
        return String(connection.from) + "\u0000" + String(connection.to);
      }

      function connectionKeyExists(key) {
        return store.data.connections.some(function (connection) {
          return getConnectionKey(connection) === key;
        });
      }

      function findConnectionByKey(key) {
        return store.data.connections.find(function (connection) {
          return getConnectionKey(connection) === key;
        }) || null;
      }

      function updateDraftConnection() {
        if (!store.connect) {
          return;
        }
        var path = getConnectionPathFromPoints({
          x: store.connect.startX,
          y: store.connect.startY
        }, {
          x: store.connect.endX,
          y: store.connect.endY
        }, store.data.connectionStyle);
        els.draftConnection.setAttribute("d", path);
        els.draftConnection.classList.add("is-active");
      }

      function markDropTarget(clientX, clientY, fromId) {
        clearDropTargets();
        var labelTarget = getConnectionLabelFromPoint(clientX, clientY, [fromId]);
        if (labelTarget) {
          labelTarget.classList.add("is-drop-target");
          return;
        }
        var target = getBlockFromPoint(clientX, clientY, [fromId]);
        if (target && target.dataset.blockId !== fromId) {
          target.classList.add("is-drop-target");
        }
      }

      function markInnerDiagramDropTarget(clientX, clientY, sourceIds) {
        clearDropTargets();
        var target = getGroupBlockFromPoint(clientX, clientY, sourceIds) || getBlockFromPoint(clientX, clientY, sourceIds);
        if (target && target.dataset.blockId) {
          target.classList.add("is-drop-target");
          target.classList.add("is-inner-drop-target");
          target.dataset.dropLabel = normalizeBlockType(getBlock(target.dataset.blockId).type) === "group"
            ? (sourceIds.length > 1 ? sourceIds.length + "개 그룹에 넣기" : "그룹에 넣기")
            : (sourceIds.length > 1 ? sourceIds.length + "개 내부로 넣기" : "내부로 넣기");
        }
      }

      function clearDropTargets() {
        els.blocksLayer.querySelectorAll(".is-drop-target").forEach(function (node) {
          node.classList.remove("is-drop-target");
          node.classList.remove("is-inner-drop-target");
          delete node.dataset.dropLabel;
        });
        els.connectionGroup.querySelectorAll(".connection-label-box.is-drop-target").forEach(function (node) {
          node.classList.remove("is-drop-target");
        });
      }

      function moveBlocksToGroup(targetId, blockIds, undoSnapshot, clientY) {
        var targetBlock = getBlock(targetId);
        var sourceIds = blockIds.filter(function (id, index) {
          return id && id !== targetId && blockIds.indexOf(id) === index;
        });
        var movingSet = new Set(sourceIds);
        var currentChildren;
        var nextChildren;
        var insertIndex;
        sourceIds = sourceIds.filter(function (id) {
          var block = getBlock(id);
          return block && !movingSet.has(block.parentId);
        });
        if (!targetBlock || !isGroupBlock(targetBlock) || !sourceIds.length) {
          return false;
        }
        sourceIds = sourceIds.filter(function (sourceId) {
          var block = getBlock(sourceId);
          if (!block || block.id === targetId || isDescendantOf(targetId, block.id)) {
            return false;
          }
          return true;
        });
        if (!sourceIds.length) {
          return false;
        }
        currentChildren = getGroupChildBlocks(targetId).map(function (block) {
          return block.id;
        }).filter(function (id) {
          return sourceIds.indexOf(id) === -1;
        });
        insertIndex = clamp(getGroupInsertionIndex(targetBlock, clientY, sourceIds), 0, currentChildren.length);
        nextChildren = currentChildren.slice(0, insertIndex).concat(sourceIds, currentChildren.slice(insertIndex));
        pushUndoSnapshot(undoSnapshot);
        removeIdsFromAllGroupChildren(new Set(sourceIds));
        sourceIds.forEach(function (sourceId) {
          var block = getBlock(sourceId);
          if (block) {
            block.parentId = targetId;
          }
        });
        setGroupChildren(targetId, nextChildren);
        arrangeGroupChildren(targetId);
        setSelection(sourceIds);
        renderAll();
        saveLocalState();
        showToast(sourceIds.length > 1 ? sourceIds.length + "개 블록을 그룹에 넣었습니다." : "블록을 그룹에 넣었습니다.");
        return true;
      }

      function releaseDraggedBlocksFromGroups(drag, undoSnapshot) {
        var changed = false;
        var movingIds = new Set((drag.blocks || []).map(function (item) {
          return item.id;
        }));
        var releasedIds = new Set();
        var affectedGroupIds = new Set();
        (drag.blocks || []).forEach(function (item) {
          var block = getBlock(item.id);
          if (!block || !item.parentId || movingIds.has(item.parentId)) {
            return;
          }
          var center = getBlockCenterPoint(block);
          var bounds = item.parentBounds;
          if (bounds && !pointInRect(center, bounds)) {
            block.parentId = "";
            releasedIds.add(block.id);
            affectedGroupIds.add(item.parentId);
            changed = true;
          }
        });
        if (!changed) {
          return false;
        }
        pushUndoSnapshot(undoSnapshot);
        removeIdsFromAllGroupChildren(releasedIds);
        affectedGroupIds.forEach(arrangeGroupChildren);
        setSelection((drag.blocks || []).map(function (item) {
          return item.id;
        }).filter(function (id) {
          return getBlock(id);
        }));
        renderAll();
        saveLocalState();
        showToast("블록을 그룹 밖으로 꺼냈습니다.");
        return true;
      }

      function moveBlocksIntoInnerDiagram(targetId, blockIds, undoSnapshot) {
        var targetBlock = getBlock(targetId);
        var sourceIds = blockIds.filter(function (id, index) {
          return id && id !== targetId && blockIds.indexOf(id) === index;
        });
        var sourceBlocks = sourceIds.map(getBlock).filter(Boolean);
        if (!targetBlock || !sourceBlocks.length) {
          return false;
        }

        var sourceIdSet = new Set(sourceBlocks.map(function (block) {
          return block.id;
        }));
        var innerDiagram = cloneInnerDiagram(targetBlock.innerDiagram);
        var sourceBounds = getOuterBlocksBounds(sourceBlocks);
        var placement = getInnerInsertionPoint(innerDiagram, sourceBounds);
        var idMap = new Map();

        sourceBlocks.forEach(function (sourceBlock) {
          var innerId = createInnerBlockId(innerDiagram);
          var innerWidth = Math.round(clamp(getBlockWidth(sourceBlock), INNER_BLOCK_MIN_WIDTH, 520));
          var innerHeight = Math.round(clamp(getBlockHeight(sourceBlock), INNER_BLOCK_MIN_HEIGHT, 220));
          idMap.set(sourceBlock.id, innerId);
          innerDiagram.blocks.push({
            id: innerId,
            title: sourceBlock.title || "내부 블록",
            color: getBlockColor(sourceBlock),
            x: Math.round(clamp(placement.x + (Number(sourceBlock.x) || 0) - sourceBounds.left, 0, INNER_WORLD_WIDTH - innerWidth)),
            y: Math.round(clamp(placement.y + (Number(sourceBlock.y) || 0) - sourceBounds.top, 0, INNER_WORLD_HEIGHT - innerHeight)),
            width: innerWidth,
            height: innerHeight
          });
        });

        store.data.connections.forEach(function (connection) {
          if (!sourceIdSet.has(connection.from) || !sourceIdSet.has(connection.to)) {
            return;
          }
          addInnerConnectionToDiagram(innerDiagram, idMap.get(connection.from), idMap.get(connection.to), connection);
        });

        pushUndoSnapshot(undoSnapshot);
        targetBlock.innerDiagram = innerDiagram;
        store.data.blocks = store.data.blocks.filter(function (block) {
          return !sourceIdSet.has(block.id);
        });
        store.data.connections = store.data.connections.filter(function (connection) {
          return !connectionTouchesBlockIds(connection, sourceIdSet);
        });
        clearSelectionState();
        setSelection([targetId]);
        renderAll();
        saveLocalState();
        showToast(sourceBlocks.length + "개 블록을 내부 다이어그램으로 옮겼습니다.");
        return true;
      }

      function getOuterBlocksBounds(blocks) {
        var left = Math.min.apply(null, blocks.map(function (block) {
          return Number(block.x) || 0;
        }));
        var top = Math.min.apply(null, blocks.map(function (block) {
          return Number(block.y) || 0;
        }));
        var right = Math.max.apply(null, blocks.map(function (block) {
          return (Number(block.x) || 0) + getBlockWidth(block);
        }));
        var bottom = Math.max.apply(null, blocks.map(function (block) {
          return (Number(block.y) || 0) + getBlockHeight(block);
        }));
        return {
          left: left,
          top: top,
          right: right,
          bottom: bottom,
          width: right - left,
          height: bottom - top
        };
      }

      function getInnerInsertionPoint(innerDiagram, sourceBounds) {
        if (!innerDiagram.blocks.length) {
          return { x: 80, y: 80 };
        }
        var existingRight = Math.max.apply(null, innerDiagram.blocks.map(function (block) {
          return (Number(block.x) || 0) + getInnerBlockWidth(block);
        }));
        var existingBottom = Math.max.apply(null, innerDiagram.blocks.map(function (block) {
          return (Number(block.y) || 0) + getInnerBlockHeight(block);
        }));
        var x = existingRight + 80;
        var y = 80;
        if (x + sourceBounds.width > INNER_WORLD_WIDTH - 40) {
          x = 80;
          y = existingBottom + 80;
        }
        return {
          x: Math.round(clamp(x, 40, Math.max(40, INNER_WORLD_WIDTH - sourceBounds.width - 40))),
          y: Math.round(clamp(y, 40, Math.max(40, INNER_WORLD_HEIGHT - sourceBounds.height - 40)))
        };
      }

      function addInnerConnectionToDiagram(innerDiagram, from, to, sourceConnection) {
        if (!from || !to || from === to) {
          return;
        }
        var exists = innerDiagram.connections.some(function (connection) {
          return connection.from === from && connection.to === to;
        });
        if (!exists) {
          innerDiagram.connections.push({
            from: from,
            to: to,
            label: getConnectionLabel(sourceConnection),
            ioType: getConnectionIoType(sourceConnection)
          });
        }
      }

      function zoomCanvas(event) {
        event.preventDefault();
        var before = screenToWorld(event.clientX, event.clientY);
        var oldScale = store.view.scale;
        var factor = event.deltaY < 0 ? 1.08 : 0.925;
        var nextScale = clamp(oldScale * factor, 0.35, 2.4);
        var rect = els.viewport.getBoundingClientRect();

        store.view.scale = nextScale;
        store.view.panX = event.clientX - rect.left - before.x * nextScale;
        store.view.panY = event.clientY - rect.top - before.y * nextScale;
        updateTransform();
      }

      function updateTransform() {
        var scale = store.view.scale;
        els.world.style.transform = "translate(" + store.view.panX + "px, " + store.view.panY + "px) scale(" + scale + ")";
        updateGrid();
      }

      function updateGrid() {
        var gridSize = 48 * store.view.scale;
        var x = store.view.panX % gridSize;
        var y = store.view.panY % gridSize;
        els.viewport.style.setProperty("--grid-size", gridSize + "px");
        els.viewport.style.setProperty("--grid-x", x + "px");
        els.viewport.style.setProperty("--grid-y", y + "px");
      }

      function resetView() {
        store.view.panX = 72;
        store.view.panY = 64;
        store.view.scale = 1;
        updateTransform();
      }

      function setBlockPosition(card, block) {
        card.style.transform = "translate(" + block.x + "px, " + block.y + "px)";
      }

      function applyBlockSize(card, block) {
        card.style.setProperty("--card-width", getBlockWidth(block) + "px");
        card.style.setProperty("--card-height", getBlockHeight(block) + "px");
      }

      function getConnectionPath(fromBlock, toBlock, style) {
        var start = edgePoint(fromBlock, toBlock);
        var end = edgePoint(toBlock, fromBlock);
        return getConnectionPathFromPoints(start, end, style || store.data.connectionStyle);
      }

      function getConnectionPathFromPoints(start, end, style) {
        return normalizeConnectionStyle(style) === "straight" ?
          getStraightConnectionPath(start, end) :
          getCurveConnectionPath(start, end);
      }

      function getCurveConnectionPath(start, end) {
        var dx = end.x - start.x;
        var dy = end.y - start.y;
        var horizontal = Math.abs(dx) >= Math.abs(dy);
        var offset = clamp((horizontal ? Math.abs(dx) : Math.abs(dy)) * 0.28, 40, 120);
        var c1x = horizontal ? start.x + offset * (dx >= 0 ? 1 : -1) : start.x;
        var c1y = horizontal ? start.y : start.y + offset * (dy >= 0 ? 1 : -1);
        var c2x = horizontal ? end.x - offset * (dx >= 0 ? 1 : -1) : end.x;
        var c2y = horizontal ? end.y : end.y - offset * (dy >= 0 ? 1 : -1);
        return "M " + start.x + " " + start.y +
          " C " + c1x + " " + c1y + " " + c2x + " " + c2y + " " + end.x + " " + end.y;
      }

      function getStraightConnectionPath(start, end) {
        var horizontal = Math.abs(end.x - start.x) >= Math.abs(end.y - start.y);
        if (horizontal) {
          var midX = Math.round((start.x + end.x) / 2);
          return "M " + start.x + " " + start.y +
            " H " + midX + " V " + end.y + " H " + end.x;
        }
        var midY = Math.round((start.y + end.y) / 2);
        return "M " + start.x + " " + start.y +
          " V " + midY + " H " + end.x + " V " + end.y;
      }

      function normalizeConnectionStyle(style) {
        return style === "straight" ? "straight" : CONNECTION_STYLE_DEFAULT;
      }

      function edgePoint(block, targetBlock) {
        var center = getBlockCenter(block);
        var target = getBlockCenter(targetBlock);
        var dx = target.x - center.x;
        var dy = target.y - center.y;
        if (dx === 0 && dy === 0) {
          return { x: center.x, y: center.y };
        }
        var halfHeight = getEndpointHeight(block) / 2;
        var tx = Math.abs(dx) > 0 ? (getEndpointWidth(block) / 2) / Math.abs(dx) : Infinity;
        var ty = Math.abs(dy) > 0 ? halfHeight / Math.abs(dy) : Infinity;
        var t = Math.min(tx, ty);
        return {
          x: Math.round((center.x + dx * t) * 100) / 100,
          y: Math.round((center.y + dy * t) * 100) / 100
        };
      }

      function getBlockCenter(block) {
        return {
          x: Number(block.x) + getEndpointWidth(block) / 2,
          y: Number(block.y) + getEndpointHeight(block) / 2
        };
      }

      function getEndpointWidth(endpoint) {
        if (endpoint && endpoint.endpointType === "connection-label" && finiteNumber(endpoint.width)) {
          return Number(endpoint.width);
        }
        return getBlockWidth(endpoint);
      }

      function getEndpointHeight(endpoint) {
        if (endpoint && endpoint.endpointType === "connection-label" && finiteNumber(endpoint.height)) {
          return Number(endpoint.height);
        }
        return getBlockHeight(endpoint);
      }

      function getBlockWidth(block) {
        var naturalWidth = getNaturalBlockWidth(block);
        var minimum = getBlockResizeMinimum(block).width;
        return Math.max(minimum, naturalWidth, finiteNumber(block && block.width) ? Number(block.width) : naturalWidth);
      }

      function getNaturalBlockWidth(block) {
        return normalizeBlockType(block && block.type) === "group" ? getGroupBlockWidth(block) : getStandardBlockWidth(block);
      }

      function getStandardBlockWidth(block) {
        var blockType = normalizeBlockType(block && block.type);
        var isMain = blockType === "main";
        var isMiddle = blockType === "middle";
        var title = String(block && block.title || "제목 없음");
        var summary = getBlockSubtitle(block);
        var tool = getBlockToolLabel(block);
        var titleFontSize = isMain ? 26 : (isMiddle ? 18 : 14);
        var summaryFontSize = 12;
        var toolFontSize = 11;
        var linkSpace = isOpenableLink(block && block.link) ? 34 : 0;
        var innerSpace = hasInnerDiagram(block) ? 34 : 0;
        var imageSpace = getBlockImages(block).length ? 34 : 0;
        var htmlSpace = getBlockHtmlFiles(block).length ? 34 : 0;
        var padding = (isMain ? 48 : (isMiddle ? 52 : 46)) + linkSpace + innerSpace + imageSpace + htmlSpace;
        var titleWidth = Math.ceil(estimateTextWidth(title, titleFontSize) + padding);
        var summaryWidth = summary ? Math.ceil(estimateTextWidth(summary, summaryFontSize) + padding) : 0;
        var toolWidth = tool ? Math.ceil(estimateTextWidth("🛠 " + tool, toolFontSize) + padding) : 0;
        return Math.max(CARD_MIN_WIDTH, CARD_WIDTH, titleWidth, summaryWidth, toolWidth);
      }

      function getGroupBlockWidth(block) {
        var title = String(block && block.title || "그룹블록");
        var titleWidth = Math.ceil(estimateTextWidth(title, 22) + GROUP_CARD_PADDING * 2 + 40);
        var contentWidth = 0;
        var groupX = Number(block && block.x) || 0;
        getGroupChildBlocks(block && block.id).forEach(function (child) {
          var childRight = (Number(child.x) || 0) + getBlockWidth(child);
          contentWidth = Math.max(contentWidth, childRight - groupX + GROUP_CARD_PADDING);
        });
        return Math.max(GROUP_CARD_MIN_WIDTH, titleWidth, contentWidth);
      }

      function estimateTextWidth(text, fontSize) {
        return Array.from(String(text || "")).reduce(function (total, character) {
          if (/\s/.test(character)) {
            return total + fontSize * 0.36;
          }
          if (/[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af\u3040-\u30ff\u4e00-\u9fff]/.test(character)) {
            return total + fontSize;
          }
          if (/[A-Z0-9]/.test(character)) {
            return total + fontSize * 0.75;
          }
          if (/[il.,:;!|'"`]/.test(character)) {
            return total + fontSize * 0.34;
          }
          return total + fontSize * 0.62;
        }, 0);
      }

      function getBlockHeight(block) {
        var naturalHeight = getNaturalBlockHeight(block);
        var minimum = getBlockResizeMinimum(block).height;
        return Math.max(minimum, naturalHeight, finiteNumber(block && block.height) ? Number(block.height) : naturalHeight);
      }

      function getNaturalBlockHeight(block) {
        var type = normalizeBlockType(block && block.type);
        var toolExtra = getBlockToolLabel(block) ? 22 : 0;
        if (type === "group") {
          return getGroupBlockHeight(block);
        }
        if (type === "main") {
          return MAIN_CARD_HEIGHT + toolExtra;
        }
        return (type === "middle" ? MIDDLE_CARD_HEIGHT : CARD_HEIGHT) + toolExtra;
      }

      function getBlockResizeMinimum(block) {
        var type = normalizeBlockType(block && block.type);
        var toolExtra = getBlockToolLabel(block) ? 22 : 0;
        if (type === "group") {
          return {
            width: getGroupBlockWidth(block),
            height: getGroupBlockHeight(block)
          };
        }
        if (type === "main") {
          return {
            width: BLOCK_RESIZE_MIN_WIDTH,
            height: MAIN_CARD_HEIGHT + toolExtra
          };
        }
        return {
          width: BLOCK_RESIZE_MIN_WIDTH,
          height: (type === "middle" ? MIDDLE_CARD_HEIGHT : Math.max(BLOCK_RESIZE_MIN_HEIGHT, CARD_HEIGHT)) + toolExtra
        };
      }

      function getGroupBlockHeight(block) {
        var children = getGroupChildBlocks(block && block.id);
        var groupY = Number(block && block.y) || 0;
        var contentBottom = children.reduce(function (bottom, child) {
          return Math.max(bottom, (Number(child.y) || 0) + getBlockHeight(child) - groupY + GROUP_CARD_PADDING);
        }, 0);
        if (!children.length) {
          return GROUP_CARD_MIN_HEIGHT;
        }
        return Math.max(GROUP_CARD_MIN_HEIGHT, GROUP_CARD_HEADER_HEIGHT + GROUP_CARD_PADDING * 2, contentBottom);
      }

      function arrangeGroupChildren(groupId) {
        var group = getBlock(groupId);
        var minX;
        var minY;
        if (!group || !isGroupBlock(group)) {
          return;
        }
        minX = Math.round((Number(group.x) || 0) + GROUP_CARD_PADDING);
        minY = Math.round((Number(group.y) || 0) + GROUP_CARD_HEADER_HEIGHT + GROUP_CARD_PADDING);
        getGroupChildBlocks(group.id).forEach(function (child, index) {
          if (!finiteNumber(child.x)) {
            child.x = minX;
          }
          if (!finiteNumber(child.y)) {
            child.y = minY + index * (getBlockHeight(child) + GROUP_CHILD_GAP);
          }
          child.x = Math.max(minX, Math.round(Number(child.x) || minX));
          child.y = Math.max(minY, Math.round(Number(child.y) || minY));
        });
      }

      function arrangeAllGroupChildren() {
        (store.data.blocks || []).forEach(function (block) {
          if (isGroupBlock(block)) {
            arrangeGroupChildren(block.id);
          }
        });
      }

      function getGroupInsertionIndex(group, clientY, movingIds) {
        var worldPoint = screenToWorld(0, clientY);
        var moving = new Set(movingIds || []);
        var children = getGroupChildBlocks(group && group.id).filter(function (child) {
          return !moving.has(child.id);
        });
        for (var index = 0; index < children.length; index += 1) {
          if (worldPoint.y < (Number(children[index].y) || 0) + getBlockHeight(children[index]) / 2) {
            return index;
          }
        }
        return children.length;
      }

      function screenToWorld(clientX, clientY) {
        var rect = els.viewport.getBoundingClientRect();
        return {
          x: (clientX - rect.left - store.view.panX) / store.view.scale,
          y: (clientY - rect.top - store.view.panY) / store.view.scale
        };
      }

      function screenToViewport(clientX, clientY) {

            target.releasePointerCapture(pointerId);
          } catch (error) {
            return;
          }
        }
      }

      function safelyCapturePointer(target, pointerId) {
        if (target && target.setPointerCapture) {
          try {
            target.setPointerCapture(pointerId);
          } catch (error) {
            return;
          }
        }
      }

      function validColor(color) {
        return typeof color === "string" && /^#[0-9a-fA-F]{6}$/.test(color);
      }

      function finiteNumber(value) {
        return typeof value === "number" && Number.isFinite(value);
      }

      function isPlainObject(value) {
        return Boolean(value) && Object.prototype.toString.call(value) === "[object Object]";
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function cssEscape(value) {
        if (window.CSS && CSS.escape) {
          return CSS.escape(value);
        }
        return String(value).replace(/["\\]/g, "\\$&");
      }

      function showToast(message) {
        window.clearTimeout(store.toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add("is-visible");
        store.toastTimer = window.setTimeout(function () {
          els.toast.classList.remove("is-visible");
        }, 1800);
      }
    }());

  </script>
</body>
</html>
