      function updateBulkTypeSelection(type) {
        var safeType = type ? normalizeBlockType(type) : "";
        els.bulkTypeToggle.querySelectorAll(".bulk-type-button").forEach(function (button) {
          var isSelected = safeType && button.dataset.type === safeType;
          button.classList.toggle("is-selected", isSelected);
          button.setAttribute("aria-pressed", isSelected ? "true" : "false");
        });
      }

      function handleBulkTypeButtonClick(event) {
        var button = event.target.closest(".bulk-type-button");
        if (!button || !els.bulkTypeToggle.contains(button)) {
          return;
        }
        applyBulkBlockType(button.dataset.type);
      }

      function applyBulkBlockType(type) {
        var safeType = normalizeBlockType(type);
        var selectedBlocks = getSelectedBlockIds().map(getBlock).filter(Boolean);
        var undoSnapshot;
        var changed = false;
        if (selectedBlocks.length < 2) {
          return;
        }

        undoSnapshot = createUndoSnapshot();
        selectedBlocks.forEach(function (block) {
          var currentType = normalizeBlockType(block.type);
          if (currentType !== safeType) {
            block.type = safeType;
            clearBlockManualSize(block);
            changed = true;
          }
          if ((safeType === "main" || safeType === "group") && block.inheritColor !== false) {
            block.inheritColor = false;
            changed = true;
          }
          if (safeType === "group" && !Array.isArray(block.children)) {
            block.children = [];
            changed = true;
          }
        });
        normalizeDiagramParentIds(store.data);
        if (!diagramDataEquals(undoSnapshot.data, getExportData())) {
          changed = true;
        }
        if (!changed) {
          renderBulkColorBar();
          return;
        }
        pushUndoSnapshot(undoSnapshot);
        renderAll();
        saveLocalState();
        showToast(selectedBlocks.length + "개 블록 성격을 변경했습니다.");
      }

      function handleBulkColorChipClick(event) {
        var chip = event.target.closest(".color-chip");
        if (!chip || !els.bulkColorChips.contains(chip)) {
          return;
        }
        applyBulkBlockColor(chip.dataset.color);
      }

      function applyBulkBlockColor(color) {
        var safeColor = validColor(color) ? color.toUpperCase() : "";
        var selectedBlocks = getSelectedBlockIds().map(getBlock).filter(Boolean);
        var undoSnapshot;
        var changed = false;
        if (!safeColor || selectedBlocks.length < 2) {
          return;
        }

        undoSnapshot = createUndoSnapshot();
        selectedBlocks.forEach(function (block) {
          var type = normalizeBlockType(block.type);
          if (block.color !== safeColor) {
            block.color = safeColor;
            changed = true;
          }
          if (type !== "main" && type !== "group" && block.inheritColor !== false) {
            block.inheritColor = false;
            changed = true;
          }
        });
        if (!changed) {
          renderBulkColorBar();
          return;
        }
        pushUndoSnapshot(undoSnapshot);
        renderAll();
        saveLocalState();
        showToast(selectedBlocks.length + "개 블록 컬러를 변경했습니다.");
      }

      function setEditColorValue(color) {
        var safeColor = validColor(color) ? color : FALLBACK_COLOR;
        els.editBlockColor.value = safeColor;
        els.editBlockColorValue.textContent = safeColor.toUpperCase();
        updateColorChipSelection(safeColor);
      }

      function setEditColorInheritedValue(value) {
        var block = getBlock(store.editBlockId);
        var editType = normalizeBlockType(els.editBlockType.value);
        var canInherit = Boolean(block && editType !== "main" && editType !== "group" && getLinkedMainBlockColor(store.data, block));
        var isInherited = Boolean(value && canInherit);
        els.editColorInherited.value = isInherited ? "true" : "false";
        els.inheritBlockColorButton.classList.toggle("is-active", isInherited);
        els.inheritBlockColorButton.disabled = !canInherit;
        els.inheritBlockColorButton.title = canInherit ? "연결된 메인블록 컬러를 따릅니다." : "연결된 메인블록이 있을 때 사용할 수 있습니다.";
      }

      function setEditBlockTypeValue(type) {
        var safeType = normalizeBlockType(type);
        els.editBlockType.value = safeType;
        updateBlockTypeSelection(safeType);
        if (safeType === "main" || safeType === "group") {
          setEditColorInheritedValue(false);
        }
      }

      function updateBlockTypeSelection(type) {
        var safeType = normalizeBlockType(type);
        els.editBlockTypeToggle.querySelectorAll(".block-type-button").forEach(function (button) {
          var isSelected = button.dataset.type === safeType;
          button.classList.toggle("is-selected", isSelected);
          button.setAttribute("aria-pressed", isSelected ? "true" : "false");
        });
      }

      function renderColorChips(currentColor) {
        els.editColorChips.replaceChildren();
        getColorChipOptions(currentColor).forEach(function (color) {
          var chip = document.createElement("button");
          chip.className = "color-chip";
          chip.type = "button";
          chip.dataset.color = color;
          chip.style.setProperty("--chip-color", color);
          chip.title = color.toUpperCase();
          chip.setAttribute("role", "option");
          chip.setAttribute("aria-label", color.toUpperCase() + " 선택");
          chip.setAttribute("aria-selected", "false");
          els.editColorChips.append(chip);
        });
        updateColorChipSelection(currentColor);
      }

      function getColorChipOptions(currentColor) {
        var colors = [];
        function addColor(color) {
          var safeColor = validColor(color) ? color.toUpperCase() : "";
          if (safeColor && colors.indexOf(safeColor) === -1) {
            colors.push(safeColor);
          }
        }

        Object.entries(store.data.categories || {}).forEach(function (entry) {
          addColor(entry[1] && entry[1].color);
        });
        COLOR_CHIP_PRESETS.forEach(addColor);
        addColor(currentColor);
        addColor(FALLBACK_COLOR);
        return colors;
      }

      function updateColorChipSelection(color) {
        var safeColor = validColor(color) ? color.toUpperCase() : FALLBACK_COLOR;
        els.editColorChips.querySelectorAll(".color-chip").forEach(function (chip) {
          var isSelected = chip.dataset.color.toUpperCase() === safeColor;
          chip.classList.toggle("is-selected", isSelected);
          chip.setAttribute("aria-selected", isSelected ? "true" : "false");
        });
      }

      function normalizeBlockType(value) {
        if (value === "normal") {
          return "sub";
        }
        if (value === "main" || value === "middle" || value === "group") {
          return value;
        }
        return "sub";
      }

      function getBlockTypeLabel(type) {
        var safeType = normalizeBlockType(type);
        if (safeType === "main") {
          return "메인";
        }
        if (safeType === "middle") {
          return "중간";
        }
        if (safeType === "group") {
          return "그룹";
        }
        return "서브";
      }

      function getNextBlockType(type) {
        var types = ["sub", "middle", "main", "group"];
        var index = types.indexOf(normalizeBlockType(type));
        return types[(index + 1) % types.length];
      }

      function cycleBlockType(blockId) {
        var block = getBlock(blockId);
        var nextType;
        var undoSnapshot;
        if (!block) {
          return;
        }
        nextType = getNextBlockType(block.type);
        undoSnapshot = createUndoSnapshot();
        block.type = nextType;
        clearBlockManualSize(block);
        if (nextType === "main" || nextType === "group") {
          block.inheritColor = false;
        }
        if (nextType === "group" && !Array.isArray(block.children)) {
          block.children = [];
        }
        normalizeDiagramParentIds(store.data);
        pushUndoSnapshot(undoSnapshot);
        renderAll();
        saveLocalState();
        showToast("블록 성격을 " + getBlockTypeLabel(nextType) + "(으)로 변경했습니다.");
      }

      function normalizeParentId(parentId, blockId) {
        var safeParentId = String(parentId || "");
        var parent = safeParentId ? getBlock(safeParentId) : null;
        if (!safeParentId || safeParentId === blockId || !parent || !isGroupBlock(parent)) {
          return "";
        }
        return safeParentId;
      }

      function getReadableTextColor(color) {
        var rgb = hexToRgb(color);
        if (!rgb) {
          return "#ffffff";
        }
        var brightness = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
        return brightness >= 150 ? "#282721" : "#ffffff";
      }

      function hexToRgb(color) {
        if (!validColor(color)) {
          return null;
        }
        return {
          r: parseInt(color.slice(1, 3), 16),
          g: parseInt(color.slice(3, 5), 16),
          b: parseInt(color.slice(5, 7), 16)
        };
      }

      function renderConnections() {
        els.connectionGroup.replaceChildren();
        store.data.connections.forEach(function (connection, index) {
          var key = getConnectionKey(connection);
          var fromEndpoint = resolveConnectionEndpoint(connection.from, key);
          var toEndpoint = resolveConnectionEndpoint(connection.to, key);
          if (!fromEndpoint || !toEndpoint) {
            return;
          }

          var pathData = getConnectionPath(fromEndpoint, toEndpoint);
          var group = createSvgElement("g");
          var hit = createSvgElement("path");
          var visible = createSvgElement("path");
          var label = createConnectionLabelElement(connection, fromEndpoint, toEndpoint, key);

          hit.setAttribute("d", pathData);
          hit.setAttribute("tabindex", "0");
          hit.setAttribute("class", "connection-hit");
          hit.setAttribute("aria-label", getConnectionLabel(connection) ? "연결선 선택: " + getConnectionLabel(connection) : "연결선 선택");
          hit.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            selectConnection(key, event.shiftKey || event.ctrlKey || event.metaKey);
          });
          hit.addEventListener("dblclick", function (event) {
            event.preventDefault();
            event.stopPropagation();
            editConnectionLabel(key);
          });
          hit.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              if (event.key === "Enter" && isConnectionSelected(key)) {
                editConnectionLabel(key);
              } else {
                selectConnection(key, event.shiftKey || event.ctrlKey || event.metaKey);
              }
            }
          });

          visible.setAttribute("d", pathData);
          visible.setAttribute("class", isConnectionSelected(key) ? "connection-visible is-selected" : "connection-visible");
          group.append(hit, visible);
          if (label) {
            group.append(label);
          }
          els.connectionGroup.append(group);
        });
      }

      function createConnectionLabelElement(connection, fromBlock, toBlock, key) {
        var labelText = getConnectionLabel(connection);
        if (!labelText) {
          return null;
        }
        var ioType = getConnectionIoType(connection);
        var ioLabel = getConnectionIoLabel(ioType);
        var point = getConnectionLabelPoint(fromBlock, toBlock);
        var size = getConnectionLabelSize(connection);
        var isSelected = isConnectionSelected(key);
        var actionHeight = isSelected ? 34 : 0;
        var boxWidth = isSelected ? Math.max(size.width, 148) : size.width;
        var endpointId = createConnectionLabelEndpointId(connection);
        var foreignObject = createSvgElement("foreignObject");
        var shell = document.createElement("div");
        var label = document.createElement("div");
        var text = document.createElement("span");
        foreignObject.setAttribute("x", Math.round(point.x - boxWidth / 2));
        foreignObject.setAttribute("y", Math.round(point.y - size.height / 2));
        foreignObject.setAttribute("width", boxWidth);
        foreignObject.setAttribute("height", size.height + actionHeight);
        foreignObject.setAttribute("class", isSelected ? "connection-label-box is-selected" : "connection-label-box");
        foreignObject.setAttribute("tabindex", "0");
        foreignObject.setAttribute("aria-label", "연결 내용 블록: " + labelText);
        foreignObject.dataset.connectionKey = key;
        if (endpointId) {
          foreignObject.dataset.connectionEndpointId = endpointId;
        }
        foreignObject.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          selectConnection(key, event.shiftKey || event.ctrlKey || event.metaKey);
        });
        foreignObject.addEventListener("dblclick", function (event) {
          event.preventDefault();
          event.stopPropagation();
          editConnectionLabel(key);
        });
        foreignObject.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (event.key === "Enter" && isConnectionSelected(key)) {
              editConnectionLabel(key);
            } else {
              selectConnection(key, event.shiftKey || event.ctrlKey || event.metaKey);
            }
          }
        });
        label.className = "connection-label" + (ioType ? " is-" + ioType : "");
        if (ioLabel) {
          var badge = document.createElement("span");
          badge.className = "connection-io-badge";
          badge.textContent = ioLabel;
          label.append(badge);
        }
        text.className = "connection-label-text";
        text.textContent = labelText;
        label.append(text);
        shell.className = "connection-label-shell";
        shell.append(label);
        if (isSelected) {
          shell.append(createConnectionLabelActions(key, ioType));
        }
        foreignObject.append(shell);
        return foreignObject;
      }

      function createConnectionLabelActions(key, currentIoType) {
        var actions = document.createElement("div");
        actions.className = "connection-label-actions";
        ["input", "output"].forEach(function (type) {
          var button = document.createElement("button");
          var isSelected = currentIoType === type;
          button.className = "connection-label-action-button" + (isSelected ? " is-selected" : "");
          button.type = "button";
          button.dataset.io = type;
          button.textContent = getConnectionIoLabel(type);
          button.title = getConnectionIoLabel(type) + " 상태로 설정";
          button.setAttribute("aria-pressed", isSelected ? "true" : "false");
          button.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            setConnectionIoType(key, type);
          });
          actions.append(button);
        });
        return actions;
      }

      function getConnectionLabelPoint(fromBlock, toBlock) {
        var start = edgePoint(fromBlock, toBlock);
        var end = edgePoint(toBlock, fromBlock);
        return {
          x: (start.x + end.x) / 2,
          y: (start.y + end.y) / 2
        };
      }

      function getConnectionLabel(connection) {
        return String(connection && connection.label || "").trim();
      }

      function getConnectionLabelSize(connection) {
        var labelText = getConnectionLabel(connection);
        var ioLabel = getConnectionIoLabel(getConnectionIoType(connection));
        return {
          width: Math.max(56, Math.ceil(estimateTextWidth(labelText, 12) + (ioLabel ? estimateTextWidth(ioLabel, 9) + 42 : 22))),
          height: 30
        };
      }

      function createConnectionLabelEndpointId(connection) {
        if (!connection || !getConnectionLabel(connection) || !getBlock(connection.from) || !getBlock(connection.to)) {
          return "";
        }
        return CONNECTION_LABEL_ENDPOINT_PREFIX + encodeConnectionEndpointPart(connection.from) + "|" + encodeConnectionEndpointPart(connection.to);
      }

      function encodeConnectionEndpointPart(value) {
        return encodeURIComponent(String(value || ""));
      }

      function parseConnectionLabelEndpointId(endpointId) {
        var raw = String(endpointId || "");
        if (raw.indexOf(CONNECTION_LABEL_ENDPOINT_PREFIX) !== 0) {
          return null;
        }
        var body = raw.slice(CONNECTION_LABEL_ENDPOINT_PREFIX.length);
        var splitAt = body.indexOf("|");
        if (splitAt === -1) {
          return null;
        }
        try {
          var from = decodeURIComponent(body.slice(0, splitAt));
          var to = decodeURIComponent(body.slice(splitAt + 1));
          if (!from || !to || from === to) {
            return null;
          }
          return {
            from: from,
            to: to,
            key: from + "\u0000" + to
          };
        } catch (error) {
          return null;
        }
      }

      function isConnectionLabelEndpointId(endpointId) {
        return Boolean(parseConnectionLabelEndpointId(endpointId));
      }

      function getConnectionLabelReferenceKey(endpointId) {
        var parsed = parseConnectionLabelEndpointId(endpointId);
        return parsed ? parsed.key : "";
      }

      function resolveConnectionEndpoint(endpointId, excludedConnectionKey) {
        var block = getBlock(endpointId);
        if (block) {
          return block;
        }
        var parsed = parseConnectionLabelEndpointId(endpointId);
        if (!parsed || parsed.key === excludedConnectionKey) {
          return null;
        }
        var connection = findConnectionByKey(parsed.key);
        if (!connection || !getConnectionLabel(connection)) {
          return null;
        }
        var fromBlock = getBlock(connection.from);
        var toBlock = getBlock(connection.to);
        if (!fromBlock || !toBlock) {
          return null;
        }
        var point = getConnectionLabelPoint(fromBlock, toBlock);
        var size = getConnectionLabelSize(connection);
        return {
          id: String(endpointId),
          endpointType: "connection-label",
          title: getConnectionLabel(connection),
          x: point.x - size.width / 2,
          y: point.y - size.height / 2,
          width: size.width,
          height: size.height
        };
      }

      function getConnectionIoType(connection) {
        return normalizeConnectionIoType(connection && connection.ioType);
      }

      function normalizeConnectionIoType(value) {
        var type = String(value || "").trim().toLowerCase();
        if (type === "input" || type === "in" || type === "입력") {
          return "input";
        }
        if (type === "output" || type === "out" || type === "출력") {
          return "output";
        }
        return "";
      }

      function getConnectionIoLabel(type) {
        if (type === "input") {
          return "INPUT";
        }
        if (type === "output") {
          return "OUTPUT";
        }
        return "";
      }

      function editConnectionLabel(key) {
        var connection = findConnectionByKey(key);
        if (!connection) {
          return;
        }
        store.innerDiagram.editConnectionKey = null;
        store.editConnectionKey = key;
        els.connectionLabelText.value = getConnectionLabel(connection);
        setConnectionIoEditValue(getConnectionIoType(connection));
        els.connectionEditModal.classList.add("is-open");
        setTimeout(function () {
          els.connectionLabelText.focus();
          els.connectionLabelText.select();
        }, 0);
      }

      function closeConnectionEditModal() {
        store.editConnectionKey = null;
        store.innerDiagram.editConnectionKey = null;
        if (els.connectionEditModal) {
          els.connectionEditModal.classList.remove("is-open");
        }
      }

      function saveConnectionEditModal() {
        if (store.innerDiagram.editConnectionKey) {
          saveInnerConnectionEditModal();
          return;
        }
        var connection = findConnectionByKey(store.editConnectionKey);
        if (!connection) {
          closeConnectionEditModal();
          return;
        }
        var currentLabel = getConnectionLabel(connection);
        var currentIoType = getConnectionIoType(connection);
        var nextLabel = String(els.connectionLabelText.value || "").trim();
        var nextIoType = nextLabel ? normalizeConnectionIoType(els.connectionIoType.value) : "";
        if (nextLabel !== currentLabel || nextIoType !== currentIoType) {
          pushUndoSnapshot(createUndoSnapshot());
          connection.label = nextLabel;
          connection.ioType = nextIoType;
          renderConnections();
          saveLocalState();
          showToast(nextLabel ? "연결 내용을 저장했습니다." : "연결 내용을 비웠습니다.");
        }
        closeConnectionEditModal();
      }

      function setConnectionIoType(key, type) {
        var connection = findConnectionByKey(key);
        if (!connection || !getConnectionLabel(connection)) {
          return;
        }
        var nextIoType = normalizeConnectionIoType(type);
        if (!nextIoType || getConnectionIoType(connection) === nextIoType) {
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        connection.ioType = nextIoType;
        renderConnections();
        saveLocalState();
        showToast(getConnectionIoLabel(nextIoType) + " 상태로 설정했습니다.");
      }

      function handleConnectionIoButtonClick(event) {
        var button = event.target.closest(".connection-io-button");
        if (!button) {
          return;
        }
        setConnectionIoEditValue(button.dataset.io);
      }

      function setConnectionIoEditValue(type) {
        var safeType = normalizeConnectionIoType(type);
        els.connectionIoType.value = safeType;
        els.connectionIoToggle.querySelectorAll(".connection-io-button").forEach(function (button) {
          var isSelected = normalizeConnectionIoType(button.dataset.io) === safeType;
          button.classList.toggle("is-selected", isSelected);
          button.setAttribute("aria-pressed", isSelected ? "true" : "false");
        });
      }

      function addBlockAtViewportCenter() {
        var rect = els.viewport.getBoundingClientRect();
        var center = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
        addBlockAtWorldPoint(center.x, center.y);
      }

      function addGroupBlockAtViewportCenter() {
        var rect = els.viewport.getBoundingClientRect();
        var center = screenToWorld(rect.left + rect.width / 2, rect.top + rect.height / 2);
        addBlockAtWorldPoint(center.x, center.y, {
          type: "group",
          title: "그룹블록",
          select: true,
          focusTitle: true
        });
      }

      function addBlockAtWorldPoint(centerX, centerY, options) {
        var category = Object.keys(store.data.categories || {})[0] || "";
        options = options || {};
        var blockType = normalizeBlockType(options.type || "main");
        var block = {
          id: createUniqueBlockId(),
          title: options.title || "새 블록",
          subtitle: "",
          detail: "",
          link: "",
          tool: "",
          images: [],
          htmlFiles: [],
          innerDiagram: createEmptyInnerDiagram(),
          startDate: null,
          dueDate: null,
          status: null,
          done: false,
          highlight: false,
          category: category,
          type: blockType,
          parentId: "",
          children: blockType === "group" ? [] : undefined,
          inheritColor: blockType !== "main" && blockType !== "group",
          color: getCategoryColor(category),
          x: 0,
          y: 0
        };
        block.x = Math.round(centerX - getBlockWidth(block) / 2);
        block.y = Math.round(centerY - getBlockHeight(block) / 2);
        pushUndoSnapshot(createUndoSnapshot());
        store.data.blocks.push(block);
        if (options.select) {
          setSelection([block.id]);
        }
        if (options.focusTitle) {
          store.focusTitleBlockId = block.id;
        }
        renderAll();
        saveLocalState();
        showToast("새 블록을 추가했습니다.");
        return block;
      }

      function autoArrangeBlocks() {
        var blocks = store.data.blocks || [];
        if (!blocks.length) {
          showToast("정렬할 블록이 없습니다.");
          return;
        }

        pushUndoSnapshot(createUndoSnapshot());
        clearSelectionState();
        var layout = buildAutoLayout(blocks);
        applyAutoLayout(layout);
        resetView();
        renderAll();
        saveLocalState();
        showToast("블록을 자동정렬했습니다.");
      }

      function setConnectionStyle(style) {
        var nextStyle = normalizeConnectionStyle(style);
        if (normalizeConnectionStyle(store.data.connectionStyle) === nextStyle) {
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        store.data.connectionStyle = nextStyle;
        updateConnectionStyleControls();
        renderConnections();
        saveLocalState();
        showToast(nextStyle === "straight" ? "연결선을 직선으로 표시합니다." : "연결선을 곡선으로 표시합니다.");
      }

      function updateConnectionStyleControls() {
        if (!els.connectionStraightButton || !els.connectionCurveButton) {
          return;
        }
        var style = normalizeConnectionStyle(store.data.connectionStyle);
        els.connectionStraightButton.classList.toggle("is-active", style === "straight");
        els.connectionStraightButton.setAttribute("aria-pressed", style === "straight" ? "true" : "false");
        els.connectionCurveButton.classList.toggle("is-active", style === "curve");
        els.connectionCurveButton.setAttribute("aria-pressed", style === "curve" ? "true" : "false");
      }

      function updateScheduleControls() {
        if (els.timelineButton) {
          els.timelineButton.classList.toggle("is-active", store.timelineOpen);
          els.timelineButton.setAttribute("aria-pressed", store.timelineOpen ? "true" : "false");
        }
        if (els.highlightOnlyButton) {
          els.highlightOnlyButton.classList.toggle("is-active", store.highlightOnly);
          els.highlightOnlyButton.setAttribute("aria-pressed", store.highlightOnly ? "true" : "false");
        }
      }

      function toggleTimelinePanel() {
        store.timelineOpen = !store.timelineOpen;
        updateScheduleControls();
        renderTimelinePanel();
      }

      function toggleHighlightOnly() {
        store.highlightOnly = !store.highlightOnly;
        renderAll();
      }

      function handleTimelineFilterClick(event) {
        var button = event.target.closest(".timeline-filter-button");
        if (!button) {
          return;
        }
        store.timelineFilter = button.dataset.filter || "all";
        renderTimelinePanel();
      }

      function handleTimelineRowClick(event) {
        var row = event.target.closest(".timeline-row");
        if (!row) {
          return;
        }
        focusBlockFromTimeline(row.dataset.blockId);
      }

      function renderTimelinePanel() {
        if (!els.timelinePanel || !els.timelineList) {
          return;
        }
        els.timelinePanel.classList.toggle("is-open", store.timelineOpen);
        if (els.timelineFilters) {
          els.timelineFilters.querySelectorAll(".timeline-filter-button").forEach(function (button) {
            var isActive = button.dataset.filter === store.timelineFilter;
            button.classList.toggle("is-active", isActive);
          });
        }
        els.timelineList.replaceChildren();
        var blocks = getTimelineBlocks();
        if (!blocks.length) {
          var empty = document.createElement("div");
          empty.className = "timeline-empty";
          empty.textContent = "마감일이 있는 블록이 없습니다.";
          els.timelineList.append(empty);
          return;
        }
        blocks.forEach(function (block) {
          els.timelineList.append(createTimelineRow(block));
        });
      }

      function getTimelineBlocks() {
        var filter = store.timelineFilter || "all";
        return (store.data.blocks || []).filter(function (block) {
          return Boolean(normalizeDateString(block.dueDate));
        }).filter(function (block) {
          return timelineFilterMatches(block, filter);
        }).sort(function (a, b) {
          return getLocalDateTime(a.dueDate) - getLocalDateTime(b.dueDate);
        });
      }

      function timelineFilterMatches(block, filter) {
        if (filter === "all") {
          return true;
        }
        var info = getDdayInfo(block);
        if (!info) {
          return false;
        }
        if (filter === "done") {
          return Boolean(block.done) || normalizeScheduleStatus(block.status) === "done";
        }
        if (filter === "progress") {
          return !block.done && normalizeScheduleStatus(block.status) === "progress";
        }
        if (filter === "overdue") {
          return !block.done && info.diff < 0;
        }
        if (filter === "soon") {
          return !block.done && info.diff >= 0 && info.diff <= 3;
        }
        return true;
      }

      function createTimelineRow(block) {
        var info = getDdayInfo(block);
        var row = document.createElement("button");
        var content = document.createElement("div");
        var title = document.createElement("div");
        var meta = document.createElement("div");
        var badge = document.createElement("div");
        row.className = "timeline-row";
        row.type = "button";
        row.dataset.blockId = block.id;
        row.style.setProperty("--row-color", info.color);
        title.className = "timeline-row-title";
        title.textContent = block.title || "제목 없음";
        meta.className = "timeline-row-meta";
        meta.textContent = buildTimelineMeta(block);
        badge.className = "timeline-row-badge";
        badge.textContent = info.label;
        content.append(title, meta);
        row.append(content, badge);
        return row;
      }

      function buildTimelineMeta(block) {
        var parts = [];
        if (block.startDate) {
          parts.push("시작 " + block.startDate);
        }
        if (block.dueDate) {
          parts.push("마감 " + block.dueDate);
        }
        parts.push(getScheduleStatusLabel(block.status));
        if (block.done) {
          parts.push("완료 표시");
        }
        return parts.join(" · ");
      }

      function focusBlockFromTimeline(blockId) {
        var block = getBlock(blockId);
        if (!block) {
          return;
        }
        var rect = els.viewport.getBoundingClientRect();
        var centerX = Number(block.x) + getBlockWidth(block) / 2;
        var centerY = Number(block.y) + getBlockHeight(block) / 2;
        store.view.panX = rect.width / 2 - centerX * store.view.scale;
        store.view.panY = rect.height / 2 - centerY * store.view.scale;
        setSelection([block.id]);
        updateTransform();
        renderAll();
      }

      function alignSelectedBlocksLeft() {
        var blocks = getArrangementSelection(2, "왼쪽 맞춤");
        if (!blocks.length) {
          return;
        }
        var targetX = Math.min.apply(null, blocks.map(function (block) {
          return Number(block.x) || 0;
        }));
        applySelectedBlockPositions(blocks.map(function (block) {
          return {
            block: block,
            x: targetX,
            y: Number(block.y) || 0
          };
        }), "왼쪽 맞춤했습니다.");
      }

      function alignSelectedBlocksCenter() {
        var blocks = getArrangementSelection(2, "중심선 정렬");
        if (!blocks.length) {
          return;
        }
        var left = Math.min.apply(null, blocks.map(function (block) {
          return Number(block.x) || 0;
        }));
        var right = Math.max.apply(null, blocks.map(function (block) {
          return (Number(block.x) || 0) + getBlockWidth(block);
        }));
        var targetCenterX = (left + right) / 2;
        applySelectedBlockPositions(blocks.map(function (block) {
          return {
            block: block,
            x: targetCenterX - getBlockWidth(block) / 2,
            y: Number(block.y) || 0
          };

      function alignSelectedBlocksHorizontalCenter() {

        if (!blocks.length) {
          return;
        }
        var top = Math.min.apply(null, blocks.map(function (block) {
          return Number(block.y) || 0;
        }));
        var bottom = Math.max.apply(null, blocks.map(function (block) {
          return (Number(block.y) || 0) + getBlockHeight(block);
        }));
        var targetCenterY = (top + bottom) / 2;
        applySelectedBlockPositions(blocks.map(function (block) {

          };

      function alignSelectedBlocksBottom() {
        var blocks = getArrangementSelection(2, "아래쪽 맞춤");
        if (!blocks.length) {

        var targetBottom = Math.max.apply(null, blocks.map(function (block) {

      function distributeSelectedBlocksHorizontally() {
        var blocks = getArrangementSelection(3, "가로 간격 균등");
        if (!blocks.length) {
          return;
        }
        var sortedBlocks = blocks.slice().sort(function (a, b) {
          return (Number(a.x) || 0) - (Number(b.x) || 0);
        });
        var firstLeft = Number(sortedBlocks[0].x) || 0;
        var lastBlock = sortedBlocks[sortedBlocks.length - 1];
        var lastRight = (Number(lastBlock.x) || 0) + getBlockWidth(lastBlock);
        var totalWidth = sortedBlocks.reduce(function (sum, block) {
          return sum + getBlockWidth(block);
        }, 0);
        var gap = (lastRight - firstLeft - totalWidth) / (sortedBlocks.length - 1);
        var cursorX = firstLeft;
        var positions = sortedBlocks.map(function (block) {
          var position = {
            block: block,
            x: cursorX,
            y: Number(block.y) || 0
          };
          cursorX += getBlockWidth(block) + gap;
          return position;
        });
        applySelectedBlockPositions(positions, "가로 간격을 균등하게 맞췄습니다.");
      }

      function distributeSelectedBlocksVertically() {
        var blocks = getArrangementSelection(3, "세로 간격 균등");
        if (!blocks.length) {
          return;
        }
        var sortedBlocks = blocks.slice().sort(function (a, b) {
          return (Number(a.y) || 0) - (Number(b.y) || 0);
        });
        var firstTop = Number(sortedBlocks[0].y) || 0;
        var lastBlock = sortedBlocks[sortedBlocks.length - 1];
        var lastBottom = (Number(lastBlock.y) || 0) + getBlockHeight(lastBlock);
        var totalHeight = sortedBlocks.reduce(function (sum, block) {
          return sum + getBlockHeight(block);
        }, 0);
        var gap = (lastBottom - firstTop - totalHeight) / (sortedBlocks.length - 1);
        var cursorY = firstTop;
        var positions = sortedBlocks.map(function (block) {
          var position = {
            block: block,
            x: Number(block.x) || 0,
            y: cursorY
          };
          cursorY += getBlockHeight(block) + gap;
          return position;
        });
        applySelectedBlockPositions(positions, "세로 간격을 균등하게 맞췄습니다.");
      }

      function getArrangementSelection(minimumCount, actionName) {
        var blocks = getSelectedBlockIds().map(getBlock).filter(Boolean);
        if (blocks.length < minimumCount) {
          showToast(actionName + "은 블록 " + minimumCount + "개 이상 선택하세요.");
          return [];
        }
        return blocks;
      }

      function applySelectedBlockPositions(positions, successMessage) {
        var changedPositions = positions.filter(function (position) {
          return Math.round(Number(position.block.x) || 0) !== Math.round(position.x) ||
            Math.round(Number(position.block.y) || 0) !== Math.round(position.y);
        });
        if (!changedPositions.length) {
          showToast("이미 맞춰진 상태입니다.");
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        positions.forEach(function (position) {
          position.block.x = Math.round(position.x);
          position.block.y = Math.round(position.y);
        });
        renderAll();
        saveLocalState();
        showToast(successMessage);
      }

      function buildAutoLayout(blocks) {
        var blockMap = new Map();
        var incoming = new Map();
        var outgoing = new Map();
        var connectedIds = new Set();

        blocks.forEach(function (block) {
          blockMap.set(block.id, block);
          incoming.set(block.id, []);
          outgoing.set(block.id, []);
        });

        store.data.connections.forEach(function (connection) {
          if (!blockMap.has(connection.from) || !blockMap.has(connection.to)) {
            return;
          }
          outgoing.get(connection.from).push(connection.to);
          incoming.get(connection.to).push(connection.from);
          connectedIds.add(connection.from);
          connectedIds.add(connection.to);
        });

        var connectedBlocks = blocks.filter(function (block) {
          return connectedIds.has(block.id);
        });
        var isolatedBlocks = blocks.filter(function (block) {
          return !connectedIds.has(block.id);
        });

        var levelMap = assignLayoutLevels(connectedBlocks, incoming, outgoing);
        return {
          connectedGroups: groupBlocksByLevel(connectedBlocks, levelMap),
          isolatedBlocks: sortLayoutBlocks(isolatedBlocks)
        };
      }

      function assignLayoutLevels(blocks, incoming, outgoing) {
        var levelMap = new Map();
        var blockIds = new Set(blocks.map(function (block) {
          return block.id;
        }));
        var roots = blocks.filter(function (block) {
          return (incoming.get(block.id) || []).filter(function (id) {
            return blockIds.has(id);
          }).length === 0;
        });

        if (!roots.length) {
          roots = blocks.slice();
        }
        roots = sortLayoutBlocks(roots);

        function visitFrom(seed) {
          var queue = [{ id: seed.id, level: levelMap.has(seed.id) ? levelMap.get(seed.id) : 0 }];
          if (!levelMap.has(seed.id)) {
            levelMap.set(seed.id, 0);
          }
          while (queue.length) {
            var current = queue.shift();
            (outgoing.get(current.id) || []).forEach(function (nextId) {
              if (!blockIds.has(nextId)) {
                return;
              }
              var nextLevel = current.level + 1;
              if (!levelMap.has(nextId)) {
                levelMap.set(nextId, nextLevel);
                queue.push({ id: nextId, level: nextLevel });
              }
            });
          }
        }

        roots.forEach(visitFrom);
        sortLayoutBlocks(blocks).forEach(function (block) {
          if (!levelMap.has(block.id)) {
            visitFrom(block);
          }
        });
        return levelMap;
      }

      function groupBlocksByLevel(blocks, levelMap) {
        var groups = [];
        blocks.forEach(function (block) {
          var level = levelMap.get(block.id) || 0;
          if (!groups[level]) {
            groups[level] = [];
          }
          groups[level].push(block);
        });
        return groups.map(function (group) {
          return sortLayoutBlocks(group || []);
        });
      }

      function applyAutoLayout(layout) {
        var startX = 120;
        var startY = 100;
        var columnGap = 260;
        var rowGap = 76;
        var isolatedGapY = 150;
        var currentX = startX;
        var maxBottom = startY;
        var hasConnectedLayout = false;

        layout.connectedGroups.forEach(function (group) {
          if (!group || !group.length) {
            return;
          }
          hasConnectedLayout = true;
          var columnWidth = Math.max.apply(null, group.map(getBlockWidth));
          var currentY = startY;
          group.forEach(function (block) {
            block.x = Math.round(currentX + (columnWidth - getBlockWidth(block)) / 2);
            block.y = Math.round(currentY);
            currentY += getBlockHeight(block) + rowGap;
          });
          maxBottom = Math.max(maxBottom, currentY - rowGap);
          currentX += columnWidth + columnGap;
        });

        if (layout.isolatedBlocks.length) {
          placeIsolatedBlocks(layout.isolatedBlocks, startX, hasConnectedLayout ? maxBottom + isolatedGapY : startY);
        }
      }

      function placeIsolatedBlocks(blocks, startX, startY) {
        var maxRowWidth = 1280;
        var columnGap = 56;
        var rowGap = 64;
        var x = startX;
        var y = startY;
        var rowHeight = 0;

        blocks.forEach(function (block) {
          var width = getBlockWidth(block);
          var height = getBlockHeight(block);
          if (x > startX && x + width > startX + maxRowWidth) {
            x = startX;
            y += rowHeight + rowGap;
            rowHeight = 0;
          }
          block.x = Math.round(x);
          block.y = Math.round(y);
          x += width + columnGap;
          rowHeight = Math.max(rowHeight, height);
        });
      }

      function sortLayoutBlocks(blocks) {
        return blocks.slice().sort(function (a, b) {
          var typeDiff = getLayoutTypeRank(a) - getLayoutTypeRank(b);
          if (typeDiff !== 0) {
            return typeDiff;
          }
          var yDiff = (Number(a.y) || 0) - (Number(b.y) || 0);
          if (yDiff !== 0) {
            return yDiff;
          }
          var xDiff = (Number(a.x) || 0) - (Number(b.x) || 0);
          if (xDiff !== 0) {
            return xDiff;
          }
          return String(a.title || "").localeCompare(String(b.title || ""), "ko");
        });
      }

      function getLayoutTypeRank(block) {
        var type = normalizeBlockType(block && block.type);
        if (type === "group") {
          return 0;
        }
        if (type === "main") {
          return 1;
        }
        return type === "middle" ? 2 : 3;
      }

      function removeBlock(blockId) {
        if (!getBlock(blockId)) {
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        if (store.selectedBlockId === blockId) {
          store.selectedBlockId = null;
        }
        store.selectedBlockIds = store.selectedBlockIds.filter(function (id) {
          return id !== blockId;
        });
        if (store.editBlockId === blockId) {
          store.editBlockId = null;
        }
        store.data.blocks = store.data.blocks.filter(function (block) {
          return block.id !== blockId;
        });
        var removeIds = new Set([blockId]);
        removeIdsFromAllGroupChildren(removeIds);
        clearParentIdsForRemovedGroups(removeIds);
        store.data.connections = store.data.connections.filter(function (connection) {
          return !connectionTouchesBlockIds(connection, removeIds);
        });
        setConnectionSelection(store.selectedConnectionKeys);
        renderAll();
        saveLocalState();
        showToast("블록을 삭제했습니다.");
      }

      function removeSelectedItems() {
        var blockIds = getSelectedBlockIds();
        var connectionKeys = getSelectedConnectionKeys();
        if (!blockIds.length && !connectionKeys.length) {
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        if (blockIds.length) {
          var removeIds = new Set(blockIds);
          store.data.blocks = store.data.blocks.filter(function (block) {
            return !removeIds.has(block.id);
          });
          removeIdsFromAllGroupChildren(removeIds);
          clearParentIdsForRemovedGroups(removeIds);
          store.data.connections = store.data.connections.filter(function (connection) {
            return !connectionTouchesBlockIds(connection, removeIds);
          });
        }
        if (connectionKeys.length) {
          var removeKeys = new Set(connectionKeys);
          store.data.connections = store.data.connections.filter(function (connection) {
            return !removeKeys.has(getConnectionKey(connection)) && !connectionReferencesConnectionKeys(connection, removeKeys);
          });
        }
        clearSelectionState();
        renderAll();
        saveLocalState();
        var count = blockIds.length + connectionKeys.length;
        showToast(count > 1 ? count + "개 항목을 삭제했습니다." : "선택 항목을 삭제했습니다.");
      }

      function removeSelectedBlocks() {
        var blockIds = store.selectedBlockIds.length ? store.selectedBlockIds.slice() : (store.selectedBlockId ? [store.selectedBlockId] : []);
        if (!blockIds.length) {
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        var removeIds = new Set(blockIds);
        store.data.blocks = store.data.blocks.filter(function (block) {
          return !removeIds.has(block.id);
        });
        removeIdsFromAllGroupChildren(removeIds);
        clearParentIdsForRemovedGroups(removeIds);
        store.data.connections = store.data.connections.filter(function (connection) {
          return !connectionTouchesBlockIds(connection, removeIds);
        });
        if (store.editBlockId && removeIds.has(store.editBlockId)) {
          store.editBlockId = null;
        }
        clearSelectionState();
        renderAll();
        saveLocalState();
        showToast(blockIds.length > 1 ? blockIds.length + "개 블록을 삭제했습니다." : "블록을 삭제했습니다.");
      }

      function clearParentIdsForRemovedGroups(removeIds) {
        store.data.blocks.forEach(function (block) {
          if (block.parentId && removeIds.has(block.parentId)) {
            block.parentId = "";
          }
        });
      }

      function duplicateBlock(blockId) {

        if (!source) {
          return;
        }
        var copy = {
          id: createUniqueBlockId(),
          title: source.title,
          subtitle: source.subtitle || "",

          link: String(source.link || ""),
          tool: normalizeTool(source.tool),
          images: getBlockImages(source),
          htmlFiles: getBlockHtmlFiles(source),
          innerDiagram: cloneInnerDiagram(source.innerDiagram),
          startDate: normalizeDateString(source.startDate),
          dueDate: normalizeDateString(source.dueDate),
          status: normalizeScheduleStatus(source.status),
          done: Boolean(source.done),

          category: source.category,

          color: getBlockColor(source),
