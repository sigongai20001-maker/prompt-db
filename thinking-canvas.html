      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeJsonForHtml(value) {
        return String(value)
          .replace(/&/g, "\\u0026")
          .replace(/</g, "\\u003c")
          .replace(/>/g, "\\u003e");
      }

      function openEditModal(blockId) {
        var block = getBlock(blockId);
        if (!block) {
          return;
        }
        store.editBlockId = blockId;
        setSelection([blockId]);
        els.editTitle.value = block.title;
        els.editSubtitle.value = block.subtitle || "";
        renderSubtitleTags();
        setEditBlockTypeValue(block.type);
        renderColorChips(getBlockColor(block));
        setEditColorValue(getBlockColor(block));
        setEditColorInheritedValue(shouldInheritBlockColor(store.data, block));
        els.editDetail.value = block.detail;
        store.editImages = getBlockImages(block);
        renderEditImages();
        els.editLink.value = block.link || "";
        updateInnerDiagramSummary(block);
        els.editModal.classList.add("is-open");
        setTimeout(function () {
          els.editTitle.focus();
          els.editTitle.select();
        }, 0);
      }

      function closeEditModal() {
        store.editBlockId = null;
        store.editImages = [];
        if (els.editImageDropZone) {
          els.editImageDropZone.classList.remove("is-drop-target");
        }
        if (els.editImageFile) {
          els.editImageFile.value = "";
        }
        els.editModal.classList.remove("is-open");
        renderAll();
      }

      function saveEditedBlock() {
        var block = getBlock(store.editBlockId);
        if (!block) {
          closeEditModal();
          return;
        }
        var undoSnapshot = createUndoSnapshot();
        block.title = els.editTitle.value;
        block.subtitle = els.editSubtitle.value;
        rememberSubtitleTags(block.subtitle);
        block.type = normalizeBlockType(els.editBlockType.value);
        block.color = validColor(els.editBlockColor.value) ? els.editBlockColor.value : getCategoryColor(block.category);
        block.inheritColor = normalizeBlockType(block.type) !== "main" && els.editColorInherited.value === "true";
        block.detail = els.editDetail.value;
        block.images = cloneBlockImages(store.editImages);
        block.link = String(els.editLink.value || "").trim();
        if (!diagramDataEquals(undoSnapshot.data, getExportData())) {
          pushUndoSnapshot(undoSnapshot);
        }
        renderAll();
        saveLocalState();
        closeEditModal();
        showToast("블록을 수정했습니다.");
      }

      function renderSubtitleTags() {
        if (!els.subtitleTagButtons) {
          return;
        }
        var currentTags = parseSubtitleTags(els.editSubtitle.value);
        var currentSet = new Set(currentTags.map(normalizeSubtitleTagKey));
        var tags = getSubtitleTagOptions();
        els.subtitleTagButtons.replaceChildren();
        tags.forEach(function (tag) {
          var pill = document.createElement("span");
          var button = document.createElement("button");
          var deleteButton = document.createElement("button");
          var isActive = currentSet.has(normalizeSubtitleTagKey(tag));
          pill.className = "subtitle-tag-pill" + (isActive ? " is-active" : "");
          pill.dataset.tag = tag;
          button.className = "subtitle-tag-button";
          button.type = "button";
          button.dataset.tag = tag;
          button.textContent = tag;
          button.title = tag + " 추가";
          deleteButton.className = "subtitle-tag-delete-button";
          deleteButton.type = "button";
          deleteButton.dataset.tag = tag;
          deleteButton.textContent = "×";
          deleteButton.title = tag + " 삭제";
          deleteButton.setAttribute("aria-label", tag + " 태그 삭제");
          function chooseTag(event) {
            event.preventDefault();
            event.stopPropagation();
            appendSubtitleTag(tag);
          }
          function deleteTag(event) {
            event.preventDefault();
            event.stopPropagation();
            deleteSubtitleTag(tag);
          }
          button.addEventListener("pointerdown", chooseTag);
          button.addEventListener("click", chooseTag);
          deleteButton.addEventListener("click", deleteTag);
          pill.append(button, deleteButton);
          els.subtitleTagButtons.append(pill);
        });
      }

      function handleSubtitleTagClick(event) {
        var deleteButton = event.target.closest(".subtitle-tag-delete-button");
        if (deleteButton) {
          deleteSubtitleTag(deleteButton.dataset.tag || "");
          return;
        }
        var button = event.target.closest(".subtitle-tag-button");
        if (!button) {
          return;
        }
        appendSubtitleTag(button.dataset.tag || button.textContent || "");
      }

      function appendSubtitleTag(tag) {
        var safeTag = normalizeSubtitleTag(tag);
        if (!safeTag) {
          return;
        }
        var tags = parseSubtitleTags(els.editSubtitle.value);
        var existing = new Set(tags.map(normalizeSubtitleTagKey));
        if (!existing.has(normalizeSubtitleTagKey(safeTag))) {
          tags.push(safeTag);
          els.editSubtitle.value = tags.join(", ");
        }
        rememberSubtitleTags(safeTag);
        renderSubtitleTags();
        els.editSubtitle.focus();
      }

      function deleteSubtitleTag(tag) {
        var safeTag = normalizeSubtitleTag(tag);
        var key = normalizeSubtitleTagKey(safeTag);
        if (!safeTag || !key) {
          return;
        }
        store.subtitleTags = store.subtitleTags.filter(function (item) {
          return normalizeSubtitleTagKey(item) !== key;
        });
        if (store.subtitleHiddenTagKeys.indexOf(key) === -1) {
          store.subtitleHiddenTagKeys.push(key);
        }
        removeSubtitleTagFromInput(safeTag);
        saveSubtitleTagMemory();
        saveSubtitleHiddenTagKeys();
        renderSubtitleTags();
        els.editSubtitle.focus();
      }

      function removeSubtitleTagFromInput(tag) {
        var key = normalizeSubtitleTagKey(tag);
        var tags = parseSubtitleTags(els.editSubtitle.value).filter(function (item) {
          return normalizeSubtitleTagKey(item) !== key;
        });
        els.editSubtitle.value = tags.join(", ");
      }

      function getSubtitleTagOptions() {
        var result = [];
        var seen = new Set();
        function add(tag) {
          var safeTag = normalizeSubtitleTag(tag);
          var key = normalizeSubtitleTagKey(safeTag);
          if (!safeTag || seen.has(key) || store.subtitleHiddenTagKeys.indexOf(key) !== -1) {
            return;
          }
          seen.add(key);
          result.push(safeTag);
        }
        store.subtitleTags.forEach(add);
        store.data.blocks.forEach(function (block) {
          parseSubtitleTags(block.subtitle).forEach(add);
        });
        return result.slice(0, SUBTITLE_TAG_LIMIT);
      }

      function parseSubtitleTags(value) {
        return String(value || "")
          .split(/[,;|/＋+·ㆍ\n\r]+/g)
          .map(normalizeSubtitleTag)
          .filter(Boolean);
      }

      function normalizeSubtitleTag(tag) {
        return String(tag || "").replace(/\s+/g, " ").trim();
      }

      function normalizeSubtitleTagKey(tag) {
        return normalizeSubtitleTag(tag).toLowerCase();
      }

      function rememberSubtitleTags(value) {
        var newTags = parseSubtitleTags(value);
        if (!newTags.length) {
          return;
        }
        var merged = [];
        var seen = new Set();
        var rememberedKeys = new Set(newTags.map(normalizeSubtitleTagKey));
        newTags.concat(store.subtitleTags).forEach(function (tag) {
          var safeTag = normalizeSubtitleTag(tag);
          var key = normalizeSubtitleTagKey(safeTag);
          if (!safeTag || seen.has(key)) {
            return;
          }
          seen.add(key);
          merged.push(safeTag);
        });
        store.subtitleTags = merged.slice(0, SUBTITLE_TAG_LIMIT);
        store.subtitleHiddenTagKeys = store.subtitleHiddenTagKeys.filter(function (key) {
          return !rememberedKeys.has(key);
        });
        saveSubtitleTagMemory();
        saveSubtitleHiddenTagKeys();
      }

      function loadSubtitleTagMemory() {
        try {
          var raw = JSON.parse(localStorage.getItem(SUBTITLE_TAG_STORAGE_KEY) || "[]");
          if (!Array.isArray(raw)) {
            return [];
          }
          var tags = [];
          var seen = new Set();
          raw.forEach(function (tag) {
            var safeTag = normalizeSubtitleTag(tag);
            var key = normalizeSubtitleTagKey(safeTag);
            if (safeTag && !seen.has(key)) {
              seen.add(key);
              tags.push(safeTag);
            }
          });
          return tags.slice(0, SUBTITLE_TAG_LIMIT);
        } catch (error) {
          return [];
        }
      }

      function saveSubtitleTagMemory() {
        try {
          localStorage.setItem(SUBTITLE_TAG_STORAGE_KEY, JSON.stringify(store.subtitleTags.slice(0, SUBTITLE_TAG_LIMIT)));
        } catch (error) {
          console.warn("Subtitle tags could not be saved.", error);
        }
      }

      function loadSubtitleHiddenTagKeys() {
        try {
          var raw = JSON.parse(localStorage.getItem(SUBTITLE_TAG_HIDDEN_STORAGE_KEY) || "[]");
          if (!Array.isArray(raw)) {
            return [];
          }
          var keys = [];
          raw.forEach(function (key) {
            var safeKey = normalizeSubtitleTagKey(key);
            if (safeKey && keys.indexOf(safeKey) === -1) {
              keys.push(safeKey);
            }
          });
          return keys.slice(0, SUBTITLE_TAG_LIMIT);
        } catch (error) {
          return [];
        }
      }

      function saveSubtitleHiddenTagKeys() {
        try {
          localStorage.setItem(SUBTITLE_TAG_HIDDEN_STORAGE_KEY, JSON.stringify(store.subtitleHiddenTagKeys.slice(0, SUBTITLE_TAG_LIMIT)));
        } catch (error) {
          console.warn("Subtitle hidden tags could not be saved.", error);
        }
      }

      function handleBlockTypeButtonClick(event) {
        var button = event.target.closest(".block-type-button");
        if (!button) {
          return;
        }
        setEditBlockTypeValue(button.dataset.type);
        previewEditedBlockVisual();
      }

      function handleColorChipClick(event) {
        var chip = event.target.closest(".color-chip");
        if (!chip) {
          return;
        }
        setEditColorInheritedValue(false);
        setEditColorValue(chip.dataset.color);
        previewEditedBlockVisual();
      }

      function handleInheritBlockColorClick() {
        var block = getBlock(store.editBlockId);
        var blockType = normalizeBlockType(els.editBlockType.value);
        var linkedMainColor = blockType === "main" ? "" : getLinkedMainBlockColor(store.data, block);
        if (!linkedMainColor) {
          showToast("연결된 메인블록이 없습니다.");
          return;
        }
        setEditColorInheritedValue(true);
        setEditColorValue(linkedMainColor);
        previewEditedBlockVisual();
      }

      function previewEditedBlockVisual() {
        var block = getBlock(store.editBlockId);
        var card = getBlockElement(store.editBlockId);
        if (!block || !card) {
          return;
        }
        applyBlockVisual(card, {
          type: normalizeBlockType(els.editBlockType.value),
          color: validColor(els.editBlockColor.value) ? els.editBlockColor.value : getCategoryColor(block.category),
          inheritColor: els.editColorInherited.value === "true",
          category: block.category
        });
        els.editBlockColorValue.textContent = validColor(els.editBlockColor.value) ? els.editBlockColor.value.toUpperCase() : getCategoryColor(block.category).toUpperCase();
      }

      function deleteEditedBlock() {
        var blockId = store.editBlockId;
        if (!blockId) {
          return;
        }
        closeEditModal();
        removeBlock(blockId);
      }

      function handleEditImageFileSelect(event) {
        addEditImageFiles(event.target.files);
        event.target.value = "";
      }

      function handleEditImageDragEnter(event) {
        if (!hasImageFiles(event.dataTransfer)) {
          return;
        }
        event.preventDefault();
        els.editImageDropZone.classList.add("is-drop-target");
      }

      function handleEditImageDragOver(event) {
        if (!hasImageFiles(event.dataTransfer)) {
          return;
        }
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
        els.editImageDropZone.classList.add("is-drop-target");
      }

      function handleEditImageDragLeave(event) {
        if (!els.editImageDropZone.contains(event.relatedTarget)) {
          els.editImageDropZone.classList.remove("is-drop-target");
        }
      }

      function handleEditImageDrop(event) {
        if (!hasImageFiles(event.dataTransfer)) {
          return;
        }
        event.preventDefault();
        els.editImageDropZone.classList.remove("is-drop-target");
        addEditImageFiles(event.dataTransfer.files);
      }

      function handleEditImagePaste(event) {
        if (!els.editModal.classList.contains("is-open")) {
          return;
        }
        var files = getImageFilesFromClipboard(event.clipboardData);
        if (!files.length) {
          return;
        }
        event.preventDefault();
        addEditImageFiles(files);
      }

      function addEditImageFiles(fileList) {
        var files = getImageFilesFromFileList(fileList);
        if (!files.length) {
          showToast("이미지 파일만 첨부할 수 있습니다.");
          return;
        }
        Promise.all(files.map(readImageFileAsDataUrl)).then(function (images) {
          store.editImages = cloneBlockImages(store.editImages).concat(images);
          renderEditImages();
          if (images[0]) {
            openImagePreview(images[0]);
          }
          showToast(images.length > 1 ? images.length + "개 이미지를 첨부했습니다." : "이미지를 첨부했습니다.");
        }).catch(function () {
          showToast("이미지를 읽지 못했습니다.");
        });
      }

      function readImageFileAsDataUrl(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve({
              id: createImageId(),
              name: file.name || "clipboard-image.png",
              type: file.type || "image/png",
              data: String(reader.result || "")
            });
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function renderEditImages() {
        els.editImageList.replaceChildren();
        cloneBlockImages(store.editImages).forEach(function (image) {
          var card = document.createElement("div");
          var img = document.createElement("img");
          var removeButton = document.createElement("button");
          var name = document.createElement("div");

          card.className = "image-card";
          card.tabIndex = 0;
          card.title = "이미지 크게 보기";
          card.addEventListener("click", function () {
            openImagePreview(image);
          });
          card.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openImagePreview(image);
            }
          });
          img.src = image.data;
          img.alt = image.name || "첨부 이미지";
          removeButton.type = "button";
          removeButton.textContent = "×";
          removeButton.title = "이미지 삭제";
          removeButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            removeEditImage(image.id);
          });
          name.className = "image-card-name";
          name.textContent = image.name || "첨부 이미지";

          card.append(img, removeButton, name);
          els.editImageList.append(card);
        });
      }

      function openImagePreview(image) {
        var safeImage = normalizeBlockImage(image);
        if (!safeImage) {
          return;
        }
        els.imagePreviewTitle.textContent = safeImage.name || "이미지 미리보기";
        els.imagePreviewImage.src = safeImage.data;
        els.imagePreviewImage.alt = safeImage.name || "첨부 이미지 미리보기";
        els.imagePreviewName.textContent = safeImage.name || "첨부 이미지";
        els.imagePreviewModal.classList.add("is-open");
      }

      function closeImagePreviewModal() {
        if (!els.imagePreviewModal) {
          return;
        }
        els.imagePreviewModal.classList.remove("is-open");
        if (els.imagePreviewImage) {
          els.imagePreviewImage.removeAttribute("src");
        }
        if (els.imagePreviewName) {
          els.imagePreviewName.textContent = "";
        }
      }

      function openInnerDiagramFromEdit() {
        if (!store.editBlockId) {
          return;
        }
        openInnerDiagramModal(store.editBlockId);
      }

      function openInnerDiagramModal(blockId) {
        var block = getBlock(blockId);
        if (!block) {
          return;
        }
        store.innerDiagram = {
          blockId: blockId,
          data: cloneInnerDiagram(block.innerDiagram),
          selectedIds: [],
          drag: null,
          editBlockId: null
        };
        els.innerDiagramTitle.textContent = "내부 다이어그램 - " + (block.title || "제목 없음");
        renderInnerDiagram();
        els.innerDiagramModal.classList.add("is-open");
      }

      function closeInnerDiagramModal() {
        closeInnerBlockEditModal();
        store.innerDiagram = {
          blockId: null,
          data: createEmptyInnerDiagram(),
          selectedIds: [],
          drag: null,
          editBlockId: null
        };
        if (els.innerDiagramModal) {
          els.innerDiagramModal.classList.remove("is-open");
        }
      }

      function saveInnerDiagramModal() {
        var block = getBlock(store.innerDiagram.blockId);
        if (!block) {
          closeInnerDiagramModal();
          return;
        }
        var undoSnapshot = createUndoSnapshot();
        block.innerDiagram = cloneInnerDiagram(store.innerDiagram.data);
        if (!diagramDataEquals(undoSnapshot.data, getExportData())) {
          pushUndoSnapshot(undoSnapshot);
        }
        renderAll();
        saveLocalState();
        updateInnerDiagramSummary(block);
        closeInnerDiagramModal();
        showToast("내부 다이어그램을 저장했습니다.");
      }

      function addInnerBlock() {
        if (!isInnerDiagramModalOpen()) {
          return;
        }
        var parentBlock = getBlock(store.innerDiagram.blockId);
        var stage = els.innerDiagramStage;
        var x = stage.scrollLeft + stage.clientWidth / 2 - INNER_BLOCK_WIDTH / 2;
        var y = stage.scrollTop + stage.clientHeight / 2 - INNER_BLOCK_HEIGHT / 2;
        var block = {
          id: createInnerBlockId(store.innerDiagram.data),
          title: "내부 블록",
          color: parentBlock ? getBlockColor(parentBlock) : FALLBACK_COLOR,
          x: Math.round(clamp(x, 16, INNER_WORLD_WIDTH - INNER_BLOCK_WIDTH - 16)),
          y: Math.round(clamp(y, 16, INNER_WORLD_HEIGHT - INNER_BLOCK_HEIGHT - 16))
        };
        store.innerDiagram.data.blocks.push(block);
        store.innerDiagram.selectedIds = [block.id];
        renderInnerDiagram();
      }

      function connectInnerSelection() {
        var selectedIds = store.innerDiagram.selectedIds.slice();
        if (selectedIds.length < 2) {
          showToast("내부 블록을 2개 이상 선택해주세요.");
          return;
        }
        for (var index = 0; index < selectedIds.length - 1; index += 1) {
          addInnerConnection(selectedIds[index], selectedIds[index + 1]);
        }
        renderInnerDiagram();
      }

      function deleteInnerSelection() {
        var selectedIds = store.innerDiagram.selectedIds.slice();
        if (!selectedIds.length) {
          return;
        }
        var removeIds = new Set(selectedIds);
        store.innerDiagram.data.blocks = store.innerDiagram.data.blocks.filter(function (block) {
          return !removeIds.has(block.id);
        });
        store.innerDiagram.data.connections = store.innerDiagram.data.connections.filter(function (connection) {
          return !removeIds.has(connection.from) && !removeIds.has(connection.to);
        });
        if (removeIds.has(store.innerDiagram.editBlockId)) {
          closeInnerBlockEditModal();
        }
        store.innerDiagram.selectedIds = [];
        renderInnerDiagram();
      }

      function renderInnerDiagram() {
        if (!els.innerBlocksLayer || !els.innerConnectionGroup) {
          return;
        }
        renderInnerConnections();
        els.innerBlocksLayer.replaceChildren();
        store.innerDiagram.data.blocks.forEach(function (block) {
          var node = document.createElement("div");
          var title = document.createElement("div");
          node.className = "inner-block" + (store.innerDiagram.selectedIds.indexOf(block.id) !== -1 ? " is-selected" : "");
          node.dataset.innerId = block.id;
          node.style.left = (Number(block.x) || 0) + "px";
          node.style.top = (Number(block.y) || 0) + "px";
          node.style.setProperty("--inner-color", validColor(block.color) ? block.color : FALLBACK_COLOR);
          node.title = block.title || "내부 블록";
          title.className = "inner-block-title";
          title.textContent = block.title || "내부 블록";
          node.append(title);
          node.addEventListener("pointerdown", function (event) {
            startInnerBlockDrag(event, block.id);
          });
          node.addEventListener("dblclick", function (event) {
            event.preventDefault();
            event.stopPropagation();
            openInnerBlockEditModal(block.id);
          });
          els.innerBlocksLayer.append(node);
        });
      }

      function renderInnerConnections() {
        els.innerConnectionGroup.replaceChildren();
        store.innerDiagram.data.connections.forEach(function (connection) {
          var fromBlock = getInnerBlock(connection.from);
          var toBlock = getInnerBlock(connection.to);
          if (!fromBlock || !toBlock) {
            return;
          }
          var path = createSvgElement("path");
          path.setAttribute("class", "inner-connection-visible");
          path.setAttribute("d", getInnerConnectionPath(fromBlock, toBlock));
          els.innerConnectionGroup.append(path);
        });
      }

      function startInnerBlockDrag(event, blockId) {
        if (event.button !== 0 || event.detail >= 2) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        selectInnerBlock(blockId, event.shiftKey || event.ctrlKey || event.metaKey);
        var selectedBlocks = store.innerDiagram.selectedIds.map(getInnerBlock).filter(Boolean);
        store.innerDiagram.drag = {
          pointerId: event.pointerId,
          blockId: blockId,
          moved: false,
          startClientX: event.clientX,
          startClientY: event.clientY,
          blocks: selectedBlocks.map(function (block) {
            return {
              id: block.id,
              x: Number(block.x) || 0,
              y: Number(block.y) || 0
            };
          })
        };
        safelyCapturePointer(event.currentTarget, event.pointerId);
      }

      function moveInnerDraggedBlock(event) {
        var drag = store.innerDiagram.drag;
        if (!drag) {
          return;
        }
        var deltaX = event.clientX - drag.startClientX;
        var deltaY = event.clientY - drag.startClientY;
        if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
          drag.moved = true;
        }
        drag.blocks.forEach(function (item) {
          var block = getInnerBlock(item.id);
          if (!block) {
            return;
          }
          block.x = Math.round(clamp(item.x + deltaX, 0, INNER_WORLD_WIDTH - INNER_BLOCK_WIDTH));
          block.y = Math.round(clamp(item.y + deltaY, 0, INNER_WORLD_HEIGHT - INNER_BLOCK_HEIGHT));
          setInnerBlockPosition(block);
        });
        renderInnerConnections();
      }

      function finishInnerBlockDrag(event) {
        var target = getInnerBlockElement(store.innerDiagram.drag && store.innerDiagram.drag.blockId);
        if (target) {
          safelyReleasePointer(target, event.pointerId);
        }
        store.innerDiagram.drag = null;
      }

      function handleInnerStagePointerDown(event) {
        if (event.target !== els.innerDiagramStage && event.target !== els.innerDiagramWorld) {
          return;
        }
        store.innerDiagram.selectedIds = [];
        renderInnerDiagram();
      }

      function selectInnerBlock(blockId, additive) {
        var ids = store.innerDiagram.selectedIds.slice();
        if (additive) {
          if (ids.indexOf(blockId) === -1) {
            ids.push(blockId);
          } else {
            ids = ids.filter(function (id) {
              return id !== blockId;
            });
          }
        } else {
          ids = [blockId];
        }
        store.innerDiagram.selectedIds = ids;
        renderInnerDiagram();
      }

      function editInnerSelection() {
        var selectedId = store.innerDiagram.selectedIds[0];
        if (!selectedId) {
          showToast("편집할 내부 블록을 선택해주세요.");
          return;
        }
        openInnerBlockEditModal(selectedId);
      }

      function openInnerBlockEditModal(blockId) {
        var block = getInnerBlock(blockId);
        if (!block) {
          return;
        }
        store.innerDiagram.editBlockId = blockId;
        if (store.innerDiagram.selectedIds.indexOf(blockId) === -1) {
          store.innerDiagram.selectedIds = [blockId];
          renderInnerDiagram();
        }
        els.innerBlockTitleInput.value = block.title || "";
        renderInnerColorChips(block.color);
        setInnerBlockEditColorValue(block.color);
        els.innerBlockEditModal.classList.add("is-open");
        window.setTimeout(function () {
          els.innerBlockTitleInput.focus();
          els.innerBlockTitleInput.select();
        }, 0);
      }

      function closeInnerBlockEditModal() {
        store.innerDiagram.editBlockId = null;
        if (els.innerBlockEditModal) {
          els.innerBlockEditModal.classList.remove("is-open");
        }
      }

      function saveInnerBlockEditModal() {
        var block = getInnerBlock(store.innerDiagram.editBlockId);
        if (!block) {
          closeInnerBlockEditModal();
          return;
        }
        block.title = normalizeInlineTitle(els.innerBlockTitleInput.value) || "내부 블록";
        block.color = validColor(els.innerBlockColorInput.value) ? els.innerBlockColorInput.value.toUpperCase() : FALLBACK_COLOR;
        renderInnerDiagram();
        closeInnerBlockEditModal();
      }

      function deleteInnerEditedBlock() {
        var blockId = store.innerDiagram.editBlockId;
        if (!blockId || !getInnerBlock(blockId)) {
          closeInnerBlockEditModal();
          return;
        }
        store.innerDiagram.selectedIds = [blockId];
        deleteInnerSelection();
      }

      function handleInnerColorChipClick(event) {
        var chip = event.target.closest(".color-chip");
        if (!chip) {
          return;
        }
        setInnerBlockEditColorValue(chip.dataset.color);
      }

      function renderInnerColorChips(currentColor) {
        els.innerBlockColorChips.replaceChildren();
        getInnerColorChipOptions(currentColor).forEach(function (color) {
          var chip = document.createElement("button");
          chip.className = "color-chip";
          chip.type = "button";
          chip.dataset.color = color;
          chip.style.setProperty("--chip-color", color);
          chip.title = color.toUpperCase();
          chip.setAttribute("role", "option");
          chip.setAttribute("aria-label", color.toUpperCase() + " 선택");
          chip.setAttribute("aria-selected", "false");
          els.innerBlockColorChips.append(chip);
        });
        updateInnerColorChipSelection(currentColor);
      }

      function getInnerColorChipOptions(currentColor) {
        var colors = getColorChipOptions(currentColor).slice();
        store.innerDiagram.data.blocks.forEach(function (block) {
          var color = validColor(block.color) ? block.color.toUpperCase() : "";
          if (color && colors.indexOf(color) === -1) {
            colors.push(color);
          }
        });
        return colors;
      }

      function setInnerBlockEditColorValue(color) {
        var safeColor = validColor(color) ? color.toUpperCase() : FALLBACK_COLOR;
        els.innerBlockColorInput.value = safeColor;
        els.innerBlockColorValue.textContent = safeColor;
        updateInnerColorChipSelection(safeColor);
      }

      function updateInnerColorChipSelection(color) {
        var safeColor = validColor(color) ? color.toUpperCase() : FALLBACK_COLOR;
        els.innerBlockColorChips.querySelectorAll(".color-chip").forEach(function (chip) {
          var isSelected = chip.dataset.color.toUpperCase() === safeColor;
          chip.classList.toggle("is-selected", isSelected);
          chip.setAttribute("aria-selected", isSelected ? "true" : "false");
        });
      }

      function removeEditImage(imageId) {
        store.editImages = cloneBlockImages(store.editImages).filter(function (image) {
          return image.id !== imageId;
        });
        renderEditImages();
      }

      function hasImageFiles(dataTransfer) {
        if (!dataTransfer) {
          return false;
        }
        if (dataTransfer.items && dataTransfer.items.length) {
          return Array.from(dataTransfer.items).some(function (item) {
            return item.kind === "file" && /^image\//i.test(item.type || "");
          });
        }
        return getImageFilesFromFileList(dataTransfer.files).length > 0;
      }

      function getImageFilesFromClipboard(clipboardData) {
        if (!clipboardData || !clipboardData.items) {
          return [];
        }
        return Array.from(clipboardData.items).map(function (item) {
          return item.kind === "file" && /^image\//i.test(item.type || "") ? item.getAsFile() : null;
        }).filter(Boolean);
      }

      function getImageFilesFromFileList(fileList) {
        return Array.from(fileList || []).filter(function (file) {
          return file && /^image\//i.test(file.type || "");
        });
      }

      function closeWhenBackdropIsClicked(event) {
        if (event.target === els.jsonModal) {
          closeJsonModal();
        }
        if (event.target === els.editModal) {
          closeEditModal();
        }
        if (event.target === els.linkModal) {
          closeLinkModal();
        }
        if (event.target === els.imagePreviewModal) {
          closeImagePreviewModal();
        }
        if (event.target === els.innerDiagramModal) {
          closeInnerDiagramModal();
        }
        if (event.target === els.innerBlockEditModal) {
          closeInnerBlockEditModal();
        }
        if (event.target === els.connectionEditModal) {
          closeConnectionEditModal();
        }
      }

      function handleKeyDown(event) {
        if (event.code === "Space" && !isTypingTarget(event.target) && !isModalOpen()) {
          store.isSpaceDown = true;
          els.viewport.classList.add("is-panning");
          event.preventDefault();
          return;
        }
        if (isUndoShortcut(event) && canUndoAction(event.target)) {
          event.preventDefault();
          undoLastAction();
          return;
        }
        if (isCopyShortcut(event) && canCopySelectedBlocks(event.target)) {
          event.preventDefault();
          copySelectedBlocksToClipboard();
          return;
        }
        if (isPasteShortcut(event) && canPasteBlocks(event.target)) {
          event.preventDefault();
          pasteBlocksFromClipboard();
          return;
        }
        if (event.key === "Enter" && canEditSelectedConnectionLabel(event.target)) {
          event.preventDefault();
          editConnectionLabel(store.selectedConnectionKeys[0]);
          return;
        }
        if ((event.key === "Delete" || event.key === "Backspace") && canDeleteSelectedItems(event.target)) {
          event.preventDefault();
          removeSelectedItems();
          return;
        }
        if ((event.key === "Delete" || event.key === "Backspace") && canDeleteInnerSelection(event.target)) {
          event.preventDefault();
          deleteInnerSelection();
          return;
        }
        if (event.key !== "Escape") {
          return;
        }
        var modalWasOpen = false;
        if (els.innerBlockEditModal.classList.contains("is-open")) {
          closeInnerBlockEditModal();
          event.preventDefault();
          return;
        }
        if (els.jsonModal.classList.contains("is-open")) {
          closeJsonModal();
          modalWasOpen = true;
        }
        if (els.editModal.classList.contains("is-open")) {
          closeEditModal();
          modalWasOpen = true;
        }
        if (els.linkModal.classList.contains("is-open")) {
          closeLinkModal();
          modalWasOpen = true;
        }
        if (els.imagePreviewModal.classList.contains("is-open")) {
          closeImagePreviewModal();
          modalWasOpen = true;
        }
        if (els.innerDiagramModal.classList.contains("is-open")) {
          closeInnerDiagramModal();
          modalWasOpen = true;
        }
        if (els.connectionEditModal.classList.contains("is-open")) {
          closeConnectionEditModal();
          modalWasOpen = true;
        }
        if (!modalWasOpen) {
          clearSelectedBlock();
        }
      }

      function handleKeyUp(event) {
        if (event.code !== "Space") {
          return;
        }
        store.isSpaceDown = false;
        if (!store.pan) {
          els.viewport.classList.remove("is-panning");
        }
      }

      function renderAll() {
        renderHeader();
        updateConnectionStyleControls();
        renderBlocks();
        renderConnections();
      }

      function renderHeader() {
        var title = store.data.title || "제목 없음";
        document.title = title + " - 생각블록 캔버스";
        els.documentTitle.textContent = title;
      }

      function renderBlocks() {
        els.blocksLayer.replaceChildren();
        store.data.blocks.forEach(function (block) {
          els.blocksLayer.append(createBlockElement(block));
        });
        if (store.focusTitleBlockId) {
          focusBlockTitle(store.focusTitleBlockId);
          store.focusTitleBlockId = null;
        }
      }

      function createBlockElement(block) {
        var card = document.createElement("article");
        var top = document.createElement("div");
        var title = document.createElement("div");
        var summary = document.createElement("div");
        var summaryText = getBlockSubtitle(block);
        var quickActions = document.createElement("div");
        var editButton = document.createElement("button");
        var copyButton = document.createElement("button");
        var innerActionButton = document.createElement("button");
        var deleteButton = document.createElement("button");
        var handle = document.createElement("button");
        var linkButton = null;
        var innerButton = null;
        var createMenu = document.createElement("div");
        var createMainButton = document.createElement("button");
        var createMiddleButton = document.createElement("button");
        var createSubButton = document.createElement("button");
        var connectSelectedButton = document.createElement("button");
        var isActiveBlock = store.selectedBlockId === block.id;

        card.className = "block-card";

        applyBlockVisual(card, block);
        card.title = block.title || "제목 없음";
        setBlockPosition(card, block);

        top.className = "block-top";
        title.className = "block-title";
        title.dataset.titleEditor = "true";
        title.textContent = block.title || "제목 없음";
        if (isActiveBlock) {
          title.contentEditable = "plaintext-only";

          title.setAttribute("role", "textbox");

        }
        summary.className = "block-summary";
        summary.textContent = summaryText;

        handle.className = "connect-handle";
        handle.type = "button";

          linkButton.textContent = "🔗";
          linkButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();

        if (hasInnerDiagram(block)) {

          innerButton.className = "block-inner-button";
          innerButton.type = "button";

          });

        createMenu.className = "block-create-menu";
        createMainButton.className = "block-action-button primary";
        createMainButton.type = "button";
        createMainButton.textContent = "메인";
        createMainButton.title = "연결된 메인블록 만들기";
        createMainButton.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          createConnectedBlock(block.id, "main");
        });

        createMiddleButton.className = "block-action-button";
        createMiddleButton.type = "button";
        createMiddleButton.textContent = "중간";
        createMiddleButton.title = "연결된 중간블록 만들기";
        createMiddleButton.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          createConnectedBlock(block.id, "middle");
        });

        createSubButton.className = "block-action-button";
        createSubButton.type = "button";
        createSubButton.textContent = "서브";
        createSubButton.title = "연결된 서브블록 만들기";
        createSubButton.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          createConnectedBlock(block.id, "sub");
        });
        createMenu.append(createMainButton, createMiddleButton, createSubButton);

        quickActions.className = "block-quick-actions";
        editButton.className = "block-action-button";
        editButton.type = "button";
        editButton.textContent = "수정";
        editButton.title = "세부 수정";
        editButton.addEventListener("click", function (event) {
          event.stopPropagation();
          openEditModal(block.id);
        });

        copyButton.className = "block-action-button";
        copyButton.type = "button";
        copyButton.textContent = "복사";
        copyButton.title = "블록 복사";
        copyButton.addEventListener("click", function (event) {

          event.stopPropagation();
          duplicateBlock(block.id);

        innerActionButton.className = "block-action-button";
        innerActionButton.type = "button";

        innerActionButton.title = "내부 다이어그램";
        innerActionButton.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();

        });

        connectSelectedButton.type = "button";
        connectSelectedButton.textContent = "연결";

          event.stopPropagation();

        deleteButton.type = "button";

        deleteButton.title = selectedCount > 1 ? "선택된 블록 모두 삭제" : "삭제";
        deleteButton.addEventListener("click", function (event) {
          event.preventDefault();

          updateInlineBlockTitle(block.id, title);

          if (event.key === "Enter") {
            event.preventDefault();
            event.stopPropagation();
            title.blur();
          }

            event.preventDefault();
            event.stopPropagation();
            var currentBlock = getBlock(block.id);
            title.textContent = currentBlock && currentBlock.title ? currentBlock.title : "제목 없음";
            title.blur();
          }
        });
        title.addEventListener("blur", function () {
          commitInlineBlockTitle(block.id, title);
        });

          if (isControlTarget(event.target)) {
            return;
          }
          if (event.detail >= 2) {
            event.preventDefault();
            event.stopPropagation();
            openEditModal(block.id);
            return;
          }
          startBlockDrag(event, block.id);
        });
        top.addEventListener("click", function (event) {
          if (isControlTarget(event.target) || event.detail > 1) {
            return;
          }
          event.stopPropagation();
          focusBlockTitle(block.id);
        });
        card.addEventListener("dblclick", function (event) {
          if (isControlTarget(event.target)) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          openEditModal(block.id);
        });
        handle.addEventListener("pointerdown", function (event) {
          startHandlePress(event, block.id);
        });

        return card;
      }

      function getDetailFirstLine(detail) {
        return String(detail || "").split(/\r?\n/)[0];
      }

      function getBlockSubtitle(block) {
        var subtitle = String(block && block.subtitle || "").trim();
        return subtitle || getDetailFirstLine(block && block.detail);
      }

      function updateInlineBlockTitle(blockId, titleElement) {
        var block = getBlock(blockId);
        var card = getBlockElement(blockId);
        if (!block || !titleElement) {
          return;
        }
        block.title = normalizeInlineTitle(titleElement.textContent);
        if (card) {
          card.title = block.title || "제목 없음";
          card.style.setProperty("--card-width", getBlockWidth(block) + "px");
        }
        renderConnections();
        scheduleLocalSave();
      }

      function commitInlineBlockTitle(blockId, titleElement) {
        var block = getBlock(blockId);
        if (!block || !titleElement) {
          return;
        }
        block.title = normalizeInlineTitle(titleElement.textContent);
        if (!block.title) {
          titleElement.textContent = "제목 없음";
        }
        var card = getBlockElement(blockId);
        if (card) {
          card.title = block.title || "제목 없음";
          card.style.setProperty("--card-width", getBlockWidth(block) + "px");
        }
        renderConnections();
        saveLocalState();
        delete titleElement.dataset.undoCaptured;
      }

      function normalizeInlineTitle(value) {
        return String(value || "").replace(/\s+/g, " ").trim();
      }

      function focusBlockTitle(blockId) {
        var card = getBlockElement(blockId);
        var title = card && card.querySelector("[data-title-editor]");
        if (!title || title.contentEditable === "false") {
          return;
        }
        window.setTimeout(function () {
          title.focus();
          selectNodeText(title);
        }, 0);
      }

      function selectNodeText(node) {
        var selection = window.getSelection && window.getSelection();
        if (!selection || !document.createRange) {
          return;
        }
        var range = document.createRange();
        range.selectNodeContents(node);
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function applyBlockVisual(card, block) {
        var color = getBlockColor(block);
        var blockType = normalizeBlockType(block.type);
        var isMain = blockType === "main";
        var isMiddle = blockType === "middle";
        var ink = isMain ? getReadableTextColor(color) : "var(--ink)";
        var muted = isMain ? (ink === "#ffffff" ? "rgba(255,255,255,0.78)" : "rgba(40,39,33,0.68)") : "#777268";

        card.classList.toggle("is-main", isMain);
        card.classList.toggle("is-middle", isMiddle);
        card.style.setProperty("--block-color", color);
        card.style.setProperty("--block-ink", ink);
        card.style.setProperty("--block-muted", muted);
      }

      function getBlockColor(block) {
        return getDiagramBlockColor(store.data, block);
      }

      function getDiagramBlockColor(diagram, block) {
        var linkedMainColor = shouldInheritBlockColor(diagram, block) ? getLinkedMainBlockColor(diagram, block) : "";
        if (linkedMainColor) {
          return linkedMainColor;
        }
        return getOwnBlockColor(diagram, block);
      }

      function shouldInheritBlockColor(diagram, block) {
        return Boolean(block && normalizeBlockType(block.type) !== "main" && normalizeBlockColorInheritance(block));
      }

      function normalizeBlockColorInheritance(block) {
        if (!block || normalizeBlockType(block.type) === "main") {
          return false;
        }
        return block.inheritColor !== false;
      }

      function getOwnBlockColor(diagram, block) {
        if (block && validColor(block.color)) {
          return block.color;
        }
        return getCategoryColorFromMap(diagram && diagram.categories, block && block.category);
      }

      function getLinkedMainBlockColor(diagram, block) {
        var mainBlock = findLinkedMainBlock(diagram, block);
        return mainBlock ? getOwnBlockColor(diagram, mainBlock) : "";
      }

      function findLinkedMainBlock(diagram, block) {
        if (!diagram || !block || !block.id || normalizeBlockType(block.type) === "main") {
          return null;
        }
        var blockMap = new Map((diagram.blocks || []).map(function (item) {
          return [item.id, item];
        }));
        var directMain = findAdjacentMainBlock(diagram, block.id, blockMap);
        if (directMain) {
          return directMain;
        }
        return findNearestMainBlock(diagram, block.id, blockMap);
      }

      function findAdjacentMainBlock(diagram, blockId, blockMap) {
        var connections = diagram.connections || [];
        for (var index = 0; index < connections.length; index += 1) {
          var connection = connections[index];
          var nextId = "";
          if (connection.from === blockId) {
            nextId = connection.to;
          } else if (connection.to === blockId) {
            nextId = connection.from;
          }
          if (!nextId) {
            continue;
          }
          var nextBlock = blockMap.get(nextId);
          if (nextBlock && normalizeBlockType(nextBlock.type) === "main") {
            return nextBlock;
          }
        }
        return null;
      }

      function findNearestMainBlock(diagram, blockId, blockMap) {
        var visited = new Set([blockId]);
        var queue = [blockId];
        var connections = diagram.connections || [];

        while (queue.length) {
          var currentId = queue.shift();
          for (var index = 0; index < connections.length; index += 1) {
            var connection = connections[index];
            var nextId = "";
            if (connection.from === currentId) {
              nextId = connection.to;
            } else if (connection.to === currentId) {
              nextId = connection.from;
            }
            if (!nextId || visited.has(nextId)) {
              continue;
            }
            visited.add(nextId);
            var nextBlock = blockMap.get(nextId);
            if (!nextBlock) {
              continue;
            }
            if (normalizeBlockType(nextBlock.type) === "main") {
              return nextBlock;
            }
            queue.push(nextId);
          }
        }
        return null;
      }

      }

      function getReadableTextColor(color) {
        var rgb = hexToRgb(color);
        if (!rgb) {
          return "#ffffff";
        }
        var brightness = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
        return brightness >= 150 ? "#282721" : "#ffffff";
      }

      function hexToRgb(color) {
        if (!validColor(color)) {
          return null;
        }
        return {
          r: parseInt(color.slice(1, 3), 16),
          g: parseInt(color.slice(3, 5), 16),
          b: parseInt(color.slice(5, 7), 16)
        };

      function renderConnections() {

          if (!fromEndpoint || !toEndpoint) {
            return;

          var pathData = getConnectionPath(fromEndpoint, toEndpoint);
          var group = createSvgElement("g");
          var hit = createSvgElement("path");
          var visible = createSvgElement("path");
          var label = createConnectionLabelElement(connection, fromEndpoint, toEndpoint, key);

          hit.setAttribute("d", pathData);

          hit.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            selectConnection(key, event.shiftKey || event.ctrlKey || event.metaKey);
          });
          hit.addEventListener("dblclick", function (event) {

            event.stopPropagation();

          hit.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {

                editConnectionLabel(key);
              } else {
                selectConnection(key, event.shiftKey || event.ctrlKey || event.metaKey);
              }
            }
          });

          visible.setAttribute("d", pathData);
          visible.setAttribute("class", isConnectionSelected(key) ? "connection-visible is-selected" : "connection-visible");
          group.append(hit, visible);
          if (label) {
            group.append(label);
          }

      function createConnectionLabelElement(connection, fromBlock, toBlock, key) {

        var ioLabel = getConnectionIoLabel(ioType);
        var point = getConnectionLabelPoint(fromBlock, toBlock);
        var size = getConnectionLabelSize(connection);
        var isSelected = isConnectionSelected(key);
        var actionHeight = isSelected ? 34 : 0;
        var boxWidth = isSelected ? Math.max(size.width, 148) : size.width;
        var endpointId = createConnectionLabelEndpointId(connection);
        var foreignObject = createSvgElement("foreignObject");
        var shell = document.createElement("div");
        var label = document.createElement("div");
        var text = document.createElement("span");
        foreignObject.setAttribute("x", Math.round(point.x - boxWidth / 2));
        foreignObject.setAttribute("y", Math.round(point.y - size.height / 2));
        foreignObject.setAttribute("width", boxWidth);
        foreignObject.setAttribute("height", size.height + actionHeight);

        foreignObject.setAttribute("tabindex", "0");

        foreignObject.addEventListener("click", function (event) {

        });
        foreignObject.addEventListener("dblclick", function (event) {
          event.preventDefault();
          event.stopPropagation();
          editConnectionLabel(key);
        });
        foreignObject.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (event.key === "Enter" && isConnectionSelected(key)) {
              editConnectionLabel(key);
            } else {
              selectConnection(key, event.shiftKey || event.ctrlKey || event.metaKey);
            }
          }
        });
        label.className = "connection-label" + (ioType ? " is-" + ioType : "");
        if (ioLabel) {
          var badge = document.createElement("span");
          badge.className = "connection-io-badge";
          badge.textContent = ioLabel;

        }
        text.className = "connection-label-text";

      function createConnectionLabelActions(key, currentIoType) {
        var actions = document.createElement("div");

      function getConnectionLabelPoint(fromBlock, toBlock) {
        var start = edgePoint(fromBlock, toBlock);
        var end = edgePoint(toBlock, fromBlock);
        return {
          x: (start.x + end.x) / 2,
          y: (start.y + end.y) / 2
        };
      }

      function getConnectionLabel(connection) {
        return String(connection && connection.label || "").trim();
      }

      function getConnectionLabelSize(connection) {
        var labelText = getConnectionLabel(connection);
        var ioLabel = getConnectionIoLabel(getConnectionIoType(connection));
        return {
          width: Math.max(56, Math.ceil(estimateTextWidth(labelText, 12) + (ioLabel ? estimateTextWidth(ioLabel, 9) + 42 : 22))),
          height: 30
        };
      }

      function createConnectionLabelEndpointId(connection) {
        if (!connection || !getConnectionLabel(connection) || !getBlock(connection.from) || !getBlock(connection.to)) {
          return "";
        }
        return CONNECTION_LABEL_ENDPOINT_PREFIX + encodeConnectionEndpointPart(connection.from) + "|" + encodeConnectionEndpointPart(connection.to);
      }

      function encodeConnectionEndpointPart(value) {
        return encodeURIComponent(String(value || ""));
      }

      function parseConnectionLabelEndpointId(endpointId) {
        var raw = String(endpointId || "");
        if (raw.indexOf(CONNECTION_LABEL_ENDPOINT_PREFIX) !== 0) {
          return null;
        }
        var body = raw.slice(CONNECTION_LABEL_ENDPOINT_PREFIX.length);
        var splitAt = body.indexOf("|");
        if (splitAt === -1) {
          return null;
        }
        try {
          var from = decodeURIComponent(body.slice(0, splitAt));
          var to = decodeURIComponent(body.slice(splitAt + 1));
          if (!from || !to || from === to) {
            return null;
          }
          return {
            from: from,
            to: to,
            key: from + "\u0000" + to
          };
        } catch (error) {
          return null;
        }
      }

      function isConnectionLabelEndpointId(endpointId) {
        return Boolean(parseConnectionLabelEndpointId(endpointId));
      }

      function getConnectionLabelReferenceKey(endpointId) {
        var parsed = parseConnectionLabelEndpointId(endpointId);
        return parsed ? parsed.key : "";
      }

      function resolveConnectionEndpoint(endpointId, excludedConnectionKey) {
        var block = getBlock(endpointId);
        if (block) {
          return block;
        }
        var parsed = parseConnectionLabelEndpointId(endpointId);
        if (!parsed || parsed.key === excludedConnectionKey) {
          return null;
        }
        var connection = findConnectionByKey(parsed.key);
        if (!connection || !getConnectionLabel(connection)) {
          return null;
        }
        var fromBlock = getBlock(connection.from);
        var toBlock = getBlock(connection.to);
        if (!fromBlock || !toBlock) {
          return null;
        }
        var point = getConnectionLabelPoint(fromBlock, toBlock);
        var size = getConnectionLabelSize(connection);
        return {
          id: String(endpointId),
          endpointType: "connection-label",
          title: getConnectionLabel(connection),
          x: point.x - size.width / 2,
          y: point.y - size.height / 2,
          width: size.width,
          height: size.height
        };
      }

      function getConnectionIoType(connection) {
        return normalizeConnectionIoType(connection && connection.ioType);
      }

      function normalizeConnectionIoType(value) {
        var type = String(value || "").trim().toLowerCase();
        if (type === "input" || type === "in" || type === "입력") {

        if (type === "output" || type === "out" || type === "출력") {

      function distributeSelectedBlocksHorizontally() {
        var blocks = getArrangementSelection(3, "가로 간격 균등");
        if (!blocks.length) {
          return;
        }
        var sortedBlocks = blocks.slice().sort(function (a, b) {
          return (Number(a.x) || 0) - (Number(b.x) || 0);
        });
        var firstLeft = Number(sortedBlocks[0].x) || 0;
        var lastBlock = sortedBlocks[sortedBlocks.length - 1];
        var lastRight = (Number(lastBlock.x) || 0) + getBlockWidth(lastBlock);
        var totalWidth = sortedBlocks.reduce(function (sum, block) {
          return sum + getBlockWidth(block);
        }, 0);
        var gap = (lastRight - firstLeft - totalWidth) / (sortedBlocks.length - 1);
        var cursorX = firstLeft;
        var positions = sortedBlocks.map(function (block) {
          var position = {
            block: block,
            x: cursorX,
            y: Number(block.y) || 0
          };
          cursorX += getBlockWidth(block) + gap;
          return position;
        });
        applySelectedBlockPositions(positions, "가로 간격을 균등하게 맞췄습니다.");
      }

      function distributeSelectedBlocksVertically() {
        var blocks = getArrangementSelection(3, "세로 간격 균등");
        if (!blocks.length) {
          return;
        }
        var sortedBlocks = blocks.slice().sort(function (a, b) {
          return (Number(a.y) || 0) - (Number(b.y) || 0);
        });
        var firstTop = Number(sortedBlocks[0].y) || 0;
        var lastBlock = sortedBlocks[sortedBlocks.length - 1];
        var lastBottom = (Number(lastBlock.y) || 0) + getBlockHeight(lastBlock);
        var totalHeight = sortedBlocks.reduce(function (sum, block) {
          return sum + getBlockHeight(block);
        }, 0);
        var gap = (lastBottom - firstTop - totalHeight) / (sortedBlocks.length - 1);
        var cursorY = firstTop;
        var positions = sortedBlocks.map(function (block) {
          var position = {
            block: block,
            x: Number(block.x) || 0,
            y: cursorY
          };
          cursorY += getBlockHeight(block) + gap;
          return position;
        });
        applySelectedBlockPositions(positions, "세로 간격을 균등하게 맞췄습니다.");
      }

      function getArrangementSelection(minimumCount, actionName) {
        var blocks = getSelectedBlockIds().map(getBlock).filter(Boolean);
        if (blocks.length < minimumCount) {
          showToast(actionName + "은 블록 " + minimumCount + "개 이상 선택하세요.");
          return [];
        }
        return blocks;
      }

      function applySelectedBlockPositions(positions, successMessage) {
        var changedPositions = positions.filter(function (position) {
          return Math.round(Number(position.block.x) || 0) !== Math.round(position.x) ||
            Math.round(Number(position.block.y) || 0) !== Math.round(position.y);
        });
        if (!changedPositions.length) {
          showToast("이미 맞춰진 상태입니다.");
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        positions.forEach(function (position) {
          position.block.x = Math.round(position.x);
          position.block.y = Math.round(position.y);
        });
        renderAll();
        saveLocalState();
        showToast(successMessage);
      }

      function buildAutoLayout(blocks) {
        var blockMap = new Map();
        var incoming = new Map();
        var outgoing = new Map();
        var connectedIds = new Set();

        blocks.forEach(function (block) {
          blockMap.set(block.id, block);
          incoming.set(block.id, []);
          outgoing.set(block.id, []);
        });

        store.data.connections.forEach(function (connection) {
          if (!blockMap.has(connection.from) || !blockMap.has(connection.to)) {
            return;
          }
          outgoing.get(connection.from).push(connection.to);
          incoming.get(connection.to).push(connection.from);
          connectedIds.add(connection.from);
          connectedIds.add(connection.to);
        });

        var connectedBlocks = blocks.filter(function (block) {
          return connectedIds.has(block.id);
        });
        var isolatedBlocks = blocks.filter(function (block) {
          return !connectedIds.has(block.id);
        });

        var levelMap = assignLayoutLevels(connectedBlocks, incoming, outgoing);
        return {
          connectedGroups: groupBlocksByLevel(connectedBlocks, levelMap),
          isolatedBlocks: sortLayoutBlocks(isolatedBlocks)
        };
      }

      function assignLayoutLevels(blocks, incoming, outgoing) {
        var levelMap = new Map();
        var blockIds = new Set(blocks.map(function (block) {
          return block.id;
        }));
        var roots = blocks.filter(function (block) {
          return (incoming.get(block.id) || []).filter(function (id) {
            return blockIds.has(id);
          }).length === 0;
        });

        if (!roots.length) {
          roots = blocks.slice();
        }
        roots = sortLayoutBlocks(roots);

        function visitFrom(seed) {
          var queue = [{ id: seed.id, level: levelMap.has(seed.id) ? levelMap.get(seed.id) : 0 }];
          if (!levelMap.has(seed.id)) {
            levelMap.set(seed.id, 0);
          }
          while (queue.length) {
            var current = queue.shift();
            (outgoing.get(current.id) || []).forEach(function (nextId) {
              if (!blockIds.has(nextId)) {
                return;
              }
              var nextLevel = current.level + 1;
              if (!levelMap.has(nextId)) {
                levelMap.set(nextId, nextLevel);
                queue.push({ id: nextId, level: nextLevel });
              }
            });
          }
        }

        roots.forEach(visitFrom);
        sortLayoutBlocks(blocks).forEach(function (block) {
          if (!levelMap.has(block.id)) {
            visitFrom(block);
          }
        });
        return levelMap;
      }

      function groupBlocksByLevel(blocks, levelMap) {
        var groups = [];
        blocks.forEach(function (block) {
          var level = levelMap.get(block.id) || 0;
          if (!groups[level]) {
            groups[level] = [];
          }
          groups[level].push(block);
        });
        return groups.map(function (group) {
          return sortLayoutBlocks(group || []);
        });
      }

      function applyAutoLayout(layout) {
        var startX = 120;
        var startY = 100;
        var columnGap = 260;
        var rowGap = 76;
        var isolatedGapY = 150;
        var currentX = startX;
        var maxBottom = startY;
        var hasConnectedLayout = false;

        layout.connectedGroups.forEach(function (group) {
          if (!group || !group.length) {
            return;
          }
          hasConnectedLayout = true;
          var columnWidth = Math.max.apply(null, group.map(getBlockWidth));
          var currentY = startY;
          group.forEach(function (block) {
            block.x = Math.round(currentX + (columnWidth - getBlockWidth(block)) / 2);
            block.y = Math.round(currentY);
            currentY += getBlockHeight(block) + rowGap;
          });
          maxBottom = Math.max(maxBottom, currentY - rowGap);
          currentX += columnWidth + columnGap;
        });

        if (layout.isolatedBlocks.length) {
          placeIsolatedBlocks(layout.isolatedBlocks, startX, hasConnectedLayout ? maxBottom + isolatedGapY : startY);
        }
      }

      function placeIsolatedBlocks(blocks, startX, startY) {
        var maxRowWidth = 1280;
        var columnGap = 56;
        var rowGap = 64;
        var x = startX;
        var y = startY;
        var rowHeight = 0;

        blocks.forEach(function (block) {
          var width = getBlockWidth(block);
          var height = getBlockHeight(block);
          if (x > startX && x + width > startX + maxRowWidth) {
            x = startX;
            y += rowHeight + rowGap;
            rowHeight = 0;
          }
          block.x = Math.round(x);
          block.y = Math.round(y);
          x += width + columnGap;
          rowHeight = Math.max(rowHeight, height);
        });
      }

      function sortLayoutBlocks(blocks) {
        return blocks.slice().sort(function (a, b) {
          var typeDiff = getLayoutTypeRank(a) - getLayoutTypeRank(b);
          if (typeDiff !== 0) {
            return typeDiff;
          }
          var yDiff = (Number(a.y) || 0) - (Number(b.y) || 0);
          if (yDiff !== 0) {
            return yDiff;
          }
          var xDiff = (Number(a.x) || 0) - (Number(b.x) || 0);
          if (xDiff !== 0) {
            return xDiff;
          }
          return String(a.title || "").localeCompare(String(b.title || ""), "ko");
        });
      }

      function getLayoutTypeRank(block) {
        var type = normalizeBlockType(block && block.type);
        if (type === "main") {
          return 0;
        }
        return type === "middle" ? 1 : 2;
      }

      function pasteBlocksFromClipboard() {

        var offset = 48 * Math.max(1, store.clipboard.pasteCount || 1);

          };

          }

        };
        block.x = Math.round((Number(source.x) || 0) + getBlockWidth(source) + 96);
        block.y = Math.round((Number(source.y) || 0) + getBlockHeight(source) / 2 - getBlockHeight(block) / 2);

      function connectSelectedBlocks() {
        var blocks = getSelectedBlockIds().map(getBlock).filter(Boolean);
        if (blocks.length < 2) {
          showToast("연결할 블록을 2개 이상 선택해주세요.");
          return;
        }
        var ordered = sortBlocksForBatchConnection(blocks);
        var added = [];
        ordered.forEach(function (block, index) {
          var next = ordered[index + 1];
          if (!next || connectionExists(block.id, next.id)) {
            return;
          }
          added.push({ from: block.id, to: next.id, label: "", ioType: "" });
        });
        if (!added.length) {
          showToast("선택된 블록은 이미 연결되어 있습니다.");
          return;
        }
        pushUndoSnapshot(createUndoSnapshot());
        added.forEach(function (connection) {
          store.data.connections.push(connection);
        });
        setConnectionSelection(added.map(getConnectionKey));
        renderAll();
        saveLocalState();
        showToast(added.length + "개 연결선을 만들었습니다.");
      }

      function sortBlocksForBatchConnection(blocks) {
        return blocks.slice().sort(function (a, b) {
          var aCenter = getBlockCenter(a);
          var bCenter = getBlockCenter(b);
          var xDiff = aCenter.x - bCenter.x;
          if (Math.abs(xDiff) > 24) {
            return xDiff;
          }
          var yDiff = aCenter.y - bCenter.y;
          if (Math.abs(yDiff) > 0) {
            return yDiff;
          }
          return String(a.title || "").localeCompare(String(b.title || ""), "ko");
        });
      }

          return;

        if (!isBlockSelected(blockId) && !(event.shiftKey || event.ctrlKey || event.metaKey)) {
          setSelection([blockId]);

        var worldPoint = screenToWorld(event.clientX, event.clientY);
        var card = getBlockElement(blockId);
        var selectedIds = isBlockSelected(blockId) ? store.selectedBlockIds.slice() : [blockId];
        store.drag = {
          blockId: blockId,
          pointerId: event.pointerId,
          offsetX: worldPoint.x - block.x,
          offsetY: worldPoint.y - block.y,
          startWorldX: worldPoint.x,
          startWorldY: worldPoint.y,
          startClientX: event.clientX,
          startClientY: event.clientY,
          moved: false,
          undoSnapshot: createUndoSnapshot(),
          blocks: selectedIds.map(function (id) {
