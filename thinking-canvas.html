          '    svg{position:absolute;left:0;top:0;width:' + width + 'px;height:' + height + 'px;overflow:visible;}\n' +
          '    path{fill:none;stroke:#5b6472;stroke-width:2.2;stroke-linecap:round;opacity:.85;}\n' +
          '    .conn-label{box-sizing:border-box;max-width:none;display:inline-flex;align-items:center;gap:6px;overflow:hidden;padding:4px 8px;border:1px solid rgba(255,255,255,0.16);border-radius:999px;background:rgba(28,33,41,0.92);color:#e8ebf0;font-size:12px;font-weight:700;line-height:1.25;text-align:center;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,0.28);}.conn-label.is-input{border-color:rgba(255,83,96,.72);background:rgba(92,26,35,.94);color:#ffe5e8;}.conn-label.is-output{border-color:rgba(58,134,255,.72);background:rgba(20,45,92,.94);color:#e6f0ff;}.conn-type{flex:0 0 auto;padding:2px 5px;border-radius:999px;color:#fff;font-size:9px;font-weight:900;line-height:1;letter-spacing:.02em;}.conn-label.is-input .conn-type{background:#ff5360;}.conn-label.is-output .conn-type{background:#3a86ff;}.conn-text{min-width:0;overflow:visible;text-overflow:clip;white-space:nowrap;}\n' +
          '    .card{position:absolute;box-sizing:border-box;min-width:' + CARD_MIN_WIDTH + 'px;height:' + CARD_HEIGHT + 'px;padding:8px 12px 7px 10px;border:1px solid rgba(255,255,255,0.16);border-left:8px solid var(--color);border-radius:8px;background:#252b35;box-shadow:0 8px 24px rgba(0,0,0,0.45);overflow:hidden;}\n' +
          '    .card.is-group{border:2px solid color-mix(in srgb,var(--color) 72%,rgba(255,255,255,.28));border-left-width:2px;background:linear-gradient(180deg,color-mix(in srgb,var(--color) 34%,transparent),rgba(37,43,53,.58)),rgba(37,43,53,.68);box-shadow:0 14px 34px rgba(0,0,0,.36);}.card.is-group strong{display:flex;align-items:center;justify-content:center;min-height:50px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:var(--color);font-size:22px;text-align:center;}.card.is-group span{display:none;}\n' +
          '    .card.has-tool{padding-bottom:28px;}\n' +
          '    .card strong,.card span{display:block;white-space:nowrap;}\n' +
          '    .card span{overflow:hidden;text-overflow:ellipsis;}\n' +
          '    .card strong{font-size:13px;line-height:1.3;} .card span{margin-top:4px;color:rgba(255,255,255,0.58);font-size:12px;line-height:1.25;}\n' +
          '    .card a{position:absolute;right:8px;top:8px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.16);border-radius:7px;background:rgba(15,17,21,0.72);text-decoration:none;font-size:13px;line-height:1;}\n' +
          '    .tool-badge{position:absolute;left:10px;bottom:7px;max-width:calc(100% - 20px);overflow:hidden;padding:3px 8px;border:1px solid rgba(255,255,255,0.14);border-radius:999px;color:rgba(255,255,255,0.82);background:rgba(15,17,21,0.66);font-size:11px;font-weight:800;line-height:1.15;text-overflow:ellipsis;white-space:nowrap;font-style:normal;}\n' +
          '    .memos{margin-top:22px;display:grid;gap:10px;max-width:900px;} .memo-item{border:1px solid rgba(255,255,255,0.10);border-radius:8px;background:#1c2129;padding:12px 14px;}\n' +
          '    .memo-item h2{margin:0 0 6px;color:#e8ebf0;font-size:15px;} .memo-item p{margin:0 0 8px;color:rgba(255,255,255,0.5);font-size:13px;} .memo-item pre{margin:0;white-space:pre-wrap;color:#c8cdd6;font-family:inherit;font-size:13px;line-height:1.5;}\n' +
          '    .memo-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px;} .memo-images figure{margin:0;border:1px solid rgba(255,255,255,0.10);border-radius:8px;overflow:hidden;background:#0f1115;} .memo-images img{display:block;width:100%;height:140px;object-fit:cover;} .memo-images figcaption{padding:7px 8px;color:rgba(255,255,255,0.58);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n' +
          '  </style>\n' +
          '</head>\n' +
          '<body>\n' +
          '  <header><h1>' + escapeHtml(data.title || "생각블록 캔버스") + '</h1><p class="saved-at">저장: ' + escapeHtml(new Date().toLocaleString()) + '</p></header>\n' +
          '  <main class="wrap">\n' +
          '    <section class="diagram" aria-label="저장된 생각블록 다이어그램">\n' +
          '      <svg viewBox="0 0 ' + width + ' ' + height + '" aria-hidden="true">\n        ' + paths + (connectionLabels ? '\n        ' + connectionLabels : "") + '\n      </svg>\n' +
          '      <div>\n        ' + cards + '\n      </div>\n' +
          '    </section>\n' +
          (memoItems ? '    <section class="memos" aria-label="세부내용">\n        ' + memoItems + '\n    </section>\n' : "") +
          '  </main>\n' +
          '  <script type="application/json" id="thinking-canvas-json">\n' + escapeJsonForHtml(json) + '\n  </scr' + 'ipt>\n' +
          '</body>\n' +
          '</html>\n';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeJsonForHtml(value) {
        return String(value)
          .replace(/&/g, "\\u0026")
          .replace(/</g, "\\u003c")
          .replace(/>/g, "\\u003e");
      }

      function openEditModal(blockId) {
        var block = getBlock(blockId);
        if (!block) {
          return;
        }
        store.editBlockId = blockId;
        setSelection([blockId]);
        els.editTitle.value = block.title;
        els.editSubtitle.value = block.subtitle || "";
        els.subtitleTagRegisterInput.value = "";
        renderSubtitleTags();
        setEditBlockTypeValue(block.type);
        renderColorChips(getBlockColor(block));
        setEditColorValue(getBlockColor(block));
        setEditColorInheritedValue(shouldInheritBlockColor(store.data, block));
        els.editDetail.value = block.detail;
        store.editImages = getBlockImages(block);
        store.editHtmlFiles = getBlockHtmlFiles(block);
        renderEditImages();
        els.editLink.value = block.link || "";
        els.toolTagRegisterInput.value = "";
        els.editTool.value = formatToolTags(block.tool);
        renderToolChips(els.editTool.value);
        els.editStartDate.value = block.startDate || "";
        els.editDueDate.value = block.dueDate || "";
        els.editStatus.value = normalizeScheduleStatus(block.status) || "";
        els.editDone.checked = Boolean(block.done);
        els.editHighlight.checked = Boolean(block.highlight);
        updateInnerDiagramSummary(block);
        els.editModal.classList.add("is-open");
        setTimeout(function () {
          els.editTitle.focus();
          els.editTitle.select();
        }, 0);
      }

      function closeEditModal() {
        store.editBlockId = null;
        store.editImages = [];
        store.editHtmlFiles = [];
        closeDatePicker();
        if (els.editImageDropZone) {
          els.editImageDropZone.classList.remove("is-drop-target");
        }
        if (els.editImageFile) {
          els.editImageFile.value = "";
        }
        els.editModal.classList.remove("is-open");
        renderAll();
      }

      function saveEditedBlock() {
        var block = getBlock(store.editBlockId);
        if (!block) {
          closeEditModal();
          return;
        }
        var undoSnapshot = createUndoSnapshot();
        var nextTitle = els.editTitle.value;
        var nextSubtitle = els.editSubtitle.value;
        var nextType = normalizeBlockType(els.editBlockType.value);
        var nextLink = String(els.editLink.value || "").trim();
        var nextTool = formatToolTags(els.editTool.value);
        var shouldResetSize = nextTitle !== block.title ||
          nextSubtitle !== String(block.subtitle || "") ||
          nextType !== normalizeBlockType(block.type) ||
          nextLink !== String(block.link || "") ||
          nextTool !== formatToolTags(block.tool);
        block.title = nextTitle;
        block.subtitle = nextSubtitle;
        if (shouldResetSize) {
          clearBlockManualSize(block);
        }
        block.type = nextType;
        block.color = validColor(els.editBlockColor.value) ? els.editBlockColor.value : getCategoryColor(block.category);
        block.inheritColor = normalizeBlockType(block.type) !== "main" && normalizeBlockType(block.type) !== "group" && els.editColorInherited.value === "true";
        block.detail = els.editDetail.value;
        block.images = cloneBlockImages(store.editImages);
        block.htmlFiles = cloneBlockHtmlFiles(store.editHtmlFiles);
        block.link = nextLink;
        block.tool = nextTool;
        block.startDate = normalizeDateString(els.editStartDate.value);
        block.dueDate = normalizeDateString(els.editDueDate.value);
        block.status = normalizeScheduleStatus(els.editStatus.value);
        block.done = Boolean(els.editDone.checked);
        block.highlight = Boolean(els.editHighlight.checked);
        normalizeDiagramParentIds(store.data);
        if (!diagramDataEquals(undoSnapshot.data, getExportData())) {
          pushUndoSnapshot(undoSnapshot);
        }
        renderAll();
        saveLocalState();
        closeEditModal();
        showToast("블록을 수정했습니다.");
      }

      function renderToolChips(selectedTool) {
        if (!els.editToolChips) {
          return;
        }
        els.editToolChips.replaceChildren();
        getToolTagOptions().forEach(function (tool) {
          var pill = document.createElement("span");
          var button = document.createElement("button");
          var deleteButton = document.createElement("button");
          var isActive = toolSelectionHasTool(selectedTool, tool);
          pill.className = "tool-chip-pill" + (isActive ? " is-active" : "");
          pill.dataset.tool = tool;
          button.className = "tool-chip-button";
          button.type = "button";
          button.dataset.tool = tool;
          button.textContent = tool;
          button.title = tool + " 선택";
          deleteButton.className = "tool-chip-delete-button";
          deleteButton.type = "button";
          deleteButton.dataset.tool = tool;
          deleteButton.textContent = "×";
          deleteButton.title = tool + " 삭제";
          deleteButton.setAttribute("aria-label", tool + " TOOL 태그 삭제");
          pill.append(button, deleteButton);
          els.editToolChips.append(pill);
        });
        updateToolChipSelection(selectedTool);
      }

      function handleToolChipClick(event) {
        var deleteButton = event.target.closest(".tool-chip-delete-button");
        if (deleteButton) {
          event.preventDefault();
          event.stopPropagation();
          deleteToolTag(deleteButton.dataset.tool || "");
          return;
        }
        var button = event.target.closest(".tool-chip-button");
        if (!button) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        var tool = normalizeTool(button.dataset.tool || button.textContent || "");
        toggleToolInInput(tool);
        updateToolChipSelection();
        previewEditedBlockVisual();
        els.editTool.focus();
      }

      function handleToolTagRegisterKeyDown(event) {
        if (event.key !== "Enter") {
          return;
        }
        event.preventDefault();
        registerToolTagsFromInput();
      }

      function registerToolTagsFromInput() {
        var tools = parseToolTags(els.toolTagRegisterInput.value);
        if (!tools.length) {
          showToast("등록할 TOOL 태그를 입력해주세요.");
          els.toolTagRegisterInput.focus();
          return;
        }
        tools.forEach(rememberToolTag);
        els.toolTagRegisterInput.value = "";
        renderToolChips(els.editTool.value);
        showToast(tools.length + "개 TOOL 태그를 등록했습니다.");
        els.toolTagRegisterInput.focus();
      }

      function handleToolInput() {
        updateToolChipSelection();
        previewEditedBlockVisual();
      }

      function updateToolChipSelection(value) {
        if (!els.editToolChips) {
          return;
        }
        var selectedKeys = new Set(parseToolTags(value !== undefined ? value : els.editTool.value).map(normalizeToolKey));
        els.editToolChips.querySelectorAll(".tool-chip-pill").forEach(function (pill) {
          var isActive = selectedKeys.has(normalizeToolKey(pill.dataset.tool || ""));
          var button = pill.querySelector(".tool-chip-button");
          pill.classList.toggle("is-active", isActive);
          if (button) {
            button.setAttribute("aria-pressed", isActive ? "true" : "false");
          }
        });
      }

      function getToolTagOptions() {
        var result = [];
        var seen = new Set();
        function add(tool) {
          var safeTool = normalizeTool(tool);
          var key = normalizeToolKey(safeTool);
          if (!safeTool || seen.has(key) || store.toolHiddenTagKeys.indexOf(key) !== -1) {
            return;
          }
          seen.add(key);
          result.push(safeTool);
        }
        TOOL_PRESETS.forEach(add);
        store.toolTags.forEach(add);
        return result.slice(0, SUBTITLE_TAG_LIMIT);
      }

      function rememberToolTag(value) {
        var safeTool = normalizeTool(value);
        var key = normalizeToolKey(safeTool);
        var merged = [];
        var seen = new Set();
        if (!safeTool) {
          return;
        }
        [safeTool].concat(store.toolTags).forEach(function (tool) {
          var normalized = normalizeTool(tool);
          var normalizedKey = normalizeToolKey(normalized);
          if (!normalized || seen.has(normalizedKey)) {
            return;
          }
          seen.add(normalizedKey);
          merged.push(normalized);
        });
        store.toolTags = merged.slice(0, SUBTITLE_TAG_LIMIT);
        store.toolHiddenTagKeys = store.toolHiddenTagKeys.filter(function (hiddenKey) {
          return hiddenKey !== key;
        });
        saveToolTagMemory();
        saveToolHiddenTagKeys();
      }

      function deleteToolTag(tool) {
        var safeTool = normalizeTool(tool);
        var key = normalizeToolKey(safeTool);
        if (!safeTool || !key) {
          return;
        }
        store.toolTags = store.toolTags.filter(function (item) {
          return normalizeToolKey(item) !== key;
        });
        if (store.toolHiddenTagKeys.indexOf(key) === -1) {
          store.toolHiddenTagKeys.push(key);
        }
        removeToolFromInput(safeTool);
        previewEditedBlockVisual();
        saveToolTagMemory();
        saveToolHiddenTagKeys();
        renderToolChips(els.editTool.value);
        els.editTool.focus();
      }

      function loadToolTagMemory() {
        try {
          var raw = JSON.parse(localStorage.getItem(TOOL_TAG_STORAGE_KEY) || "[]");
          if (!Array.isArray(raw)) {
            return [];
          }
          var tools = [];
          var seen = new Set();
          raw.forEach(function (tool) {
            var safeTool = normalizeTool(tool);
            var key = normalizeToolKey(safeTool);
            if (safeTool && !seen.has(key)) {
              seen.add(key);
              tools.push(safeTool);
            }
          });
          return tools.slice(0, SUBTITLE_TAG_LIMIT);
        } catch (error) {
          return [];
        }
      }

      function saveToolTagMemory() {
        try {
          localStorage.setItem(TOOL_TAG_STORAGE_KEY, JSON.stringify(store.toolTags.slice(0, SUBTITLE_TAG_LIMIT)));
        } catch (error) {
          console.warn("Tool tags could not be saved.", error);
        }
      }

      function loadToolHiddenTagKeys() {
        try {
          var raw = JSON.parse(localStorage.getItem(TOOL_TAG_HIDDEN_STORAGE_KEY) || "[]");
          if (!Array.isArray(raw)) {
            return [];
          }
          var keys = [];
          raw.forEach(function (key) {
            var safeKey = normalizeToolKey(key);
            if (safeKey && keys.indexOf(safeKey) === -1) {
              keys.push(safeKey);
            }
          });
          return keys.slice(0, SUBTITLE_TAG_LIMIT);
        } catch (error) {
          return [];
        }
      }

      function saveToolHiddenTagKeys() {
        try {
          localStorage.setItem(TOOL_TAG_HIDDEN_STORAGE_KEY, JSON.stringify(store.toolHiddenTagKeys.slice(0, SUBTITLE_TAG_LIMIT)));
        } catch (error) {
          console.warn("Tool hidden tags could not be saved.", error);
        }
      }

      function parseToolTags(value) {
        return String(value || "")
          .split(/[,;|/·\n\r]+/g)
          .map(normalizeTool)
          .filter(Boolean);
      }

      function formatToolTags(value) {
        var result = [];
        var seen = new Set();
        parseToolTags(Array.isArray(value) ? value.join(", ") : value).forEach(function (tool) {
          var key = normalizeToolKey(tool);
          if (!key || seen.has(key)) {
            return;
          }
          seen.add(key);
          result.push(tool);
        });
        return result.join(", ");
      }

      function toolSelectionHasTool(selection, tool) {
        var key = normalizeToolKey(tool);
        if (!key) {
          return false;
        }
        return parseToolTags(selection).some(function (item) {
          return normalizeToolKey(item) === key;
        });
      }

      function toggleToolInInput(tool) {
        var safeTool = normalizeTool(tool);
        var key = normalizeToolKey(safeTool);
        var currentTags;
        var removed = false;
        if (!safeTool || !key) {

        }
        currentTags = parseToolTags(els.editTool.value).filter(function (item) {
          var isTarget = normalizeToolKey(item) === key;
          if (isTarget) {

          }
          return !isTarget;
        });
        if (!removed) {
          currentTags.push(safeTool);
        }
        els.editTool.value = formatToolTags(currentTags);

      function deleteSubtitleTag(tag) {

        store.subtitleTags = store.subtitleTags.filter(function (item) {

      function removeSubtitleTagFromInput(tag) {

      }

      function getSubtitleTagOptions() {
        var result = [];
        var seen = new Set();
        function add(tag) {
          var safeTag = normalizeSubtitleTag(tag);
          var key = normalizeSubtitleTagKey(safeTag);
          if (!safeTag || seen.has(key) || store.subtitleHiddenTagKeys.indexOf(key) !== -1) {
            return;
          }
          seen.add(key);
          result.push(safeTag);
        }
        PERSON_TAG_PRESETS.forEach(add);
        store.subtitleTags.forEach(add);
        return result.slice(0, SUBTITLE_TAG_LIMIT);
      }

      function parseSubtitleTags(value) {
        return String(value || "")
          .split(/[,;|/＋+·ㆍ\n\r]+/g)
          .map(normalizeSubtitleTag)
          .filter(Boolean);
      }

      function normalizeSubtitleTag(tag) {
        return String(tag || "").replace(/\s+/g, " ").trim();
      }

      function normalizeSubtitleTagKey(tag) {
        return normalizeSubtitleTag(tag).toLowerCase();
      }

      function rememberSubtitleTags(value) {
        var newTags = parseSubtitleTags(value);
        if (!newTags.length) {
          return;
        }
        var merged = [];
        var seen = new Set();
        var rememberedKeys = new Set(newTags.map(normalizeSubtitleTagKey));
        newTags.concat(store.subtitleTags).forEach(function (tag) {
          var safeTag = normalizeSubtitleTag(tag);
          var key = normalizeSubtitleTagKey(safeTag);
          if (!safeTag || seen.has(key)) {
            return;
          }
          seen.add(key);
          merged.push(safeTag);
        });
        store.subtitleTags = merged.slice(0, SUBTITLE_TAG_LIMIT);
        store.subtitleHiddenTagKeys = store.subtitleHiddenTagKeys.filter(function (key) {
          return !rememberedKeys.has(key);
        });
        saveSubtitleTagMemory();
        saveSubtitleHiddenTagKeys();
      }

      function loadSubtitleTagMemory() {
        try {
          var raw = JSON.parse(localStorage.getItem(SUBTITLE_TAG_STORAGE_KEY) || "[]");
          if (!Array.isArray(raw)) {
            return [];
          }
          var tags = [];
          var seen = new Set();
          raw.forEach(function (tag) {
            var safeTag = normalizeSubtitleTag(tag);
            var key = normalizeSubtitleTagKey(safeTag);
            if (safeTag && !seen.has(key)) {
              seen.add(key);
              tags.push(safeTag);
            }
          });
          return tags.slice(0, SUBTITLE_TAG_LIMIT);
        } catch (error) {
          return [];
        }
      }

      function saveSubtitleTagMemory() {
        try {
          localStorage.setItem(SUBTITLE_TAG_STORAGE_KEY, JSON.stringify(store.subtitleTags.slice(0, SUBTITLE_TAG_LIMIT)));
        } catch (error) {
          console.warn("Subtitle tags could not be saved.", error);
        }
      }

      function loadSubtitleHiddenTagKeys() {
        try {
          var raw = JSON.parse(localStorage.getItem(SUBTITLE_TAG_HIDDEN_STORAGE_KEY) || "[]");
          if (!Array.isArray(raw)) {
            return [];
          }
          var keys = [];
          raw.forEach(function (key) {
            var safeKey = normalizeSubtitleTagKey(key);
            if (safeKey && keys.indexOf(safeKey) === -1) {
              keys.push(safeKey);
            }
          });
          return keys.slice(0, SUBTITLE_TAG_LIMIT);
        } catch (error) {
          return [];
        }
      }

      function saveSubtitleHiddenTagKeys() {
        try {
          localStorage.setItem(SUBTITLE_TAG_HIDDEN_STORAGE_KEY, JSON.stringify(store.subtitleHiddenTagKeys.slice(0, SUBTITLE_TAG_LIMIT)));

      }

      function addEditAttachmentFiles(fileList) {
        var files = getAttachmentFilesFromFileList(fileList);
        if (!files.length) {
          showToast("이미지 또는 HTML 파일만 첨부할 수 있습니다.");
          return;
        }
        var imageFiles = files.filter(isImageFile);
        var htmlFiles = files.filter(isHtmlFile);
        Promise.all([
          Promise.all(imageFiles.map(readImageFileAsDataUrl)),
          Promise.all(htmlFiles.map(readHtmlFileAsText))
        ]).then(function (results) {
          var images = results[0];
          var htmlDocuments = results[1];
          store.editImages = cloneBlockImages(store.editImages).concat(images);
          store.editHtmlFiles = cloneBlockHtmlFiles(store.editHtmlFiles).concat(htmlDocuments);
          renderEditImages();
          if (images[0]) {
            openImagePreview(images[0]);
          } else if (htmlDocuments[0]) {
            openHtmlPreview(htmlDocuments[0]);
          }
          showToast(files.length > 1 ? files.length + "개 파일을 첨부했습니다." : (htmlDocuments.length ? "HTML 파일을 첨부했습니다." : "이미지를 첨부했습니다."));
        }).catch(function () {
          showToast("첨부 파일을 읽지 못했습니다.");
        });
      }

      function readImageFileAsDataUrl(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve({
              id: createImageId(),
              name: file.name || "clipboard-image.png",
              type: file.type || "image/png",
              data: String(reader.result || "")
            });
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function readHtmlFileAsText(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve({
              id: createHtmlFileId(),
              name: file.name || "첨부 문서.html",
              type: "text/html",
              content: String(reader.result || "")
            });
          };
          reader.onerror = reject;
          reader.readAsText(file);
        });
      }

      function toggleHtmlPreviewFullscreen(event) {

        var requestFullscreen;
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }
        if (!frame) {
          return;
        }
        if (fullscreenElement === frame) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(function () {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
          return;
        }
        requestFullscreen = frame.requestFullscreen || frame.webkitRequestFullscreen;
        if (!requestFullscreen) {
          showToast("이 브라우저에서는 풀스크린을 지원하지 않습니다.");
          return;
        }
        Promise.resolve(requestFullscreen.call(frame)).catch(function () {
          showToast("풀스크린을 열 수 없습니다.");
        });
      }

        var selectedIds = store.innerDiagram.selectedIds.slice();
        if (selectedIds.length < 2) {
          showToast("내부 블록을 2개 이상 선택해주세요.");
          return;
        }
        for (var index = 0; index < selectedIds.length - 1; index += 1) {
          addInnerConnection(selectedIds[index], selectedIds[index + 1]);
        }
        renderInnerDiagram();
      }

      function deleteInnerSelection() {
        var selectedIds = store.innerDiagram.selectedIds.slice();
        if (!selectedIds.length) {
          return;
        }
        var removeIds = new Set(selectedIds);
        store.innerDiagram.data.blocks = store.innerDiagram.data.blocks.filter(function (block) {
          return !removeIds.has(block.id);
        });
        store.innerDiagram.data.connections = store.innerDiagram.data.connections.filter(function (connection) {
          return !removeIds.has(connection.from) && !removeIds.has(connection.to);
        });
        if (removeIds.has(store.innerDiagram.editBlockId)) {
          closeInnerBlockEditModal();
        }
        store.innerDiagram.selectedIds = [];
        renderInnerDiagram();
      }

      function extractInnerSelectionToCanvas() {
        var parentBlock = getBlock(store.innerDiagram.blockId);
        var selectedIds = store.innerDiagram.selectedIds.slice();
        var selectedSet = new Set(selectedIds);
        var selectedBlocks = selectedIds.map(getInnerBlock).filter(Boolean);
        var idMap = new Map();
        var bounds;
        var baseX;
        var baseY;
        var createdIds = [];
        if (!parentBlock || !selectedBlocks.length) {
          showToast("밖으로 꺼낼 내부 블록을 선택해주세요.");
          return;
        }
        bounds = getInnerBlocksBounds(selectedBlocks);
        baseX = Math.round(clamp((Number(parentBlock.x) || 0) + getBlockWidth(parentBlock) + 100, 0, WORLD_WIDTH - bounds.width));
        baseY = Math.round(clamp(Number(parentBlock.y) || 0, 0, WORLD_HEIGHT - bounds.height));
        pushUndoSnapshot(createUndoSnapshot());
        selectedBlocks.forEach(function (innerBlock) {
          var outerId = createUniqueBlockId();
          var width = Math.round(clamp(getInnerBlockWidth(innerBlock), BLOCK_RESIZE_MIN_WIDTH, 720));
          var height = Math.round(clamp(getInnerBlockHeight(innerBlock), BLOCK_RESIZE_MIN_HEIGHT, 360));
          idMap.set(innerBlock.id, outerId);
          createdIds.push(outerId);
          store.data.blocks.push({
            id: outerId,
            title: innerBlock.title || "내부 블록",
            subtitle: "",
            detail: "",
            link: "",
            tool: "",
            images: [],
            innerDiagram: createEmptyInnerDiagram(),
            startDate: null,
            dueDate: null,
            status: null,
            done: false,
            highlight: false,
            category: parentBlock.category || "",
            type: "sub",
            parentId: "",
            children: undefined,
            inheritColor: false,
            color: validColor(innerBlock.color) ? innerBlock.color : getBlockColor(parentBlock),
            width: width,
            height: height,
            x: Math.round(clamp(baseX + (Number(innerBlock.x) || 0) - bounds.left, 0, WORLD_WIDTH - width)),
            y: Math.round(clamp(baseY + (Number(innerBlock.y) || 0) - bounds.top, 0, WORLD_HEIGHT - height))
          });
        });
        store.innerDiagram.data.connections.forEach(function (connection) {
          if (selectedSet.has(connection.from) && selectedSet.has(connection.to)) {
            store.data.connections.push({
              from: idMap.get(connection.from),
              to: idMap.get(connection.to),
              label: getConnectionLabel(connection),
              ioType: getConnectionIoType(connection)
            });
          }
        });
        store.innerDiagram.data.blocks = store.innerDiagram.data.blocks.filter(function (block) {
          return !selectedSet.has(block.id);
        });
        store.innerDiagram.data.connections = store.innerDiagram.data.connections.filter(function (connection) {
          return !selectedSet.has(connection.from) && !selectedSet.has(connection.to);
        });
        store.innerDiagram.selectedIds = [];
        parentBlock.innerDiagram = cloneInnerDiagram(store.innerDiagram.data);
        setSelection(createdIds);
        renderInnerDiagram();
        renderAll();
        saveLocalState();
        showToast(selectedBlocks.length + "개 내부 블록을 밖으로 꺼냈습니다.");
      }

      function getInnerBlocksBounds(blocks) {
        var left = Math.min.apply(null, blocks.map(function (block) {
          return Number(block.x) || 0;
        }));
        var top = Math.min.apply(null, blocks.map(function (block) {
          return Number(block.y) || 0;
        }));
        var right = Math.max.apply(null, blocks.map(function (block) {
          return (Number(block.x) || 0) + getInnerBlockWidth(block);
        }));
        var bottom = Math.max.apply(null, blocks.map(function (block) {
          return (Number(block.y) || 0) + getInnerBlockHeight(block);
        }));
        return {
          left: left,
          top: top,
          right: right,
          bottom: bottom,
          width: right - left,
          height: bottom - top
        };
      }

      function duplicateInnerBlock(blockId) {
        var source = getInnerBlock(blockId);
        var copy;
        if (!source) {
          return;
        }
        copy = {
          id: createInnerBlockId(store.innerDiagram.data),
          title: source.title || "내부 블록",
          color: validColor(source.color) ? source.color : FALLBACK_COLOR,
          x: Math.round(clamp((Number(source.x) || 0) + 36, 0, INNER_WORLD_WIDTH - getInnerBlockWidth(source))),
          y: Math.round(clamp((Number(source.y) || 0) + 36, 0, INNER_WORLD_HEIGHT - getInnerBlockHeight(source))),
          width: getInnerBlockWidth(source),
          height: getInnerBlockHeight(source)
        };
        store.innerDiagram.data.blocks.push(copy);
        store.innerDiagram.selectedIds = [copy.id];
        renderInnerDiagram();
      }

      function commitInlineInnerBlockTitle(blockId, titleElement) {
        var block = getInnerBlock(blockId);
        var nextTitle;
        if (!block || !titleElement) {
          return;
        }
        nextTitle = normalizeInlineTitle(titleElement.textContent) || "내부 블록";
        if (nextTitle === block.title) {
          titleElement.textContent = nextTitle;
          return;
        }
        block.title = nextTitle;
        renderInnerDiagram();
      }

      function renderInnerDiagram() {
        if (!els.innerBlocksLayer || !els.innerConnectionGroup) {
          return;
        }
        renderInnerConnections();
        els.innerBlocksLayer.replaceChildren();
        store.innerDiagram.data.blocks.forEach(function (block) {
          var node = document.createElement("div");
          var title = document.createElement("div");
          var handle = document.createElement("button");
          var resizeHandle = document.createElement("button");
          var actions = document.createElement("div");
          var editButton = document.createElement("button");
          var copyButton = document.createElement("button");
          var connectButton = document.createElement("button");
          var extractButton = document.createElement("button");
          var deleteButton = document.createElement("button");
          var isSelected = store.innerDiagram.selectedIds.indexOf(block.id) !== -1;
          node.className = "inner-block" + (isSelected ? " is-selected" : "");
          node.dataset.innerId = block.id;
          node.style.left = (Number(block.x) || 0) + "px";
          node.style.top = (Number(block.y) || 0) + "px";
          node.style.setProperty("--inner-block-width", getInnerBlockWidth(block) + "px");
          node.style.setProperty("--inner-block-height", getInnerBlockHeight(block) + "px");
          node.style.setProperty("--inner-color", validColor(block.color) ? block.color : FALLBACK_COLOR);
          node.title = block.title || "내부 블록";
          title.className = "inner-block-title";
          title.textContent = block.title || "내부 블록";
          if (isSelected) {
            title.contentEditable = "plaintext-only";
            title.spellcheck = false;
            title.setAttribute("role", "textbox");
            title.setAttribute("aria-label", "내부 블록 제목");
          }
          title.addEventListener("pointerdown", function (event) {
            if (title.isContentEditable && !(event.shiftKey || event.ctrlKey || event.metaKey)) {
              event.stopPropagation();
            }
          });
          title.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
              event.preventDefault();
              commitInlineInnerBlockTitle(block.id, title);
              title.blur();
            }
            if (event.key === "Escape") {
              event.preventDefault();
              var currentBlock = getInnerBlock(block.id);
              title.textContent = currentBlock && currentBlock.title ? currentBlock.title : "내부 블록";
              title.blur();
            }
          });
          title.addEventListener("blur", function () {
            commitInlineInnerBlockTitle(block.id, title);
          });
          actions.className = "inner-block-actions";
          editButton.className = "block-action-button";
          editButton.type = "button";
          editButton.textContent = "수정";
          editButton.title = "내부 블록 수정";
          editButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            openInnerBlockEditModal(block.id);
          });
          copyButton.className = "block-action-button";
          copyButton.type = "button";
          copyButton.textContent = "복사";
          copyButton.title = "내부 블록 복사";
          copyButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            duplicateInnerBlock(block.id);
          });
          connectButton.className = "block-action-button primary";
          connectButton.type = "button";
          connectButton.textContent = "연결";
          connectButton.title = "선택된 내부 블록 연결";
          connectButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            connectInnerSelection();
          });
          extractButton.className = "block-action-button";
          extractButton.type = "button";
          extractButton.textContent = "밖으로";
          extractButton.title = "선택 내부 블록을 밖으로 꺼내기";
          extractButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            if (store.innerDiagram.selectedIds.indexOf(block.id) === -1) {
              store.innerDiagram.selectedIds = [block.id];
            }
            extractInnerSelectionToCanvas();
          });
          deleteButton.className = "block-action-button danger";
          deleteButton.type = "button";
          deleteButton.textContent = isSelected && store.innerDiagram.selectedIds.length > 1 ? store.innerDiagram.selectedIds.length + "개 삭제" : "삭제";
          deleteButton.title = "내부 블록 삭제";
          deleteButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            if (store.innerDiagram.selectedIds.indexOf(block.id) === -1) {
              store.innerDiagram.selectedIds = [block.id];
            }
            deleteInnerSelection();
          });
          actions.append(editButton, copyButton, connectButton, extractButton, deleteButton);
          handle.className = "inner-connect-handle";
          handle.type = "button";
          handle.title = "연결";
          handle.setAttribute("aria-label", "내부 블록 연결");
          handle.addEventListener("pointerdown", function (event) {
            startInnerHandlePress(event, block.id);
          });
          resizeHandle.className = "inner-block-resize-handle";
          resizeHandle.type = "button";
          resizeHandle.title = "내부 블록 크기 조절";
          resizeHandle.setAttribute("aria-label", "내부 블록 크기 조절");
          resizeHandle.addEventListener("pointerdown", function (event) {
            startInnerBlockResize(event, block.id);
          });
          node.append(actions, title, handle, resizeHandle);
          node.addEventListener("pointerdown", function (event) {
            if (isControlTarget(event.target)) {
              return;
            }
            startInnerBlockDrag(event, block.id);
          });
          node.addEventListener("dblclick", function (event) {
            event.preventDefault();
            event.stopPropagation();
            openInnerBlockEditModal(block.id);
          });
          els.innerBlocksLayer.append(node);
        });
      }

      function renderInnerConnections() {
        els.innerConnectionGroup.replaceChildren();
        store.innerDiagram.data.connections.forEach(function (connection) {
          var fromBlock = getInnerBlock(connection.from);
          var toBlock = getInnerBlock(connection.to);
          if (!fromBlock || !toBlock) {
            return;
          }
          var path = createSvgElement("path");
          path.setAttribute("class", "inner-connection-visible");
          path.setAttribute("d", getInnerConnectionPath(fromBlock, toBlock));
          path.dataset.from = connection.from;
          path.dataset.to = connection.to;
          path.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            editInnerConnectionLabel(getInnerConnectionKey(connection));
          });
          path.addEventListener("dblclick", function (event) {
            event.preventDefault();
            event.stopPropagation();
            editInnerConnectionLabel(getInnerConnectionKey(connection));
          });
          els.innerConnectionGroup.append(path);
          var label = createInnerConnectionLabelElement(connection, fromBlock, toBlock);
          if (label) {
            els.innerConnectionGroup.append(label);
          }
        });
      }

      function createInnerConnectionLabelElement(connection, fromBlock, toBlock) {
        var labelText = getConnectionLabel(connection);
        if (!labelText) {
          return null;
        }
        var ioType = getConnectionIoType(connection);
        var ioLabel = getConnectionIoLabel(ioType);
        var point = getInnerConnectionLabelPoint(fromBlock, toBlock);
        var size = getConnectionLabelSize(connection);
        var key = getInnerConnectionKey(connection);
        var foreignObject = createSvgElement("foreignObject");
        var label = document.createElement("div");
        var text = document.createElement("span");
        foreignObject.setAttribute("x", Math.round(point.x - size.width / 2));
        foreignObject.setAttribute("y", Math.round(point.y - size.height / 2));
        foreignObject.setAttribute("width", size.width);
        foreignObject.setAttribute("height", size.height);
        foreignObject.setAttribute("class", "connection-label-box inner-connection-label-box");
        foreignObject.dataset.innerConnectionKey = key;
        foreignObject.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          editInnerConnectionLabel(key);
        });
        label.className = "connection-label" + (ioType ? " is-" + ioType : "");
        if (ioLabel) {
          var badge = document.createElement("span");
          badge.className = "connection-io-badge";
          badge.textContent = ioLabel;
          label.append(badge);
        }
        text.className = "connection-label-text";
        text.textContent = labelText;
        label.append(text);
        foreignObject.append(label);
        return foreignObject;
      }

      function getInnerConnectionLabelPoint(fromBlock, toBlock) {
        var start = getInnerEdgePoint(fromBlock, getInnerBlockCenter(toBlock));
        var end = getInnerEdgePoint(toBlock, getInnerBlockCenter(fromBlock));
        return {
          x: (start.x + end.x) / 2,
          y: (start.y + end.y) / 2
        };
      }

      function startInnerBlockDrag(event, blockId) {
        if (event.button !== 0 || event.detail >= 2) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        selectInnerBlock(blockId, event.shiftKey || event.ctrlKey || event.metaKey);
        var selectedBlocks = store.innerDiagram.selectedIds.map(getInnerBlock).filter(Boolean);
        store.innerDiagram.drag = {
          pointerId: event.pointerId,
          blockId: blockId,
          moved: false,
          startClientX: event.clientX,
          startClientY: event.clientY,
          blocks: selectedBlocks.map(function (block) {
            return {
              id: block.id,
              x: Number(block.x) || 0,
              y: Number(block.y) || 0
            };
          })
        };
        safelyCapturePointer(event.currentTarget, event.pointerId);
      }

      function moveInnerDraggedBlock(event) {
        var drag = store.innerDiagram.drag;
        if (!drag) {
          return;
        }
        var deltaX = event.clientX - drag.startClientX;
        var deltaY = event.clientY - drag.startClientY;
        if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) {
          drag.moved = true;
        }
        drag.blocks.forEach(function (item) {
          var block = getInnerBlock(item.id);
          if (!block) {
            return;
          }
          block.x = Math.round(clamp(item.x + deltaX, 0, INNER_WORLD_WIDTH - getInnerBlockWidth(block)));
          block.y = Math.round(clamp(item.y + deltaY, 0, INNER_WORLD_HEIGHT - getInnerBlockHeight(block)));
          setInnerBlockPosition(block);
        });
      renderInnerConnections();
      }

      function finishInnerBlockDrag(event) {
        var target = getInnerBlockElement(store.innerDiagram.drag && store.innerDiagram.drag.blockId);
        if (target) {
          safelyReleasePointer(target, event.pointerId);
        }
        store.innerDiagram.drag = null;
      }

      function startInnerBlockResize(event, blockId) {
        var block;
        var node;
        var point;
        if (event.button !== 0 || store.innerDiagram.drag || store.innerDiagram.connect || store.innerDiagram.handlePress) {
          return;
        }
        block = getInnerBlock(blockId);
        if (!block) {
          return;
        }
        if (store.innerDiagram.selectedIds.indexOf(blockId) === -1) {
          store.innerDiagram.selectedIds = [blockId];
          renderInnerDiagram();
        }
        block = getInnerBlock(blockId);
        node = getInnerBlockElement(blockId);
        point = screenToInnerWorld(event.clientX, event.clientY);
        store.innerDiagram.resize = {
          blockId: blockId,
          pointerId: event.pointerId,
          startWorldX: point.x,
          startWorldY: point.y,
          startClientX: event.clientX,
          startClientY: event.clientY,
          startWidth: getInnerBlockWidth(block),
          startHeight: getInnerBlockHeight(block),
          moved: false
        };
        if (node) {
          node.classList.add("is-resizing");
          node.setPointerCapture(event.pointerId);
        }
        event.preventDefault();
        event.stopPropagation();
      }

      function moveInnerResizedBlock(event) {
        var resize = store.innerDiagram.resize;
        var block = resize && getInnerBlock(resize.blockId);
        var node = block && getInnerBlockElement(block.id);
        var point;
        var nextWidth;
        var nextHeight;
        if (!resize || !block || !node) {
          return;
        }
        if (Math.abs(event.clientX - resize.startClientX) > 3 || Math.abs(event.clientY - resize.startClientY) > 3) {
          resize.moved = true;
        }
        point = screenToInnerWorld(event.clientX, event.clientY);
        nextWidth = Math.round(clamp(resize.startWidth + point.x - resize.startWorldX, getInnerBlockMinWidth(block), INNER_WORLD_WIDTH - (Number(block.x) || 0)));
        nextHeight = Math.round(clamp(resize.startHeight + point.y - resize.startWorldY, getInnerBlockMinHeight(block), INNER_WORLD_HEIGHT - (Number(block.y) || 0)));
        block.width = nextWidth;
        block.height = nextHeight;
        applyInnerBlockSize(node, block);
        renderInnerConnections();
        event.preventDefault();
      }

      function finishInnerBlockResize(event) {
        var resize = store.innerDiagram.resize;
        var node = resize && getInnerBlockElement(resize.blockId);
        if (node) {
          node.classList.remove("is-resizing");
          safelyReleasePointer(node, event.pointerId);
        }
        store.innerDiagram.resize = null;
        if (resize && resize.moved) {
          renderInnerDiagram();
        }
        event.preventDefault();
        event.stopPropagation();
      }

      function startInnerHandlePress(event, blockId) {
        if (event.button !== 0) {
          return;
        }
        if (!getInnerBlock(blockId)) {
          return;
        }
        store.innerDiagram.handlePress = {
          blockId: blockId,
          pointerId: event.pointerId,
          startClientX: event.clientX,
          startClientY: event.clientY,
          handle: event.currentTarget
        };
        event.currentTarget.classList.add("is-active");
        safelyCapturePointer(event.currentTarget, event.pointerId);
        event.preventDefault();
        event.stopPropagation();
      }

      function beginInnerConnectionFromHandlePress(event) {
        var press = store.innerDiagram.handlePress;
        var block = press && getInnerBlock(press.blockId);
        if (!press || !block) {
          clearInnerDraftConnection();
          return;
        }
        var start = getInnerHandlePoint(block);
        var current = screenToInnerWorld(event.clientX, event.clientY);
        store.innerDiagram.connect = {
          from: press.blockId,
          pointerId: press.pointerId,
          handle: press.handle,
          startX: start.x,
          startY: start.y,
          endX: current.x,
          endY: current.y
        };
        store.innerDiagram.handlePress = null;
        updateInnerDraftConnection();
      }

      function finishInnerHandlePress(event) {
        var press = store.innerDiagram.handlePress;
        if (!press) {
          return;
        }
        if (press.handle) {
          press.handle.classList.remove("is-active");
          safelyReleasePointer(press.handle, event.pointerId);
        }
        store.innerDiagram.handlePress = null;
      }

      function moveInnerDraftConnection(event) {
        var worldPoint = screenToInnerWorld(event.clientX, event.clientY);
        store.innerDiagram.connect.endX = worldPoint.x;
        store.innerDiagram.connect.endY = worldPoint.y;
        updateInnerDraftConnection();
      }

      function finishInnerConnection(event) {
        var connect = store.innerDiagram.connect;
        var fromId = connect && connect.from;
        var target = getInnerBlockFromPoint(event.clientX, event.clientY, [fromId]);
        if (target && target.dataset.innerId && target.dataset.innerId !== fromId) {
          addInnerConnectionsToTarget(getInnerConnectionSourceIds(fromId, target.dataset.innerId), target.dataset.innerId);
        }
        if (connect && connect.handle) {
          safelyReleasePointer(connect.handle, event.pointerId);
        }
        clearInnerDraftConnection();
      }

      function handleInnerStagePointerDown(event) {
        if (event.target !== els.innerDiagramStage && event.target !== els.innerDiagramWorld && event.target !== els.innerBlocksLayer) {
          return;
        }
        if (event.button === 0) {
          startInnerMarqueeSelection(event);
          return;
        }
      }

      function startInnerMarqueeSelection(event) {
        var worldPoint = screenToInnerWorld(event.clientX, event.clientY);
        store.innerDiagram.marquee = {
          pointerId: event.pointerId,
          additive: event.shiftKey || event.ctrlKey || event.metaKey,
          startWorldX: worldPoint.x,
          startWorldY: worldPoint.y
        };
        if (!store.innerDiagram.marquee.additive) {
          store.innerDiagram.selectedIds = [];
          renderInnerDiagram();
        }
        updateInnerSelectionBox(worldPoint.x, worldPoint.y);
        safelyCapturePointer(els.innerDiagramStage, event.pointerId);
        event.preventDefault();
        event.stopPropagation();
      }

      function moveInnerMarqueeSelection(event) {
        var worldPoint = screenToInnerWorld(event.clientX, event.clientY);
        updateInnerSelectionBox(worldPoint.x, worldPoint.y);
      }

      function finishInnerMarqueeSelection(event) {
        var marquee = store.innerDiagram.marquee;
        var endWorld = screenToInnerWorld(event.clientX, event.clientY);
        var rect = normalizeRect(marquee.startWorldX, marquee.startWorldY, endWorld.x, endWorld.y);
        var selectedIds = store.innerDiagram.data.blocks.filter(function (block) {
          return rectsIntersect(rect, {
            left: Number(block.x) || 0,
            top: Number(block.y) || 0,
            right: (Number(block.x) || 0) + getInnerBlockWidth(block),
            bottom: (Number(block.y) || 0) + getInnerBlockHeight(block)
          });
        }).map(function (block) {
          return block.id;
        });

        if (marquee.additive) {
          selectedIds.forEach(function (id) {
            if (store.innerDiagram.selectedIds.indexOf(id) === -1) {
              store.innerDiagram.selectedIds.push(id);
            }
          });
        } else {
          store.innerDiagram.selectedIds = selectedIds;
        }

        hideInnerSelectionBox();
        safelyReleasePointer(els.innerDiagramStage, event.pointerId);
        store.innerDiagram.marquee = null;
        renderInnerDiagram();
      }

      function updateInnerSelectionBox(currentWorldX, currentWorldY) {
        if (!els.innerSelectionBox || !store.innerDiagram.marquee) {
          return;
        }
        var rect = normalizeRect(store.innerDiagram.marquee.startWorldX, store.innerDiagram.marquee.startWorldY, currentWorldX, currentWorldY);
        els.innerSelectionBox.classList.add("is-visible");
        els.innerSelectionBox.style.left = rect.left + "px";
        els.innerSelectionBox.style.top = rect.top + "px";
        els.innerSelectionBox.style.width = Math.max(0, rect.right - rect.left) + "px";
        els.innerSelectionBox.style.height = Math.max(0, rect.bottom - rect.top) + "px";
      }

      function hideInnerSelectionBox() {
        if (!els.innerSelectionBox) {
          return;
        }
        els.innerSelectionBox.classList.remove("is-visible");

      function hasAttachmentFiles(dataTransfer) {
        if (!dataTransfer) {
          return false;
        }
        if (dataTransfer.items && dataTransfer.items.length) {
          var hasSupportedItem = Array.from(dataTransfer.items).some(function (item) {
            if (item.kind !== "file") {
              return false;
            }
            var file = item.getAsFile ? item.getAsFile() : null;
            return isImageFile(file) || isHtmlFile(file) || /^image\//i.test(item.type || "") || /^text\/html$/i.test(item.type || "");
          });
          if (hasSupportedItem) {
            return true;
          }
        }
        if (Array.from(dataTransfer.types || []).indexOf("Files") >= 0) {
          return true;
        }
        return getAttachmentFilesFromFileList(dataTransfer.files).length > 0;
      }

      function getAttachmentFilesFromClipboard(clipboardData) {
        if (!clipboardData) {
          return [];
        }
        var directFiles = getAttachmentFilesFromFileList(clipboardData.files);
        if (directFiles.length) {
          return directFiles;
        }
        if (!clipboardData.items) {
          return [];
        }
        return Array.from(clipboardData.items).map(function (item) {
          return item.kind === "file" && item.getAsFile ? item.getAsFile() : null;
        }).filter(function (file) {
          return isImageFile(file) || isHtmlFile(file);
        });
      }

      function getAttachmentFilesFromFileList(fileList) {
        return Array.from(fileList || []).filter(function (file) {
          return isImageFile(file) || isHtmlFile(file);
        });
      }

      function isImageFile(file) {
        return Boolean(file && /^image\//i.test(file.type || ""));
      }

      function isHtmlFile(file) {
        return Boolean(file && (/^text\/html$/i.test(file.type || "") || /\.html?$/i.test(file.name || "")));
      }

      function handleKeyDown(event) {
        if (event.code === "Space" && !isTypingTarget(event.target) && !isModalOpen()) {
          store.isSpaceDown = true;
          els.viewport.classList.add("is-panning");
          event.preventDefault();
          return;
        }
        if (isUndoShortcut(event) && canUndoAction(event.target)) {
          event.preventDefault();
          undoLastAction();
          return;
        }
        if (isCopyShortcut(event) && canCopySelectedBlocks(event.target)) {
          event.preventDefault();
          copySelectedBlocksToClipboard();
          return;
        }
        if (isPasteShortcut(event) && canPasteBlocks(event.target)) {
          event.preventDefault();
          pasteBlocksFromClipboard();
          return;
        }
        if (event.key === "Enter" && canEditSelectedConnectionLabel(event.target)) {
          event.preventDefault();
          editConnectionLabel(store.selectedConnectionKeys[0]);
          return;
        }
        if ((event.key === "Delete" || event.key === "Backspace") && canDeleteSelectedItems(event.target)) {
          event.preventDefault();
          removeSelectedItems();
          return;
        }
        if ((event.key === "Delete" || event.key === "Backspace") && canDeleteInnerSelection(event.target)) {
          event.preventDefault();
          deleteInnerSelection();
          return;
        }
        if (event.key !== "Escape") {
          return;
        }
        if (isDatePickerOpen()) {
          closeDatePicker();
          event.preventDefault();
          return;
        }
        var modalWasOpen = false;
        if (els.innerBlockEditModal.classList.contains("is-open")) {
          closeInnerBlockEditModal();
          event.preventDefault();
          return;
        }
        if (els.jsonModal.classList.contains("is-open")) {
          closeJsonModal();
          modalWasOpen = true;
        }
        if (els.editModal.classList.contains("is-open")) {
          closeEditModal();
          modalWasOpen = true;
        }
        if (els.linkModal.classList.contains("is-open")) {
          closeLinkModal();
          modalWasOpen = true;
        }
        if (els.imagePreviewModal.classList.contains("is-open")) {
          closeImagePreviewModal();
          modalWasOpen = true;
        }
        if (els.htmlPreviewModal.classList.contains("is-open")) {
          closeHtmlPreviewModal();
          modalWasOpen = true;
        }
        if (els.innerDiagramModal.classList.contains("is-open")) {
          closeInnerDiagramModal();
          modalWasOpen = true;
        }
        if (els.connectionEditModal.classList.contains("is-open")) {
          closeConnectionEditModal();
          modalWasOpen = true;
        }
        if (!modalWasOpen) {
          clearSelectedBlock();
        }
      }

      function renderDatePicker() {
        var year = store.datePicker.year;
        var month = store.datePicker.month;
        var selectedValue = normalizeDateString(store.datePicker.input && store.datePicker.input.value);
        var todayValue = formatDatePickerValue(new Date());
        var firstDay = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        var fragment = document.createDocumentFragment();
        var index;
        var day;
        if (!els.datePickerGrid || !els.datePickerTitle) {
          return;
        }
        els.datePickerTitle.textContent = year + "년 " + (month + 1) + "월";
        for (index = 0; index < firstDay; index += 1) {
          var empty = document.createElement("span");
          empty.className = "date-picker-empty";
          fragment.append(empty);
        }
        for (day = 1; day <= daysInMonth; day += 1) {
          var dateValue = year + "-" + padDatePart(month + 1) + "-" + padDatePart(day);
          var button = document.createElement("button");
          button.type = "button";

      function positionDatePicker(input) {
        var rect = input.getBoundingClientRect();

        var margin = 12;
        var left;
        var top;
        if (!popover) {
          return;
        }
        left = Math.min(Math.max(rect.left, margin), Math.max(margin, window.innerWidth - popover.offsetWidth - margin));
        top = rect.bottom + 8;
        if (top + popover.offsetHeight > window.innerHeight - margin) {
          top = rect.top - popover.offsetHeight - 8;
        }
        top = Math.min(Math.max(top, margin), Math.max(margin, window.innerHeight - popover.offsetHeight - margin));
        popover.style.left = Math.round(left) + "px";
        popover.style.top = Math.round(top) + "px";
      }

      function parseDatePickerValue(value) {
        var normalized = normalizeDateString(value);
        var parts;
        if (!normalized) {
          return null;
        }
        parts = normalized.split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function formatDatePickerValue(date) {
        return date.getFullYear() + "-" + padDatePart(date.getMonth() + 1) + "-" + padDatePart(date.getDate());
      }

      function padDatePart(value) {
        return String(value).padStart(2, "0");
      }

      function normalizeDateString(value) {
        if (value === null || value === undefined || value === "") {
          return null;
        }
        var text = String(value).trim();
        var match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!match) {
          return null;
        }
        var year = Number(match[1]);
        var month = Number(match[2]);
        var day = Number(match[3]);
        var date = new Date(year, month - 1, day);
        if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
          return null;
        }
        return match[1] + "-" + match[2] + "-" + match[3];
      }

      function normalizeScheduleStatus(value) {
        if (value === null || value === undefined || value === "") {
          return null;
        }
        var status = String(value).trim().toLowerCase();
        if (status === "todo" || status === "to-do" || status === "pending" || status === "할일") {
          return "todo";
        }
        if (status === "progress" || status === "in-progress" || status === "doing" || status === "진행") {
          return "progress";
        }
        if (status === "done" || status === "complete" || status === "completed" || status === "완료") {
          return "done";
        }
        return null;
      }

      function normalizeBoolean(value) {
        if (typeof value === "string") {
          return value.trim().toLowerCase() === "true";
        }
        return value === true;
      }

      function getScheduleStatusLabel(status) {
        var safeStatus = normalizeScheduleStatus(status);
        if (safeStatus === "todo") {
          return "할일";
        }
        if (safeStatus === "progress") {
          return "진행";
        }
        if (safeStatus === "done") {
          return "완료";
        }
        return "미정";
      }

      function getLocalDateTime(dateString) {
        var parts = String(dateString || "").split("-").map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]).getTime();
      }

      function getTodayTime() {

      function normalizeInlineTitle(value) {

        if (!title || title.contentEditable === "false") {

      function selectNodeText(node) {
        var selection = window.getSelection && window.getSelection();
        if (!selection || !document.createRange) {
          return;

        var range = document.createRange();
        range.selectNodeContents(node);

      function applyBlockVisual(card, block) {
        var color = getBlockColor(block);
        var blockType = normalizeBlockType(block.type);
        var isMain = blockType === "main";
        var isMiddle = blockType === "middle";
        var isGroup = blockType === "group";
        var ink = (isMain || isGroup) ? getReadableTextColor(color) : "var(--ink)";
        var muted = isMain ? (ink === "#ffffff" ? "rgba(255,255,255,0.78)" : "rgba(40,39,33,0.68)") : "#777268";

        card.classList.toggle("is-main", isMain);

      function getBlockColor(block) {
        return getDiagramBlockColor(store.data, block);
      }

      function getDiagramBlockColor(diagram, block) {
        var linkedMainColor = shouldInheritBlockColor(diagram, block) ? getLinkedMainBlockColor(diagram, block) : "";
        if (linkedMainColor) {
          return linkedMainColor;
        }
        return getOwnBlockColor(diagram, block);
      }

      function shouldInheritBlockColor(diagram, block) {
        var type = normalizeBlockType(block && block.type);
        return Boolean(block && type !== "main" && type !== "group" && normalizeBlockColorInheritance(block));
      }

      function normalizeBlockColorInheritance(block) {
        var type = normalizeBlockType(block && block.type);
        if (!block || type === "main" || type === "group") {
          return false;
        }
        return block.inheritColor !== false;
      }

      function getOwnBlockColor(diagram, block) {
        if (block && validColor(block.color)) {
          return block.color;
        }
        return getCategoryColorFromMap(diagram && diagram.categories, block && block.category);
      }

      function getLinkedMainBlockColor(diagram, block) {
        var mainBlock = findLinkedMainBlock(diagram, block);
        return mainBlock ? getOwnBlockColor(diagram, mainBlock) : "";
      }

      function findLinkedMainBlock(diagram, block) {
        if (!diagram || !block || !block.id || normalizeBlockType(block.type) === "main") {
          return null;
        }
        var blockMap = new Map((diagram.blocks || []).map(function (item) {
          return [item.id, item];
        }));
        var directMain = findAdjacentMainBlock(diagram, block.id, blockMap);
        if (directMain) {
          return directMain;
        }
        return findNearestMainBlock(diagram, block.id, blockMap);
      }

      function findAdjacentMainBlock(diagram, blockId, blockMap) {
        var connections = diagram.connections || [];
        for (var index = 0; index < connections.length; index += 1) {
          var connection = connections[index];
          var nextId = "";
          if (connection.from === blockId) {
            nextId = connection.to;
          } else if (connection.to === blockId) {
            nextId = connection.from;
          }
          if (!nextId) {
            continue;
          }
          var nextBlock = blockMap.get(nextId);
          if (nextBlock && normalizeBlockType(nextBlock.type) === "main") {
            return nextBlock;
          }
        }
        return null;
      }

      function findNearestMainBlock(diagram, blockId, blockMap) {
        var visited = new Set([blockId]);
        var queue = [blockId];
        var connections = diagram.connections || [];

        while (queue.length) {
          var currentId = queue.shift();
          for (var index = 0; index < connections.length; index += 1) {
            var connection = connections[index];
            var nextId = "";
            if (connection.from === currentId) {
              nextId = connection.to;
            } else if (connection.to === currentId) {
              nextId = connection.from;
            }
            if (!nextId || visited.has(nextId)) {
              continue;
            }
            visited.add(nextId);
            var nextBlock = blockMap.get(nextId);
            if (!nextBlock) {
              continue;
            }
            if (normalizeBlockType(nextBlock.type) === "main") {
              return nextBlock;
            }
            queue.push(nextId);
          }
        }
        return null;
      }

      function getCommonBlockColor(blocks) {
        var firstColor = "";
        var isSame = true;
        blocks.forEach(function (block, index) {
          var color = getBlockColor(block).toUpperCase();
          if (index === 0) {

      function getCommonBlockType(blocks) {

          if (index === 0) {
