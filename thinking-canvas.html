<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생각블록 캔버스</title>
  <style>
:root {
      --bg: #0f1115;
      --panel: #1c2129;
      --ink: #e8ebf0;
      --muted: rgba(255,255,255,0.5);
      --line: rgba(255,255,255,0.10);
      --accent: #3DDC97;
      --accent-ink: #0f1115;
      --danger: #ef5350;
      --fallback: #6b7280;
      --shadow: 0 8px 24px rgba(0,0,0,0.45);
      --grid-size: 48px;
      --grid-x: 0px;
      --grid-y: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: var(--bg);
      font-family: "Pretendard", "Pretendard Variable", "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    .toolbar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 64px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(22, 25, 31, 0.92);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .brand {
      min-width: 210px;
      margin-right: auto;
      overflow: hidden;
    }

    .brand strong,
    .brand span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand strong {
      color: var(--ink);
      font-size: 17px;
      line-height: 1.2;
    }

    .brand span {
      max-width: 42vw;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .toolbar-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      white-space: nowrap;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .toolbar-button.icon-button {
      width: 40px;
      min-width: 40px;
      padding: 0;
    }

    .toolbar-button .align-icon {
      width: 22px;
      height: 22px;
      display: block;
    }

    .toolbar-button:hover {
      border-color: rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.06);
    }

    .toolbar-button.is-active {
      border-color: transparent;
      color: var(--accent-ink);
      background: var(--accent);
    }

    .toolbar-button:active {
      transform: translateY(1px);
    }

    .toolbar-button.primary {
      border-color: transparent;
      color: var(--accent-ink);
      background: var(--accent);
    }

    .toolbar-button.primary:hover {
      background: #34c489;
    }

    .toolbar-button.danger {
      border-color: rgba(239,83,80,0.5);
      color: #ef5350;
      background: transparent;
    }

    .toolbar-button.danger:hover {
      color: #fff;
      background: var(--danger);
    }

    .canvas-viewport {
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      background-color: #13161c;
      background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
      background-position: var(--grid-x) var(--grid-y);
      background-size: var(--grid-size) var(--grid-size);
    }

    .canvas-viewport.is-panning {
      cursor: grabbing;
    }

    .canvas-viewport.is-selecting {
      cursor: crosshair;
    }

    .world {
      position: absolute;
      left: 0;
      top: 0;
      width: 6000px;
      height: 4000px;
      transform-origin: 0 0;
    }

    .connections-layer,
    .blocks-layer {
      position: absolute;
      left: 0;
      top: 0;
      width: 6000px;
      height: 4000px;
    }

    .blocks-layer {
      pointer-events: none;
    }

    .connections-layer {
      overflow: visible;
      pointer-events: none;
    }

    .connection-visible {
      fill: none;
      stroke: #5b6472;
      stroke-width: 2.2;
      stroke-linecap: round;
      opacity: 0.85;
      pointer-events: none;
    }

    .connection-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      stroke-linecap: round;
      pointer-events: stroke;
      cursor: pointer;
    }

    .connection-hit:hover + .connection-visible,
    .connection-hit:focus + .connection-visible {
      stroke: var(--accent);
      opacity: 1;
    }

    .connection-visible.is-selected {
      stroke: var(--accent);
      stroke-width: 4;
      opacity: 1;
    }

    .connection-label-box {
      overflow: visible;
      cursor: pointer;
      pointer-events: auto;
    }

    .connection-label {
      max-width: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      background: rgba(28,33,41,0.92);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    }

    .connection-label.is-input {
      border-color: rgba(255,83,96,0.72);
      background: rgba(92,26,35,0.94);
      color: #ffe5e8;
    }

    .connection-label.is-output {
      border-color: rgba(58,134,255,0.72);
      background: rgba(20,45,92,0.94);
      color: #e6f0ff;
    }

    .connection-io-badge {
      flex: 0 0 auto;
      padding: 2px 5px;
      border-radius: 999px;
      color: #ffffff;
      font-size: 9px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .connection-label.is-input .connection-io-badge {
      background: #ff5360;
    }

    .connection-label.is-output .connection-io-badge {
      background: #3a86ff;
    }

    .connection-label-text {
      min-width: 0;
      overflow: visible;
      text-overflow: clip;
      white-space: nowrap;
    }

    .connection-label-shell {
      width: 100%;
      display: grid;
      justify-items: center;
      gap: 6px;
      overflow: visible;
    }

    .connection-label-actions {
      display: flex;
      justify-content: center;
      gap: 6px;
      pointer-events: auto;
    }

    .connection-label-action-button {
      min-width: 62px;
      height: 24px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(15,17,21,0.86);
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .connection-label-action-button:hover {
      border-color: var(--accent);
      background: rgba(61,220,151,0.16);
    }

    .connection-label-action-button[data-io="input"].is-selected {
      border-color: transparent;
      color: #ffffff;
      background: #ff5360;
    }

    .connection-label-action-button[data-io="output"].is-selected {
      border-color: transparent;
      color: #ffffff;
      background: #3a86ff;
    }

    .connection-label-box.is-selected .connection-label {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61,220,151,0.22), 0 6px 16px rgba(0,0,0,0.28);
    }

    .connection-label-box.is-drop-target .connection-label {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,220,151,0.28), 0 8px 20px rgba(0,0,0,0.36);
    }

    .draft-connection {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.8;
      stroke-dasharray: 8 7;
      stroke-linecap: round;
      opacity: 0;
      pointer-events: none;
    }

    .draft-connection.is-active {
      opacity: 0.9;
    }

    .block-card {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      min-width: 160px;
      width: var(--card-width, 200px);
      max-width: none;
      height: 62px;
      border: 1px solid rgba(255,255,255,0.16);
      border-left: 8px solid var(--block-color, var(--fallback));
      border-radius: 8px;
      background: #252b35;
      color: var(--block-ink, var(--ink));
      box-shadow: 0 8px 24px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: visible;
      pointer-events: auto;
      cursor: move;
      user-select: none;
      transition: box-shadow 120ms ease, transform 20ms linear;
    }

    .block-card.is-main {
      height: 86px;
      border: 1px solid rgba(255,255,255,0.18);
      border-left-width: 1px;
      background: var(--block-color, var(--fallback));
    }

    .block-card.is-middle {
      height: 74px;
      border: 3px solid var(--block-color, var(--fallback));
      border-left-width: 9px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)),
        #252b35;
      box-shadow: 0 10px 28px rgba(0,0,0,0.48), inset 0 1px 0 rgba(255,255,255,0.07), 0 0 0 1px rgba(255,255,255,0.08);
    }

    .block-card.is-dragging {
      box-shadow: 0 16px 36px rgba(0,0,0,0.55);
      z-index: 4;
    }

    .block-card.is-selected {
      outline: 3px solid rgba(61,220,151,0.6);
      outline-offset: 4px;
      z-index: 3;
    }

    .block-card.is-drop-target {
      outline: 3px solid rgba(61,220,151,0.6);
      outline-offset: 4px;
    }

    .block-card.is-inner-drop-target {
      outline: 4px solid rgba(61,220,151,0.95);
      outline-offset: 7px;
      box-shadow:
        0 0 0 9px rgba(61,220,151,0.16),
        0 18px 44px rgba(0,0,0,0.58),
        inset 0 1px 0 rgba(255,255,255,0.12);
      z-index: 6;
    }

    .block-card.is-inner-drop-target::before {
      content: "";
      position: absolute;
      inset: -8px;
      border: 1px dashed rgba(61,220,151,0.92);
      border-radius: 14px;
      background: rgba(61,220,151,0.11);
      pointer-events: none;
    }

    .block-card.is-inner-drop-target::after {
      content: attr(data-drop-label);
      position: absolute;
      left: 50%;
      top: -36px;
      z-index: 8;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 104px;
      min-height: 28px;
      padding: 0 12px;
      border: 1px solid rgba(61,220,151,0.95);
      border-radius: 999px;
      color: var(--accent-ink);
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(0,0,0,0.38);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .selection-box {
      position: absolute;
      z-index: 4;
      display: none;
      border: 1px solid rgba(61,220,151,0.95);
      border-radius: 4px;
      background: rgba(61,220,151,0.12);
      pointer-events: none;
    }

    .selection-box.is-visible {
      display: block;
    }

    .block-top {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 7px 18px 7px 10px;
      cursor: move;
    }

    .block-card.is-main .block-top {
      align-items: center;
      gap: 4px;
      padding: 10px 16px;
      text-align: center;
    }

    .block-title {
      min-width: 0;
      overflow: visible;
      text-overflow: clip;
      white-space: nowrap;
      font-weight: 700;
      color: var(--block-ink, var(--ink));
      font-size: 14px;
      line-height: 1.25;
    }

    .block-card.is-main .block-title {
      width: 100%;
      font-size: 26px;
      line-height: 1.05;
      text-align: center;
    }

    .block-card.is-middle .block-title {
      font-size: 18px;
      line-height: 1.14;
    }

    .block-title[contenteditable] {
      min-width: 44px;
      padding: 2px 4px;
      border-radius: 5px;
      cursor: text;
      outline: 2px solid transparent;
    }

    .block-title[contenteditable]:focus {
      background: rgba(255,255,255,0.08);
      outline-color: rgba(61,220,151,0.6);
    }

    .block-summary {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--block-muted, rgba(255,255,255,0.58));
      font-size: 12px;
      line-height: 1.25;
    }

    .block-card:not(.is-main) .block-summary {
      color: rgba(255,255,255,0.58);
    }

    .block-card.is-main .block-summary {
      width: 100%;
      text-align: center;
    }

    .block-card.is-middle .block-summary {
      color: rgba(255,255,255,0.68);
    }

    .block-link-button {
      position: absolute;
      right: 8px;
      top: 8px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 7px;
      background: rgba(15,17,21,0.72);
      font-size: 13px;
      line-height: 1;
      pointer-events: auto;
    }

    .block-inner-button {
      position: absolute;
      right: 8px;
      top: 8px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 7px;
      background: rgba(15,17,21,0.72);
      color: inherit;
      font-size: 13px;
      line-height: 1;
      pointer-events: auto;
    }

    .block-card.has-link .block-inner-button {
      right: 40px;
    }

    .block-link-button:hover {
      border-color: var(--accent);
      background: rgba(61,220,151,0.16);
    }

    .block-inner-button:hover {
      border-color: var(--accent);
      background: rgba(61,220,151,0.16);
    }

    .block-card.has-link .block-top {
      padding-right: 44px;
    }

    .block-card.has-inner .block-top {
      padding-right: 44px;
    }

    .block-card.has-link.has-inner .block-top {
      padding-right: 76px;
    }

    .block-quick-actions {
      position: absolute;
      right: 8px;
      top: -44px;
      display: inline-flex;
      gap: 7px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(28,33,41,0.96);
      box-shadow: var(--shadow);
      pointer-events: auto;
    }

    .block-action-button {
      min-width: 56px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .block-action-button:hover {
      background: rgba(255,255,255,0.06);
    }

    .block-action-button.primary {
      border-color: transparent;
      color: var(--accent-ink);
      background: var(--accent);
    }

    .block-action-button.primary:hover {
      background: #34c489;
    }

    .block-action-button.danger {
      border-color: rgba(239,83,80,0.5);
      color: #ef5350;
      background: transparent;
    }

    .block-action-button.danger:hover {
      color: #fff;
      background: var(--danger);
    }

    .block-create-menu {
      position: absolute;
      right: -188px;
      top: 50%;
      z-index: 5;
      display: inline-flex;
      gap: 7px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(28,33,41,0.96);
      box-shadow: var(--shadow);
      pointer-events: auto;
      transform: translateY(-50%);
    }

    .block-type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 9px;
      background: transparent;
    }

    .block-type-button {
      min-height: 42px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
      font-weight: 700;
    }

    .block-type-button:hover {
      background: rgba(255,255,255,0.06);
    }

    .block-type-button.is-selected {
      border-color: transparent;
      color: var(--accent-ink);
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,220,151,0.18);
    }

    .connection-io-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 9px;
      background: transparent;
    }

    .connection-io-button {
      min-height: 40px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 7px;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
      font-weight: 800;
    }

    .connection-io-button:hover {
      background: rgba(255,255,255,0.06);
    }

    .connection-io-button.is-selected {
      border-color: transparent;
      color: var(--accent-ink);
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,220,151,0.18);
    }

    .connection-io-button[data-io="input"].is-selected {
      color: #ffffff;
      background: #ff5360;
      box-shadow: 0 0 0 3px rgba(255,83,96,0.24);
    }

    .connection-io-button[data-io="output"].is-selected {
      color: #ffffff;
      background: #3a86ff;
      box-shadow: 0 0 0 3px rgba(58,134,255,0.24);
    }

    .color-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    .color-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 40px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
    }

    .color-chip {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      background: var(--chip-color, var(--fallback));
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.42);
      cursor: pointer;
    }

    .color-chip:hover {
      transform: translateY(-1px);
    }

    .color-chip.is-selected {
      border-color: #fff;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.72), 0 0 0 3px rgba(61,220,151,0.35);
    }

    .color-value {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
    }

    .color-inherit-button.is-active {
      border-color: transparent;
      color: var(--accent-ink);
      background: var(--accent);
    }

    .connect-handle {
      position: absolute;
      right: -9px;
      top: 50%;
      width: 16px;
      height: 16px;
      border: 3px solid var(--panel);
      border-radius: 50%;
      background: var(--category-color, var(--fallback));
      box-shadow: 0 2px 7px rgba(0,0,0,0.42);
      cursor: crosshair;
      transform: translateY(-50%);
    }

    .connect-handle:hover {
      transform: translateY(-50%) scale(1.12);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,0.6);
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal-panel {
      width: min(760px, 100%);
      max-height: min(82vh, 760px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .link-modal-panel {
      width: min(1120px, 100%);
      max-height: min(88vh, 860px);
    }

    #editModal .modal-panel {
      max-height: min(94vh, 920px);
    }

    .modal-header,
    .modal-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 15px;
    }

    .modal-header {
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .modal-header h2 {
      margin: 0;
      color: var(--ink);
      font-size: 17px;
      line-height: 1.2;
    }

    .modal-body {
      display: grid;
      gap: 10px;
      min-height: 0;
      padding: 15px;
    }

    #editModal .modal-body {
      overflow-y: auto;
    }

    .modal-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
    }

    .field {
      display: grid;
      gap: 6px;
      min-height: 0;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .subtitle-field {
      min-height: max-content;
      height: max-content;
      grid-template-rows: auto auto max-content;
    }

    .subtitle-tags {
      box-sizing: border-box;
      min-height: 34px;
      height: max-content;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: flex-start;
      overflow: visible;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      background: rgba(255,255,255,0.035);
    }

    .subtitle-tag-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(15,17,21,0.72);
    }

    .subtitle-tag-pill.is-active {
      border-color: transparent;
      color: var(--accent-ink);
      background: var(--accent);
    }

    .subtitle-tag-button {
      flex: 0 0 auto;
      min-height: 26px;
      padding: 4px 8px 4px 10px;
      border: 0;
      color: inherit;
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
    }

    .subtitle-tag-delete-button {
      flex: 0 0 auto;
      width: 24px;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-left: 1px solid rgba(255,255,255,0.12);
      color: inherit;
      background: transparent;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }

    .subtitle-tag-pill:not(.is-active):hover,
    .subtitle-tag-pill:not(.is-active):focus-within {
      border-color: var(--accent);
      background: rgba(61,220,151,0.14);
    }

    .subtitle-tag-pill.is-active .subtitle-tag-delete-button {
      border-left-color: rgba(0,0,0,0.16);
    }

    .subtitle-tag-delete-button:hover {
      background: rgba(0,0,0,0.16);
    }

    .json-file-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255,255,255,0.04);
    }

    .json-file-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .json-file-input {
      min-width: 0;
      color: var(--ink);
      font-size: 13px;
    }

    .text-input,
    .text-area {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      background: #13161c;
      outline: none;
    }

    .text-input:focus,
    .text-area:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,220,151,0.18);
    }

    .text-input {
      min-height: 38px;
      padding: 8px 10px;
    }

    .text-area {
      min-height: 280px;
      resize: vertical;
      padding: 10px;
      line-height: 1.5;
      white-space: pre;
    }

    .text-area.is-drop-target {
      border-color: var(--accent);
      background: #13161c;
      box-shadow: inset 0 0 0 3px rgba(61,220,151,0.18);
    }

    .image-drop-zone {
      display: grid;
      gap: 4px;
      min-height: 86px;
      place-items: center;
      padding: 14px;
      border: 1px dashed rgba(255,255,255,0.22);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255,255,255,0.035);
      text-align: center;
      outline: none;
    }

    .image-drop-zone strong {
      color: var(--ink);
      font-size: 14px;
    }

    .image-drop-zone span {
      font-size: 12px;
      line-height: 1.4;
    }

    .image-drop-zone.is-drop-target,
    .image-drop-zone:focus {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 3px rgba(61,220,151,0.16);
    }

    .image-file-input {
      max-width: 100%;
      color: var(--muted);
      font-size: 12px;
    }

    .image-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 8px;
      min-height: 0;
    }

    .image-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      background: rgba(15,17,21,0.75);
      cursor: zoom-in;
    }

    .image-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,220,151,0.14);
    }

    .image-card img {
      width: 100%;
      height: 94px;
      display: block;
      object-fit: cover;
      background: #0f1115;
    }

    .image-card button {
      position: absolute;
      right: 6px;
      top: 6px;
      min-width: 28px;
      height: 28px;
      border: 1px solid rgba(239,83,80,0.55);
      border-radius: 7px;
      color: #fff;
      background: rgba(239,83,80,0.88);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .image-card-name {
      overflow: hidden;
      padding: 7px 8px;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .image-preview-panel {
      width: min(1120px, 100%);
      max-height: min(90vh, 900px);
    }

    .image-preview-body {
      min-height: min(66vh, 640px);
      padding: 14px;
      background: #0f1115;
    }

    .image-preview-frame {
      min-height: min(62vh, 600px);
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b0d12;
    }

    .image-preview-frame img {
      max-width: 100%;
      max-height: min(72vh, 720px);
      display: block;
      object-fit: contain;
    }

    .image-preview-name {
      margin-top: 10px;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .inner-diagram-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .inner-diagram-summary {
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .inner-diagram-panel {
      width: min(94vw, 1120px);
      height: min(90vh, 780px);
    }

    .inner-block-edit-panel {
      width: min(92vw, 520px);
    }

    .inner-diagram-body {
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
    }

    .inner-diagram-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .inner-color-field {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .inner-diagram-stage {
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #11151b;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .inner-diagram-world {
      position: relative;
      width: 1800px;
      height: 1000px;
    }

    .inner-connection-layer {
      position: absolute;
      inset: 0;
      width: 1800px;
      height: 1000px;
      overflow: visible;
      pointer-events: none;
    }

    .inner-connection-visible {
      fill: none;
      stroke: rgba(130,145,166,0.82);
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .inner-block {
      position: absolute;
      box-sizing: border-box;
      width: 170px;
      min-height: 56px;
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.16);
      border-left: 7px solid var(--inner-color);
      border-radius: 8px;
      background: #252b35;
      color: var(--ink);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      cursor: grab;
      user-select: none;
    }

    .inner-block.is-selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(61,220,151,0.34), 0 8px 20px rgba(0,0,0,0.35);
    }

    .inner-block-title {
      overflow: hidden;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #jsonText {
      min-height: min(56vh, 520px);
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
    }

    .link-modal-body {
      grid-template-rows: auto minmax(0, 1fr);
      min-height: min(64vh, 620px);
    }

    .link-preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
    }

    .link-preview-type {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-preview-shell {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f1115;
    }

    .link-preview-shell iframe,
    .link-preview-shell img,
    .link-preview-shell video {
      width: 100%;
      height: 100%;
      min-height: min(58vh, 560px);
      display: block;
      border: 0;
      background: #0f1115;
    }

    .link-preview-shell img {
      object-fit: contain;
      padding: 14px;
    }

    .link-preview-shell video {
      object-fit: contain;
    }

    .link-preview-note {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(15,17,21,0.82);
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }

    .modal-message {
      min-height: 18px;
      color: #ef9a9a;
      font-size: 13px;
    }

    .modal-message.is-success {
      color: var(--accent);
    }

    .modal-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .modal-button:hover {
      background: rgba(255,255,255,0.06);
    }

    .modal-button.primary {
      border-color: transparent;
      color: var(--accent-ink);
      background: var(--accent);
    }

    .modal-button.primary:hover {
      background: #34c489;
    }

    .modal-button.danger {
      margin-right: auto;
      border-color: rgba(239,83,80,0.5);
      color: #ef5350;
      background: transparent;
    }

    .modal-button.danger:hover {
      color: #fff;
      background: var(--danger);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 20;
      min-width: 180px;
      max-width: min(460px, calc(100vw - 36px));
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(28,33,41,0.96);
      box-shadow: var(--shadow);
      text-align: center;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.is-visible {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    @media (max-width: 760px) {
      .toolbar {
        flex-wrap: wrap;
        align-content: center;
        min-height: 106px;
      }

      .brand {
        flex-basis: 100%;
        min-width: 0;
      }

      .brand span {
        max-width: 100%;
      }

      .toolbar-button {
        flex: 1 1 auto;
        min-width: 104px;
        padding: 0 9px;
      }

      .toolbar-button.icon-button {
        flex: 0 0 40px;
        min-width: 40px;
        padding: 0;
      }

      .modal-backdrop {
        padding: 12px;
      }
    }

  </style>
</head>
<body>
  <div class="app-shell">
    <header class="toolbar">
      <div class="brand">
        <strong>생각블록 캔버스</strong>
        <span id="documentTitle">새 문서</span>
      </div>
      <button class="toolbar-button" id="importButton" type="button">JSON 불러오기</button>
      <button class="toolbar-button" id="exportButton" type="button">JSON 내보내기</button>
      <button class="toolbar-button primary" id="addBlockButton" type="button">+ 새 블록</button>
      <button class="toolbar-button icon-button" id="arrangeButton" type="button" title="자동정렬" aria-label="자동정렬">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"></rect>
          <rect x="14" y="5" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"></rect>
          <rect x="5" y="15" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"></rect>
          <rect x="15" y="14" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"></rect>
          <path d="M10 7h4M17 10v4M11 17h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
        </svg>
      </button>
      <button class="toolbar-button icon-button" id="alignLeftButton" type="button" title="선택 블록 왼쪽 맞춤" aria-label="선택 블록 왼쪽 맞춤">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 4v16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          <rect x="9" y="5" width="9" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <rect x="9" y="11" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <rect x="9" y="17" width="7" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
        </svg>
      </button>
      <button class="toolbar-button icon-button" id="alignCenterButton" type="button" title="선택 블록 중심선 정렬" aria-label="선택 블록 중심선 정렬">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4v16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          <rect x="5" y="5" width="14" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <rect x="7" y="14" width="10" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
        </svg>
      </button>
      <button class="toolbar-button icon-button" id="alignHorizontalCenterButton" type="button" title="선택 블록 가로축 중심정렬" aria-label="선택 블록 가로축 중심정렬">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12h16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
          <rect x="5" y="5" width="8" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <rect x="11" y="14" width="8" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <path d="M9 10v4M15 10v4" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"></path>
        </svg>
      </button>
      <button class="toolbar-button icon-button" id="alignBottomButton" type="button" title="선택 블록 아래쪽 맞춤" aria-label="선택 블록 아래쪽 맞춤">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 19h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          <rect x="5" y="7" width="4" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <rect x="11" y="10" width="4" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
          <rect x="17" y="5" width="4" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
        </svg>
      </button>
      <button class="toolbar-button icon-button" id="distributeHorizontalButton" type="button" title="선택 블록 가로 간격 균등" aria-label="선택 블록 가로 간격 균등">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5v14M20 5v14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          <rect x="6" y="9" width="3" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
          <rect x="11" y="9" width="3" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
          <rect x="16" y="9" width="3" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
        </svg>
      </button>
      <button class="toolbar-button icon-button" id="distributeVerticalButton" type="button" title="선택 블록 세로 간격 균등" aria-label="선택 블록 세로 간격 균등">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14M5 20h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          <rect x="9" y="6" width="6" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
          <rect x="9" y="11" width="6" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
          <rect x="9" y="16" width="6" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
        </svg>
      </button>
      <button class="toolbar-button icon-button" id="connectionStraightButton" type="button" title="연결선 직선" aria-label="연결선 직선">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 7h8v10h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
          <circle cx="5" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
          <circle cx="19" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
        </svg>
      </button>
      <button class="toolbar-button icon-button" id="connectionCurveButton" type="button" title="연결선 곡선" aria-label="연결선 곡선">
        <svg class="align-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 17c5-12 9 12 14 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path>
          <circle cx="5" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
          <circle cx="19" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
        </svg>
      </button>
      <button class="toolbar-button" id="saveButton" type="button">저장</button>
      <button class="toolbar-button danger" id="clearButton" type="button">전체 삭제</button>
    </header>

    <main class="canvas-viewport" id="canvasViewport" aria-label="생각블록 작업 캔버스">
      <div class="world" id="world">
        <svg class="connections-layer" id="connectionsLayer" viewBox="0 0 6000 4000" aria-hidden="true">
          <g id="connectionGroup"></g>
          <path class="draft-connection" id="draftConnection"></path>
        </svg>
        <div class="blocks-layer" id="blocksLayer"></div>
      </div>
      <div class="selection-box" id="selectionBox" aria-hidden="true"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="jsonModal" role="dialog" aria-modal="true" aria-labelledby="jsonModalTitle">
    <section class="modal-panel">
      <header class="modal-header">
        <h2 id="jsonModalTitle">JSON</h2>
        <button class="modal-button" id="closeJsonButton" type="button">닫기</button>
      </header>
      <div class="modal-body">
        <div class="json-file-row" id="jsonFileRow">
          <label class="json-file-label" for="jsonFile">JSON 파일 선택</label>
          <input class="json-file-input" id="jsonFile" type="file" accept=".json,.txt,application/json,text/plain">
        </div>
        <textarea class="text-area" id="jsonText" spellcheck="false"></textarea>
        <div class="modal-message" id="jsonMessage" aria-live="polite"></div>
      </div>
      <footer class="modal-footer">
        <button class="modal-button" id="copyJsonButton" type="button">복사</button>
        <button class="modal-button primary" id="applyJsonButton" type="button">적용</button>
      </footer>
    </section>
  </div>

  <div class="modal-backdrop" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <section class="modal-panel">
      <header class="modal-header">
        <h2 id="editModalTitle">블록 편집</h2>
        <button class="modal-button" id="cancelEditTopButton" type="button">닫기</button>
      </header>

      function createEmptyDiagram() {
        return {
          title: "생각블록 캔버스",
          categories: {},
          connectionStyle: CONNECTION_STYLE_DEFAULT,
          blocks: [],
          connections: []
        };
      }

      function loadSavedDiagram() {
        var scopedSaved = readLocalDiagramRecord(getScopedStorageKey());
        var embedded = readEmbeddedDiagramRecord();
        if (embedded && (!scopedSaved || embedded.savedAt >= scopedSaved.savedAt)) {
          store.data = embedded.data;
          saveLocalState(embedded.data, embedded.savedAt);
          showToast("저장된 상태를 복원했습니다.");
          return;
        }

        if (scopedSaved) {
          store.data = scopedSaved.data;
          showToast("저장된 상태를 복원했습니다.");
          return;
        }

        var legacySaved = readLocalDiagramRecord(STORAGE_KEY);
        if (legacySaved) {
          store.data = legacySaved.data;
          saveLocalState(legacySaved.data, legacySaved.savedAt);
          showToast("저장된 상태를 복원했습니다.");
        }
      }

      function readLocalDiagramRecord(key) {
        var saved = localStorage.getItem(key);
        if (!saved) {
          return null;
        }
        try {
          return createDiagramRecord(JSON.parse(saved), 0);
        } catch (error) {
          console.warn("Saved diagram could not be restored.", error);
          return null;
        }
      }

      function readEmbeddedDiagramRecord() {
        var node = document.getElementById("thinking-canvas-saved-state");
        if (!node) {
          return null;
        }
        try {
          return createDiagramRecord(JSON.parse(node.textContent || ""), 0);
        } catch (error) {
          console.warn("Embedded diagram could not be restored.", error);
          return null;
        }
      }

      function createDiagramRecord(raw, fallbackSavedAt) {
        var source = raw && raw.data ? raw.data : raw;
        var savedAt = raw && Number.isFinite(raw.savedAt) ? raw.savedAt : fallbackSavedAt;
        return {
          data: normalizeDiagram(source),
          savedAt: savedAt
        };
      }

      async function saveDiagram() {
        var data = getExportData();
        saveLocalState(data);
        var saved = await saveTextFile(createFileName(data.title, "html"), createStandaloneHtml(data), "text/html;charset=utf-8", "HTML 문서", "html");
        if (saved) {
          showToast("HTML 파일로 저장했습니다.");
        }
      }

      function saveLocalState(data, savedAt) {
        try {
          localStorage.setItem(getScopedStorageKey(), JSON.stringify({
            savedAt: Number.isFinite(savedAt) ? savedAt : Date.now(),
            data: data || getExportData()
          }));
        } catch (error) {
          console.warn("Diagram could not be saved locally.", error);
        }
      }

      function createUndoSnapshot() {
        return {
          data: getExportData(),
          view: {
            panX: store.view.panX,
            panY: store.view.panY,
            scale: store.view.scale
          },
          selectedBlockId: store.selectedBlockId,
          selectedBlockIds: store.selectedBlockIds.slice(),
          selectedConnectionKeys: store.selectedConnectionKeys.slice()
        };
      }

      function pushUndoSnapshot(snapshot) {
        if (!snapshot) {
          return;
        }
        var latest = store.undoStack[store.undoStack.length - 1];
        if (latest && diagramDataEquals(latest.data, snapshot.data)) {
          return;
        }
        store.undoStack.push(snapshot);
        if (store.undoStack.length > UNDO_LIMIT) {
          store.undoStack.shift();
        }
      }

      function undoLastAction() {
        var snapshot = store.undoStack.pop();
        if (!snapshot) {
          showToast("되돌릴 작업이 없습니다.");
          return;
        }
        store.data = normalizeDiagram(snapshot.data);
        store.view.panX = finiteNumber(snapshot.view && snapshot.view.panX) ? snapshot.view.panX : 72;
        store.view.panY = finiteNumber(snapshot.view && snapshot.view.panY) ? snapshot.view.panY : 64;
        store.view.scale = finiteNumber(snapshot.view && snapshot.view.scale) ? snapshot.view.scale : 1;
        store.drag = null;
        store.connect = null;
        store.marquee = null;
        store.handlePress = null;
        store.editBlockId = null;
        store.focusTitleBlockId = null;
        store.createMenuBlockId = null;
        setSelection(snapshot.selectedBlockIds || []);
        if (snapshot.selectedBlockId && isBlockSelected(snapshot.selectedBlockId)) {
          store.selectedBlockId = snapshot.selectedBlockId;
        }
        setConnectionSelection(snapshot.selectedConnectionKeys || []);
        closeTransientUi();
        updateTransform();
        renderAll();
        saveLocalState();
        showToast("이전 작업으로 되돌렸습니다.");
      }

      function closeTransientUi() {
        if (els.jsonModal) {
          els.jsonModal.classList.remove("is-open");
        }
        if (els.editModal) {
          els.editModal.classList.remove("is-open");
        }
        if (els.linkModal) {
          closeLinkModal();
        }
        if (els.imagePreviewModal) {
          closeImagePreviewModal();
        }
        if (els.innerDiagramModal) {
          closeInnerDiagramModal();
        }
        if (els.connectionEditModal) {
          closeConnectionEditModal();
        }
        if (els.draftConnection) {
          els.draftConnection.classList.remove("is-active");
          els.draftConnection.setAttribute("d", "");
        }
        if (els.viewport) {
          els.viewport.classList.remove("is-panning", "is-selecting");
        }
        hideSelectionBox();
        clearDropTargets();
      }

      function diagramDataEquals(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
      }

      function scheduleLocalSave() {
        if (store.autoSaveTimer) {
          window.clearTimeout(store.autoSaveTimer);
        }
        store.autoSaveTimer = window.setTimeout(function () {
          store.autoSaveTimer = 0;
          saveLocalState();
        }, AUTO_SAVE_DELAY);
      }

      function clearLocalState() {
        if (store.autoSaveTimer) {
          window.clearTimeout(store.autoSaveTimer);
          store.autoSaveTimer = 0;
        }
        localStorage.removeItem(getScopedStorageKey());
        localStorage.removeItem(STORAGE_KEY);
      }

      function getScopedStorageKey() {
        var path = window.location && window.location.pathname ? window.location.pathname : "default";
        return STORAGE_KEY + ":" + path;
      }

      function clearCanvas() {
        if (!confirm("현재 캔버스의 모든 블록과 연결선을 삭제할까요?")) {
          return;
        }

      function openJsonModal(mode) {

      function handleJsonFileSelect(event) {
        var file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }
        loadJsonFileToTextArea(file);
      }

      function handleJsonDragEnter(event) {
        if (!isImportMode() || !hasDroppedFiles(event)) {
          return;
        }
        event.preventDefault();
        els.jsonText.classList.add("is-drop-target");
      }

      function handleJsonDragOver(event) {
        if (!isImportMode() || !hasDroppedFiles(event)) {
          return;
        }
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
        els.jsonText.classList.add("is-drop-target");
      }

      function handleJsonDragLeave(event) {
        if (!els.jsonText.contains(event.relatedTarget)) {
          els.jsonText.classList.remove("is-drop-target");
        }
      }

      function handleJsonDrop(event) {
        if (!isImportMode()) {
          return;
        }
        event.preventDefault();
        els.jsonText.classList.remove("is-drop-target");
        var file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        if (!file) {
          return;
        }
        loadJsonFileToTextArea(file);
      }

      function loadJsonFileToTextArea(file) {
        readTextFile(file).then(function (text) {
          els.jsonText.value = text;
          els.jsonMessage.classList.add("is-success");
          els.jsonMessage.textContent = file.name + " 파일을 불러왔습니다.";
          els.jsonText.focus();
        }).catch(function () {
          els.jsonMessage.classList.remove("is-success");
          els.jsonMessage.textContent = "파일을 읽지 못했습니다.";
        });
      }

      function hasDroppedFiles(event) {
        var types = event.dataTransfer && event.dataTransfer.types;
        return Boolean(types && Array.prototype.indexOf.call(types, "Files") !== -1);
      }

      function isImportMode() {
        return store.jsonMode === "import" && els.jsonModal.classList.contains("is-open");
      }

      function readTextFile(file) {
        if (file.text) {
          return file.text();
        }
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve(String(reader.result || ""));
          };
          reader.onerror = reject;
          reader.readAsText(file, "utf-8");
        });
      }

      function copyJsonText() {
        var text = els.jsonText.value;
        function fallbackCopy() {
          els.jsonText.focus();
          els.jsonText.select();
          document.execCommand("copy");
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast("복사했습니다.");
          }).catch(function () {
            fallbackCopy();
            showToast("복사했습니다.");
          });
          return;
        }
        fallbackCopy();
        showToast("복사했습니다.");
      }

      async function exportJsonFile() {
        var data = getExportData();
        var saved = await saveJsonDocumentFile(data);
        if (saved) {
          showToast("JSON 문서 파일로 저장했습니다.");
        }
      }

      async function saveJsonDocumentFile(data) {
        var fileName = createStableFileName(data.title, "txt");
        var content = JSON.stringify(data, null, 2) + "\n";
        if (window.showDirectoryPicker) {
          return await saveRememberedDirectoryTextFile(JSON_DIRECTORY_HANDLE_KEY, createFileHandleKey("json", data), fileName, content, "text/plain;charset=utf-8", JSON_DIRECTORY_PICKER_ID);
        }
        return await saveRememberedTextFile(createFileHandleKey("json", data), fileName, content, "text/plain;charset=utf-8", "텍스트 문서", "txt", JSON_PICKER_ID);
      }

      async function saveRememberedDirectoryTextFile(handleKey, fallbackHandleKey, fileName, content, mimeType, pickerId) {
        var storedDirectory = await getStoredFileHandle(handleKey);
        if (storedDirectory && await verifyWritePermission(storedDirectory)) {
          try {
            await writeDirectoryTextFile(storedDirectory, fileName, content);
            return true;
          } catch (error) {
            console.warn("Remembered directory could not be written.", error);
            await deleteStoredFileHandle(handleKey);
          }
        }

        try {
          showToast("저장할 thinking-canvas 폴더를 선택해주세요.");
          var directory = await pickSaveDirectory(pickerId);
          if (!await verifyWritePermission(directory)) {
            showToast("폴더 저장 권한이 필요합니다.");
            return false;
          }
          await writeDirectoryTextFile(directory, fileName, content);
          await storeFileHandle(handleKey, directory);
          return true;
        } catch (error) {
          if (error && error.name === "AbortError") {
            showToast("폴더 선택을 취소했습니다.");
            return false;
          }
          console.warn("Directory picker failed.", error);
        }

        return await saveRememberedTextFile(fallbackHandleKey, fileName, content, mimeType, "텍스트 문서", "txt", JSON_PICKER_ID);
      }

      async function saveRememberedTextFile(handleKey, fileName, content, mimeType, description, extension, pickerId) {
        if (window.showSaveFilePicker) {
          var storedHandle = await getStoredFileHandle(handleKey);
          if (storedHandle && await verifyWritePermission(storedHandle)) {
            try {
              await writeFileHandle(storedHandle, content);
              return true;
            } catch (error) {
              console.warn("Remembered file handle could not be written.", error);
              await deleteStoredFileHandle(handleKey);
            }
          }

          try {
            var handle = await pickSaveFile(fileName, mimeType, description, extension, pickerId);
            await writeFileHandle(handle, content);
            await storeFileHandle(handleKey, handle);
            return true;
          } catch (error) {
            if (error && error.name === "AbortError") {
              showToast("파일 저장을 취소했습니다.");
              return false;
            }
            console.warn("Save picker failed.", error);
          }
        }
        downloadTextFile(fileName, content, mimeType);
        return true;
      }

      async function saveTextFile(fileName, content, mimeType, description, extension) {
        if (window.showSaveFilePicker) {
          try {
            var handle = await pickSaveFile(fileName, mimeType, description, extension);
            await writeFileHandle(handle, content);
            return true;
          } catch (error) {
            if (error && error.name === "AbortError") {
              showToast("파일 저장을 취소했습니다.");
              return false;
            }
          }
        }
        downloadTextFile(fileName, content, mimeType);
        return true;
      }

      function pickSaveFile(fileName, mimeType, description, extension, pickerId) {
        var cleanMimeType = mimeType.split(";")[0];
        var accept = {};
        var options = {
          suggestedName: fileName,
          types: [{ description: description, accept: accept }]
        };
        accept[cleanMimeType] = ["." + extension];
        if (pickerId) {
          options.id = pickerId;
        }
        return window.showSaveFilePicker(options);
      }

      function pickSaveDirectory(pickerId) {
        var options = {
          mode: "readwrite"
        };
        if (pickerId) {
          options.id = pickerId;
        }
        return window.showDirectoryPicker(options);
      }

      async function writeDirectoryTextFile(directoryHandle, fileName, content) {
        var fileHandle = await directoryHandle.getFileHandle(fileName, { create: true });
        await writeFileHandle(fileHandle, content);
      }

      async function writeFileHandle(handle, content) {
        var writable = await handle.createWritable();
        await writable.write(content);
        await writable.close();
      }

      async function verifyWritePermission(handle) {
        if (!handle || !handle.queryPermission) {
          return true;
        }
        var options = { mode: "readwrite" };
        if (await handle.queryPermission(options) === "granted") {
          return true;
        }
        if (!handle.requestPermission) {
          return false;
        }
        return await handle.requestPermission(options) === "granted";
      }

      async function getStoredFileHandle(key) {
        try {
          return await withFileHandleStore("readonly", function (store) {
            return store.get(key);
          });
        } catch (error) {
          console.warn("Stored file handle could not be read.", error);
          return null;
        }
      }

      async function storeFileHandle(key, handle) {
        try {
          await withFileHandleStore("readwrite", function (store) {
            return store.put(handle, key);
          });
        } catch (error) {
          console.warn("File handle could not be remembered.", error);
        }
      }

      async function deleteStoredFileHandle(key) {
        try {
          await withFileHandleStore("readwrite", function (store) {
            return store.delete(key);
          });
        } catch (error) {
          console.warn("Stored file handle could not be deleted.", error);
        }
      }

      async function withFileHandleStore(mode, callback) {
        var db = await openFileHandleDb();
        if (!db) {
          return null;
        }
        return new Promise(function (resolve, reject) {
          var transaction = db.transaction(FILE_HANDLE_STORE, mode);
          var request;
          try {
            request = callback(transaction.objectStore(FILE_HANDLE_STORE));
          } catch (error) {
            db.close();
            reject(error);
            return;
          }
          request.onsuccess = function () {
            resolve(request.result);
          };
          request.onerror = function () {
            reject(request.error);
          };
          transaction.oncomplete = function () {
            db.close();
          };
          transaction.onerror = function () {
            reject(transaction.error);
            db.close();
          };
        });
      }

      function openFileHandleDb() {
        if (!window.indexedDB) {
          return Promise.resolve(null);
        }
        return new Promise(function (resolve, reject) {
          var request = window.indexedDB.open(FILE_HANDLE_DB_NAME, 1);
          request.onupgradeneeded = function () {
            var db = request.result;
            if (!db.objectStoreNames.contains(FILE_HANDLE_STORE)) {
              db.createObjectStore(FILE_HANDLE_STORE);
            }
          };
          request.onsuccess = function () {
            resolve(request.result);
          };
          request.onerror = function () {
            reject(request.error);
          };
        });
      }

      function downloadTextFile(fileName, content, mimeType) {
        var blob = new Blob([content], { type: mimeType });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);
      }

      function createFileName(title, extension) {
        var base = createFileBaseName(title);
        var stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
        return base + "-" + stamp + "." + extension;
      }

      function createStableFileName(title, extension) {
        return createFileBaseName(title) + "." + extension;
      }

      function createFileBaseName(title) {
        return String(title || "thinking-canvas")
          .trim()
          .replace(/[\\/:*?"<>|]+/g, "-")
          .replace(/\s+/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "")
          .slice(0, 60) || "thinking-canvas";
      }

      function createFileHandleKey(kind, data) {
        return kind + ":" + createFileBaseName(data && data.title);
      }

      function createStandaloneHtml(data) {
        var html = "<!doctype html>\n" + document.documentElement.outerHTML;
        var embeddedState = {
          savedAt: Date.now(),
          data: data
        };
        var savedStateScript = '<script type="application/json" id="thinking-canvas-saved-state">\n' +
          escapeJsonForHtml(JSON.stringify(embeddedState, null, 2)) +
          '\n</scr' + 'ipt>\n';
        html = html.replace(/\s*<script[^>]+id=["']thinking-canvas-saved-state["'][\s\S]*?<\/script>\s*/i, "\n");
        if (/<\/body>/i.test(html)) {
          return html.replace(/<\/body>/i, savedStateScript + "</body>");
        }
        return html + savedStateScript;
      }

      function createStaticSnapshotHtml(data) {
        var padding = 56;
        var blocks = data.blocks || [];
        var minX = blocks.length ? Math.min.apply(null, blocks.map(function (block) { return Number(block.x) || 0; })) : 0;
        var minY = blocks.length ? Math.min.apply(null, blocks.map(function (block) { return Number(block.y) || 0; })) : 0;
        var maxX = blocks.length ? Math.max.apply(null, blocks.map(function (block) { return (Number(block.x) || 0) + getBlockWidth(block); })) : CARD_WIDTH;
        var maxY = blocks.length ? Math.max.apply(null, blocks.map(function (block) { return (Number(block.y) || 0) + getBlockHeight(block); })) : CARD_HEIGHT;
        var width = Math.max(720, Math.round(maxX - minX + padding * 2));
        var height = Math.max(460, Math.round(maxY - minY + padding * 2));
        var projected = new Map();
        var categories = data.categories || {};
        var snapshotConnections = data.connections || [];

        blocks.forEach(function (block) {
          projected.set(block.id, {
            id: block.id,
            title: block.title,
            subtitle: block.subtitle,
            detail: block.detail,
            link: block.link,
            images: getBlockImages(block),
            category: block.category,
            type: block.type,
            color: getDiagramBlockColor(data, block),
            x: Math.round((Number(block.x) || 0) - minX + padding),
            y: Math.round((Number(block.y) || 0) - minY + padding)
          });
        });

        function findProjectedConnectionByKey(key) {
          return snapshotConnections.find(function (connection) {
            return getConnectionKey(connection) === key;
          }) || null;
        }

        function resolveProjectedEndpoint(endpointId, excludedConnectionKey) {
          if (projected.has(endpointId)) {
            return projected.get(endpointId);
          }
          var parsed = parseConnectionLabelEndpointId(endpointId);
          if (!parsed || parsed.key === excludedConnectionKey) {
            return null;
          }
          var connection = findProjectedConnectionByKey(parsed.key);
          if (!connection || !getConnectionLabel(connection)) {
            return null;
          }
          var from = projected.get(connection.from);
          var to = projected.get(connection.to);
          if (!from || !to) {
            return null;
          }
          var point = getConnectionLabelPoint(from, to);
          var size = getConnectionLabelSize(connection);
          return {
            id: String(endpointId),
            x: point.x - size.width / 2,
            y: point.y - size.height / 2,
            width: size.width,
            height: size.height
          };
        }

        var paths = snapshotConnections.map(function (connection) {
          var key = getConnectionKey(connection);
          var from = resolveProjectedEndpoint(connection.from, key);
          var to = resolveProjectedEndpoint(connection.to, key);
          if (!from || !to) {
            return "";
          }
          return '<path d="' + escapeHtml(getConnectionPath(from, to, data.connectionStyle)) + '"></path>';
        }).join("\n        ");

        var connectionLabels = snapshotConnections.map(function (connection) {
          var key = getConnectionKey(connection);
          var label = getConnectionLabel(connection);
          var ioType = getConnectionIoType(connection);
          var ioLabel = getConnectionIoLabel(ioType);
          var from = resolveProjectedEndpoint(connection.from, key);
          var to = resolveProjectedEndpoint(connection.to, key);
          if (!label || !from || !to) {
            return "";
          }
          var point = getConnectionLabelPoint(from, to);
          var labelWidth = Math.max(56, Math.ceil(estimateTextWidth(label, 12) + (ioLabel ? estimateTextWidth(ioLabel, 9) + 42 : 22)));
          return '<foreignObject x="' + Math.round(point.x - labelWidth / 2) + '" y="' + Math.round(point.y - 15) + '" width="' + labelWidth + '" height="30">' +
            '<div xmlns="http://www.w3.org/1999/xhtml" class="conn-label' + (ioType ? ' is-' + ioType : '') + '">' +
            (ioLabel ? '<span class="conn-type">' + escapeHtml(ioLabel) + '</span>' : "") +
            '<span class="conn-text">' + escapeHtml(label) + '</span></div></foreignObject>';
        }).filter(Boolean).join("\n        ");

        var cards = Array.from(projected.values()).map(function (block) {
          var category = categories[block.category] || {};
          var color = validColor(block.color) ? block.color : (category && validColor(category.color) ? category.color : FALLBACK_COLOR);
          var summary = getBlockSubtitle(block);
          var link = isValidLink(block.link) ? String(block.link).trim() : "";
          return '<article class="card" style="left:' + block.x + 'px;top:' + block.y + 'px;width:' + getBlockWidth(block) + 'px;--color:' + color + ';" title="' + escapeHtml(block.title || "제목 없음") + '">\n' +
            '          <strong>' + escapeHtml(block.title || "제목 없음") + '</strong>\n' +
            (summary ? '          <span>' + escapeHtml(summary) + '</span>\n' : "") +
            (link ? '          <a href="' + escapeHtml(link) + '" target="_blank" rel="noopener">🔗</a>\n' : "") +
            '        </article>';
        }).join("\n        ");

        var memoItems = blocks.map(function (block) {
          var link = isValidLink(block.link) ? String(block.link).trim() : "";
          var images = getBlockImages(block);
          var imageMarkup = images.map(function (image) {
            return '<figure><img src="' + escapeHtml(image.data) + '" alt="' + escapeHtml(image.name || "첨부 이미지") + '"><figcaption>' + escapeHtml(image.name || "첨부 이미지") + '</figcaption></figure>';
          }).join("");
          return '<section class="memo-item">\n' +
            '          <h2>' + escapeHtml(block.title || "제목 없음") + '</h2>\n' +
            (block.subtitle ? '          <p>' + escapeHtml(block.subtitle) + '</p>\n' : "") +
            (link ? '          <p><a href="' + escapeHtml(link) + '" target="_blank" rel="noopener">자료 링크</a></p>\n' : "") +
            '          <pre>' + escapeHtml(block.detail || "") + '</pre>\n' +
            (imageMarkup ? '          <div class="memo-images">' + imageMarkup + '</div>\n' : "") +
            '        </section>';
        }).join("\n        ");

        var json = JSON.stringify(data, null, 2);

        return '<!doctype html>\n' +
          '<html lang="ko">\n' +
          '<head>\n' +
          '  <meta charset="utf-8">\n' +
          '  <meta name="viewport" content="width=device-width, initial-scale=1">\n' +
          '  <title>' + escapeHtml(data.title || "생각블록 캔버스") + '</title>\n' +
          '  <style>\n' +
